<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJS STUDIO - V2.8.8 STABLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Native Zstandard Web Integration Framework Bundle Source -->
    <script src="./zstd-bundle.js"></script>

    <style>
        :root {
            --bg: #1a1a1a;
            --thickness: 4px;
            --accent: #ffcc33;
            --panel: #111;
            --text: #e0e0e0;
            --node-card: #252525;
            --border: #000;
            --font-family: 'Finger Paint', cursive;
            --bg-image: linear-gradient(rgba(0,0,0,0.3) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px);
        }

        body.theme-retro   { --bg:#444444; --accent:#ff5722; --panel:#2a2a2a; --text:#eeeeee; --node-card:#333333; --border:#000; }
        body.theme-matrix  { --bg:#050505; --accent:#00ff66; --panel:#0d0d0d; --text:#00ff66; --node-card:#141414; --border:#00ff66; }
        body.theme-nova    { --bg:#120024; --accent:#b026ff; --panel:#090012; --text:#e0b0ff; --node-card:#1c0035; --border:#000; }
        body.theme-toon    { --bg:#000000; --accent:#ffffff; --panel:#000000; --text:#ffffff; --node-card:#000000; --border:#ffffff; --thickness:6px; }
        body.theme-shadow  { --bg:#1c1e22; --accent:#00f0ff; --panel:#111215; --text:#c0c5cd; --node-card:#242930; --border:#00f0ff; --thickness:3px; }
        body.theme-crimson { --bg:#141414; --accent:#ff2a4b; --panel:#0b0b0b; --text:#f5f5f5; --node-card:#1f1f1f; --border:#ff2a4b; --thickness:4px; }

        body.root-shenanigans {
            --bg: #1a1a1a;
            --thickness: 4px;
            --accent: #ffcc33;
            --panel: #111;
            --text: #e0e0e0;
            --node-card: #252525;
            --border: #000;
            --font-family: 'Finger Paint', bold;
            --bg-image: linear-gradient(rgba(0,0,0,0.3) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px);
        }

        body.root-shenanigans.theme-retro   { --bg:#444444; --accent:#ff5722; --panel:#2a2a2a; --text:#eeeeee; --node-card:#333333; --border:#000; }
        body.root-shenanigans.theme-matrix  { --bg:#050505; --accent:#00ff66; --panel:#0d0d0d; --text:#00ff66; --node-card:#141414; --border:#00ff66; }
        body.root-shenanigans.theme-nova    { --bg:#120024; --accent:#b026ff; --panel:#090012; --text:#e0b0ff; --node-card:#1c0035; --border:#000; }
        body.root-shenanigans.theme-toon    { --bg:#000000; --accent:#ffffff; --panel:#000000; --text:#ffffff; --node-card:#000000; --border:#ffffff; --thickness:6px; }
        body.root-shenanigans.theme-shadow  { --bg:#1c1e22; --accent:#00f0ff; --panel:#111215; --text:#c0c5cd; --node-card:#242930; --border:#00f0ff; --thickness:3px; }
        body.root-shenanigans.theme-crimson { --bg:#141414; --accent:#ff2a4b; --panel:#0b0b0b; --text:#f5f5f5; --node-card:#1f1f1f; --border:#ff2a4b; --thickness:4px; }

        * {
            font-family: var(--font-family);
            box-sizing: border-box;
            outline: none;
            border-radius: 0 !important;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            background-image: var(--bg-image);
            background-size: 50px 50px;
            color: var(--text);
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        body.theme-custom-saved {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .sidebar {
            width: 380px;
            min-width: 380px;
            background: var(--panel);
            border-right: var(--thickness) solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 5px 0 0 rgba(0,0,0,0.2);
            height: 100%;
            overflow-y: auto;
            transition: background 0.2s, border-color 0.2s;
        }

        .sidebar-header {
            padding: 20px 25px 12px 25px;
            border-bottom: var(--thickness) solid var(--border);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .engine-status { 
            font-size: 0.7rem; 
            padding: 4px 8px; 
            background: #222; 
            border: 1px solid #444; 
            width: fit-content; 
            margin: 0 auto; 
            color: #fff;
        }

        .layout-toggle-container {
            margin: 12px 15px 4px 15px;
            display: flex;
            gap: 0;
            border: var(--thickness) solid var(--border);
            box-shadow: 4px 4px 0px #000;
            overflow: hidden;
        }

        .btn-layout-toggle {
            flex: 1;
            padding: 9px 6px;
            font-size: 0.65rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
            background: var(--node-card);
            color: var(--text);
            transition: background 0.15s, color 0.15s;
            border-right: var(--thickness) solid var(--border);
        }

        .btn-layout-toggle:last-child { border-right: none; }

        .btn-layout-toggle.active {
            background: #00f2ff;
            color: #000;
        }

        .theme-container {
            margin: 10px 15px;
            padding: 10px;
            background: #000;
            border: var(--thickness) solid var(--border);
            box-shadow: 4px 4px 0px #000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        body.theme-toon .theme-container { border-color: #fff; box-shadow: 4px 4px 0px #fff; }

        .theme-control-row { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; }
        .theme-container label { font-size: 0.65rem; color: var(--accent); text-transform: uppercase; }
        .theme-select { background: #111; color: #fff; border: 2px solid var(--border); padding: 5px; font-size: 0.75rem; cursor: pointer; flex-grow: 1; }

        .jjs-action-container { padding: 12px 15px; background: #000; margin: 0 15px 15px 15px; border: var(--thickness) solid var(--border); box-shadow: 4px 4px 0px #000; display: flex; gap: 10px; }
        body.theme-toon .jjs-action-container { border-color: #fff; box-shadow: 4px 4px 0px #fff; }

        .btn-jjs-action { flex: 1; padding: 12px; border: var(--thickness) solid var(--border); background: var(--panel); color: var(--text); font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s, box-shadow 0.1s; }
        .btn-jjs-action i { font-size: 0.9rem; color: var(--accent); }
        body.theme-toon .btn-jjs-action i { color: #fff; }
        .btn-jjs-action:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px var(--border); background: var(--accent); color: #000; }
        .btn-jjs-action:hover i { color: #000; }
        body.theme-toon .btn-jjs-action:hover { box-shadow: 4px 4px 0px #fff; background: #fff; color: #000; }

        .container-heading { padding: 0 15px; font-size: 0.65rem; color: var(--accent); opacity: 0.8; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; }
        .container-list { padding: 0 15px 15px 15px; display: block; flex-grow: 1; overflow-y: auto; }

        .item { padding: 18px; background: var(--node-card); margin-bottom: 12px; cursor: pointer; border: var(--thickness) solid var(--border); box-shadow: 4px 4px 0px #000; transition: transform 0.1s, box-shadow 0.1s, background 0.2s; }
        body.theme-toon .item { box-shadow: 4px 4px 0px #fff; }
        .item:hover { background: #333; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
        body.theme-retro .item:hover { background: #4a4a4a; }
        body.theme-matrix .item:hover { background: #1f1f1f; }
        body.theme-nova .item:hover { background: #2d0050; }
        body.theme-toon .item:hover { background: #222; box-shadow: 6px 6px 0px #fff; }
        
        .item.active { background: var(--accent); color: #000; }
        body.theme-toon .item.active { background: #fff; color: #000; }
        .item.active .type-tag, .item.active .move-name { color: inherit; }
        
        .item .type-tag { font-size: 0.65rem; color: var(--accent); text-transform: uppercase; }
        body.theme-toon .item .type-tag { color: #888; }
        .item .move-name { display: block; font-size: 1.2rem; color: var(--text); }
        body.theme-toon .item.active .move-name { color: #000; }

        .jjs-bar { display: flex; align-items: center; width: 100%; height: 42px; border: var(--thickness) solid var(--border); background: var(--node-card); color: var(--text); box-shadow: 4px 4px 0px #000; font-size: 0.85rem; cursor: pointer; margin-bottom: 12px; }

        .main { flex: 1; overflow-y: auto; padding: 40px; height: 100%; display: flex; flex-direction: column; }

        .editor-header { display: flex; flex-direction: column; gap: 15px; border-left: var(--thickness) solid var(--accent); padding-left: 20px; margin-bottom: 40px; }
        .btn-delete-container { background: #ff4d4d; color: #000; border: var(--thickness) solid var(--border); padding: 10px 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.75rem; text-transform: uppercase; box-shadow: 3px 3px 0px #000; transition: transform 0.1s, box-shadow 0.1s; }
        .btn-delete-container:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000; filter: brightness(1.1); }
        
        .tooltip-field { background: #000; border: var(--thickness) solid var(--border); padding: 12px; max-width: 400px; margin-top: 10px; box-shadow: 5px 5px 0px #000; }
        body.theme-toon .tooltip-field { border-color: #fff; box-shadow: 5px 5px 0px #fff; }
        .tooltip-field label { display: block; font-size: 0.65rem; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; }
        .tooltip-field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem; border-bottom: 2px solid #333; }

        .node-card { background: var(--panel); border: var(--thickness) solid var(--border); margin-bottom: 20px; overflow: hidden; box-shadow: 6px 6px 0px rgba(0,0,0,1); transition: background 0.2s, border-color 0.2s; }
        body.theme-toon .node-card { box-shadow: 6px 6px 0px #fff; }

        .node-head { background: #222; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: var(--thickness) solid var(--border); user-select: none; }
        .node-head:hover { filter: brightness(1.2); }
        body.theme-retro  .node-head { background: #1a1a1a; }
        body.theme-matrix .node-head { background: #0a0a0a; }
        body.theme-nova   .node-head { background: #15002a; }
        body.theme-toon   .node-head { background: #ffffff; }
        body.theme-toon   .node-head strong { color: #000000 !important; }

        .node-head strong { color: var(--accent); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        .btn-delete-node { background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.1rem; padding: 5px; transition: color 0.1s; }
        .btn-delete-node:hover { color: #ff1a1a; }

        .node-grid { padding: 25px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }

        .field { background: #000; border: calc(var(--thickness)/2) solid var(--border); padding: 12px; box-shadow: 4px 4px 0px #000; }
        body.theme-toon .field { border-color: #fff; box-shadow: 4px 4px 0px #fff; }
        .field label { display: block; font-size: 0.65rem; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        body.theme-matrix .field label { color: #00aa44; }
        body.theme-nova   .field label { color: #8a4dbb; }
        body.theme-toon   .field label { color: #aaa; }
        .field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem; border-bottom: 2px solid #222; }
        
        .timeline-track-canvas { display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.25); padding: 20px; border: var(--thickness) solid var(--border); box-shadow: 5px 5px 0px #000; margin-top: 15px; }
        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 1.5rem; color: #555; text-transform: uppercase; }

        .jjs-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 999; display: none; align-items: center; justify-content: center; }
        .jjs-modal-box { background: var(--panel); border: var(--thickness) solid var(--border); width: 480px; max-width: 90%; box-shadow: 10px 10px 0px rgba(0,0,0,1); }
        body.theme-toon .jjs-modal-box { box-shadow: 10px 10px 0px #fff; }

        .jjs-modal-header { background: #000; padding: 15px 20px; border-bottom: var(--thickness) solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .jjs-modal-title { color: var(--accent); text-transform: uppercase; font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 8px; }
        body.theme-toon .jjs-modal-title { color: #fff; }
        .jjs-modal-close { background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.1rem; }
        .jjs-modal-body { padding: 20px; }
        .jjs-modal-textarea { width: 100%; height: 150px; background: #000; color: var(--text); border: calc(var(--thickness)/2) solid var(--border); padding: 12px; font-size: 0.8rem; resize: none; font-family: monospace !important; }
        .jjs-modal-footer { padding: 0 20px 20px 20px; display: flex; justify-content: flex-end; gap: 10px; }
        .btn-modal-confirm { background: var(--accent); color: #000; border: calc(var(--thickness)/2) solid var(--border); padding: 10px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        body.theme-toon .btn-modal-confirm { background: #fff; }

        /* Blender-style Context Menu */
        .context-menu {
            position: fixed; display: none; background: #000; border: var(--thickness) solid var(--border);
            box-shadow: 6px 6px 0px #000; z-index: 9999; padding: 5px 0; min-width: 180px;
        }
        body.theme-toon .context-menu { border-color: #fff; box-shadow: 6px 6px 0px #fff; }
        .context-menu .menu-item {
            padding: 10px 15px; font-size: 0.75rem; color: var(--text); cursor: pointer; text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center; font-weight: bold;
        }
        .context-menu .menu-item:hover { background: var(--accent); color: #000; }
        body.theme-toon .context-menu .menu-item:hover { background: #fff; color: #000; }
        .context-menu .menu-separator { height: var(--thickness); background: var(--border); margin: 5px 0; }
        .context-menu .menu-label { padding: 5px 15px; font-size: 0.6rem; color: #666; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0; color: var(--accent); text-transform: uppercase; font-size: 1.6rem;">JJS STUDIO</h2>
        <span style="font-size:0.7rem; color:#555;">V2.8.8 STABLE</span>
        <div id="engine-info" class="engine-status">CHECKING...</div>
    </div>

    <div class="layout-toggle-container">
        <button class="btn-layout-toggle active" id="btn-layout-editor" onclick="switchActiveLayout('editor')">Studio</button>
        <button class="btn-layout-toggle" id="btn-layout-tracks" onclick="switchActiveLayout('tracks')">Shenanigans</button>
    </div>

    <div class="theme-container">
        <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
            <label>Select Workspace Theme</label>
        </div>
        <div class="theme-control-row">
            <select class="theme-select" id="global-theme-picker" onchange="previewTheme(this.value)">
                <option value="default" selected>Default Dark</option>
                <option value="retro">Comic Retro</option>
                <option value="matrix">Midnight Matrix</option>
                <option value="nova">Moonlit Nova</option>
                <option value="toon">Toon Slate</option>
                <option value="shadow">Cyber Shadow</option>
                <option value="crimson">Crimson</option>
            </select>
        </div>
    </div>

    <div class="jjs-action-container">
        <button class="btn-jjs-action" onclick="openJJSModal('import')" style="background: var(--accent); color: #000;">
            <i class="fa-solid fa-file-import" style="color: #000;"></i> Import
        </button>
        <button class="btn-jjs-action" onclick="openJJSModal('export')" style="background: #00f2ff; color: #000;">
            <i class="fa-solid fa-file-export" style="color: #000;"></i> Export
        </button>
    </div>

    <div class="container-heading" id="sidebar-list-heading">Moveset List</div>
    <div class="container-list" id="sidebar-dynamic-list">
        <!-- Injected Dynamically -->
    </div>
</div>

<div class="main" id="main-timeline">
    <!-- Injected Dynamically -->
</div>

<!-- Blender Style Add Menu -->
<div id="shift-a-menu" class="context-menu">
    <div class="menu-label">Create Structure</div>
    <div class="menu-item" onclick="createNewContainer()">
        <span><i class="fa-solid fa-folder-plus" style="margin-right:8px;"></i>New Container</span>
    </div>
    <div class="menu-separator"></div>
    <div class="menu-label">Add Data Node</div>
    <div class="menu-item" onclick="createNewNode('ANIM')">ANIM</div>
    <div class="menu-item" onclick="createNewNode('WAIT')">WAIT</div>
    <div class="menu-item" onclick="createNewNode('SFX')">SFX</div>
    <div class="menu-item" onclick="createNewNode('VELO')">VELO</div>
</div>

<div class="jjs-modal-overlay" id="jjs-system-modal" onclick="closeJJSModal(event)">
    <div class="jjs-modal-box" onclick="event.stopPropagation()">
        <div class="jjs-modal-header">
            <h3 class="jjs-modal-title" id="modal-title-text"><i class="fa-solid fa-terminal"></i> Terminal System</h3>
            <button class="jjs-modal-close" onclick="closeJJSModal(null)"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="jjs-modal-body">
            <textarea class="jjs-modal-textarea" id="modal-io-box"></textarea>
        </div>
        <div class="jjs-modal-footer">
            <button class="btn-modal-confirm" id="modal-action-btn" onclick="executeModalAction()">Apply</button>
        </div>
    </div>
</div>

<script>
    let zstd = null;
    let activeModalMode = '';
    let currentLayout = 'editor';
    let allContainers = []; 
    let activeContainerIndex = 0;
    let mouseX = 0, mouseY = 0;

    const MASTER_SCHEMA = {
        "ANIM": { "SPEED": 1, "FadeTime": 0.1, "Looped": false, "Weight": 1, "ANIM_USE": "New_Anim" },
        "WAIT": { "TIME": 0.1 },
        "SFX": { "SoundId": 0, "Volume": 0.5, "Pitch": 1 },
        "VELO": { "Velocity": "0,0,0", "Duration": 0.5 }
    };

    async function init() {
        const engine = window.ZstdWeb || window.zstd || window.Zstd;
        if (engine?.init) { 
            await engine.init(); 
            zstd = engine; 
            document.getElementById('engine-info').innerHTML = "ENGINE STATUS: <span style='color:#00ffcc; font-weight:bold;'>ZSTD (ACTIVE)</span>";
        } else {
            document.getElementById('engine-info').innerHTML = "ENGINE STATUS: <span style='color:#ffaa00; font-weight:bold;'>ZSTD (STANDBY)</span>";
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        init();
        const savedLayout = localStorage.getItem('jjs_studio_active_layout') || 'editor';
        switchActiveLayout(savedLayout);
    });

    // Global Mouse Tracker & Shift+A Listener
    document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    
    document.addEventListener('keydown', e => {
        if (e.shiftKey && e.key.toLowerCase() === 'a') {
            e.preventDefault();
            const menu = document.getElementById('shift-a-menu');
            menu.style.display = 'block';
            menu.style.left = Math.min(mouseX, window.innerWidth - menu.offsetWidth - 10) + 'px';
            menu.style.top = Math.min(mouseY, window.innerHeight - menu.offsetHeight - 10) + 'px';
        }
    });

    document.addEventListener('click', e => {
        if (!e.target.closest('#shift-a-menu')) {
            document.getElementById('shift-a-menu').style.display = 'none';
        }
    });

    // Helper functions to safely parse and save inner data structures
    function getInnerData(container) {
        if (!container) return { Line: [] };
        if (typeof container.DATA === 'string') {
            try { return JSON.parse(container.DATA); } catch(e) { return { Line: [] }; }
        } else if (typeof container.DATA === 'object') {
            return container.DATA;
        } else if (container.Line) {
            return { Line: container.Line };
        }
        return { Line: [] };
    }

    function saveInnerData(container, innerData) {
        if (container.DATA !== undefined && typeof container.DATA === 'string') {
            container.DATA = JSON.stringify(innerData);
        } else if (container.DATA !== undefined && typeof container.DATA === 'object') {
            container.DATA = innerData;
        } else {
            container.Line = innerData.Line;
        }
    }

    function createNewContainer() {
        document.getElementById('shift-a-menu').style.display = 'none';
        allContainers.push({ NAME: "New Container", K_NAME: "BUILD", DATA: JSON.stringify({ Line: [] }) });
        renderSidebarContents();
        selectContainer(allContainers.length - 1);
    }

    function createNewNode(type) {
        document.getElementById('shift-a-menu').style.display = 'none';
        if (allContainers.length === 0) return alert("Please create or select a container first.");
        
        let container = allContainers[activeContainerIndex];
        let innerData = getInnerData(container);
        let line = innerData.Line || [];
        
        let newNode = { K_NAME: type };
        Object.assign(newNode, MASTER_SCHEMA[type] || {});
        line.push(newNode);
        
        saveInnerData(container, innerData);
        selectContainer(activeContainerIndex);
    }

    function deleteContainer(index) {
        if (confirm("Are you sure you want to delete this container?")) {
            allContainers.splice(index, 1);
            activeContainerIndex = Math.min(activeContainerIndex, allContainers.length - 1);
            if (activeContainerIndex < 0) activeContainerIndex = 0;
            renderSidebarContents();
            renderWorkspaceContents();
        }
    }

    function deleteNode(cIndex, nIndex) {
        if (confirm("Delete this node?")) {
            let container = allContainers[cIndex];
            let innerData = getInnerData(container);
            innerData.Line.splice(nIndex, 1);
            saveInnerData(container, innerData);
            selectContainer(cIndex);
        }
    }

    function toggleNode(nodeId) {
        const grid = document.getElementById(`node-grid-${nodeId}`);
        grid.style.display = grid.style.display === 'none' ? 'grid' : 'none';
    }

    function getNodeSummary(node) {
        if (node.K_NAME === 'ANIM') return `[${node.ANIM_USE || 'Unset'}]`;
        if (node.K_NAME === 'WAIT') return `[${node.TIME || 0}s]`;
        if (node.K_NAME === 'SFX') return `[ID: ${node.SoundId || 0}]`;
        if (node.K_NAME === 'VELO') return `[${node.Velocity || '0,0,0'}]`;
        if (['SKILL', 'SPECIAL', 'AWAKENING', 'BUILD'].includes(node.K_NAME)) return `[${node.NAME || 'Unnamed'}]`;
        const keys = Object.keys(node).filter(k => k !== 'K_NAME' && k !== 'PREVIEW');
        if (keys.length > 0) return `[${node[keys[0]]}]`;
        return '';
    }

    function switchActiveLayout(layoutMode) {
        currentLayout = layoutMode;
        localStorage.setItem('jjs_studio_active_layout', layoutMode);
        document.getElementById('btn-layout-editor').classList.toggle('active', layoutMode === 'editor');
        document.getElementById('btn-layout-tracks').classList.toggle('active', layoutMode === 'tracks');
        document.body.classList.toggle('root-shenanigans', layoutMode === 'tracks');
        renderSidebarContents();
        renderWorkspaceContents();
    }

    function renderSidebarContents() {
        const heading = document.getElementById('sidebar-list-heading');
        const list = document.getElementById('sidebar-dynamic-list');
        list.innerHTML = '';
        heading.innerText = "Moveset List";

        if (allContainers.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding-top: 30px; font-size: 0.8rem; color: #555;">No build loaded yet. Paste via the Import action.</div>';
            return;
        }

        allContainers.forEach((c, i) => {
            const btn = document.createElement('div');
            btn.className = 'item';
            btn.id = `btn-${i}`;
            if (i === activeContainerIndex) btn.classList.add('active');
            btn.onclick = () => selectContainer(i);
            
            btn.innerHTML = `
                <span class="type-tag">${c.K_NAME || 'BUILD'}</span>
                <span class="move-name">${c.NAME || 'UNNAMED'}</span>
            `;
            list.appendChild(btn);
        });
    }

    function renderWorkspaceContents() {
        const workspace = document.getElementById('main-timeline');
        workspace.innerHTML = '';

        if (allContainers.length === 0) {
            workspace.innerHTML = '<div class="empty-state">LOAD A BUILD OR PRESS SHIFT+A TO CREATE A CONTAINER</div>';
            return;
        }
        selectContainer(activeContainerIndex);
    }

    function loadCode(rawInput) {
        if (!rawInput) return;
        try {
            if (rawInput.startsWith('[') || rawInput.startsWith('{')) {
                allContainers = JSON.parse(rawInput);
            } else {
                if (!zstd) { alert("Zstd Engine not initialized yet! Please wait."); return; }
                const bin = Uint8Array.from(atob(rawInput.trim()), c => c.charCodeAt(0));
                allContainers = JSON.parse(new TextDecoder().decode(zstd.decompress(bin)));
            }

            if (!Array.isArray(allContainers)) allContainers = [allContainers];
            activeContainerIndex = 0;
            renderSidebarContents();
            renderWorkspaceContents();
        } catch (e) {
            alert("Import Failed: Check your data.");
        }
    }

    function selectContainer(index) {
        if (allContainers.length === 0) return;
        activeContainerIndex = index;

        document.querySelectorAll('.item').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${index}`);
        if (activeBtn) activeBtn.classList.add('active');
        
        const container = allContainers[index];
        const timeline = document.getElementById('main-timeline');
        let moveData = getInnerData(container).Line || [];

        if (currentLayout === 'editor') {
            let html = `
                <div class="editor-header">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h1 style="margin:0; font-size:2.5rem; text-transform:uppercase;">${container.NAME || 'UNNAMED'}</h1>
                        <button onclick="deleteContainer(${index})" class="btn-delete-container">
                            <i class="fa-solid fa-trash"></i> DELETE CONTAINER
                        </button>
                    </div>
                    <div class="tooltip-field">
                        <label>Internal Container Name</label>
                        <input readonly value="${container.K_NAME || 'BUILD'}">
                    </div>
                </div>
            `;
            
            moveData.forEach((node, i) => {
                html += `
                    <div class="node-card" id="node-${i}">
                        <div class="node-head" onclick="toggleNode(${i})" style="cursor: pointer;">
                            <div style="display:flex; align-items:center; gap: 10px;">
                                <strong>${node.K_NAME}</strong>
                                <span style="color: #888; font-size: 0.8rem; font-family: monospace;">${getNodeSummary(node)}</span>
                            </div>
                            <div style="display:flex; align-items:center; gap: 15px;">
                                <span style="color:var(--accent); font-size: 0.8rem; font-weight:bold;">#${i+1}</span>
                                <button onclick="deleteNode(${index}, ${i}); event.stopPropagation();" class="btn-delete-node">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="node-grid" id="node-grid-${i}" style="display: none;">${renderProps(node.K_NAME, node)}</div>
                    </div>
                `;
            });
            timeline.innerHTML = html;
        } else {
            let html = `
                <div class="editor-header">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h1 style="margin:0; font-size:2.5rem; text-transform:uppercase;">SHENANIGANS TRACK</h1>
                        <button onclick="deleteContainer(${index})" class="btn-delete-container">
                            <i class="fa-solid fa-trash"></i> DELETE CONTAINER
                        </button>
                    </div>
                    <div class="tooltip-field">
                        <label>Global Module Identification Context</label>
                        <input value="Shenanigans_Profile_Core_${container.K_NAME || 'BUILD'}" readonly>
                    </div>
                </div>
                <div class="node-card">
                    <div class="node-head"><strong>Active Target Properties</strong></div>
                    <div class="node-grid" style="display:grid;">
                        <div class="field"><label>Playback Speed</label><input value="1.00" readonly></div>
                        <div class="field"><label>Global Interpolation</label><input value="Linear" readonly></div>
                        <div class="field"><label>Safety Assert Override</label><input value="disabled" readonly></div>
                        <div class="field"><label>Frame Padding Count</label><input value="4" readonly></div>
                    </div>
                </div>
                <div class="node-card">
                    <div class="node-head"><strong>Sequence Timeline Tracker Canvas</strong></div>
                    <div class="timeline-track-canvas" style="padding:25px;">
            `;

            if (moveData.length === 0) {
                html += `<div style="font-size:0.75rem; color:#444; font-style:italic;">[Empty Data Line Channel]</div>`;
            } else {
                moveData.forEach((node, idx) => {
                    let nodeProperties = Object.entries(node).filter(([k]) => k !== 'K_NAME').map(([k,v]) => `${k}:${v}`).slice(0, 2).join(', ');
                    html += `
                        <div class="jjs-bar" style="margin-bottom:8px;">
                            <div class="jjs-bar-icon-box" style="color:var(--accent);"><span style="font-size:0.7rem;">#${idx+1}</span></div>
                            <div class="jjs-bar-text" style="font-size:0.75rem; display:flex; justify-content:space-between; padding-right:15px; font-weight:normal;">
                                <span style="font-weight:bold; color:var(--text)">[${node.K_NAME}] <span style="color:#888; font-family:monospace;">${getNodeSummary(node)}</span></span>
                                <span style="color:#777; font-family:monospace !important;">${nodeProperties}</span>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div></div>`;
            timeline.innerHTML = html;
        }
    }

    function renderProps(type, node) {
        let html = '';
        const data = { ...node };
        if (data.PREVIEW && Array.isArray(data.PREVIEW)) { data.START = data.PREVIEW[0]; data.END = data.PREVIEW[1]; }
        const temp = MASTER_SCHEMA[type] || {};
        const keys = new Set([...Object.keys(temp), ...Object.keys(data)]);
        
        Array.from(keys).sort().forEach(k => {
            if (k === 'K_NAME' || k === 'PREVIEW' || k === 'ANIM_USE') return;
            const val = data[k] !== undefined ? data[k] : temp[k];
            const styleAttribute = data[k] !== undefined ? 'style="color: var(--accent);"' : 'style="opacity: 0.5;"';
            html += `<div class="field"><label>${k}</label><input readonly value="${val}" ${styleAttribute}></div>`;
        });
        return html;
    }

    function previewTheme(styleName) {
        const isShena = document.body.classList.contains('root-shenanigans');
        document.body.className = '';
        if (isShena) document.body.classList.add('root-shenanigans');
        if (styleName !== 'default') document.body.classList.add('theme-' + styleName);
    }

    function openJJSModal(mode) {
        activeModalMode = mode;
        const overlay = document.getElementById('jjs-system-modal');
        const titleEl = document.getElementById('modal-title-text');
        const ioBox = document.getElementById('modal-io-box');
        const actionBtn = document.getElementById('modal-action-btn');

        ioBox.value = '';
        overlay.style.display = 'flex';

        if (mode === 'import') {
            titleEl.innerHTML = '<i class="fa-solid fa-file-import"></i> Unified Import Center';
            ioBox.placeholder = "Paste raw text/JSON or base64 Zstd compressed sequence stream here...";
            ioBox.readOnly = false;
            actionBtn.innerText = "Execute Import";
        } else if (mode === 'export') {
            titleEl.innerHTML = '<i class="fa-solid fa-file-export"></i> Unified Export Center';
            ioBox.readOnly = true;
            actionBtn.innerText = "Copy Stream";

            if (allContainers.length === 0) {
                ioBox.value = "[]";
                return;
            }

            try {
                if (!zstd) {
                    ioBox.value = JSON.stringify(allContainers, null, 2);
                } else {
                    const bin = zstd.compress(new TextEncoder().encode(JSON.stringify(allContainers)), 3);
                    let str = "";
                    for (let i = 0; i < bin.length; i++) str += String.fromCharCode(bin[i]);
                    ioBox.value = btoa(str);
                }
            } catch(e) { ioBox.value = JSON.stringify(allContainers, null, 2); }
        }
    }

    function closeJJSModal(e) {
        if (!e || e.target === document.getElementById('jjs-system-modal')) {
            document.getElementById('jjs-system-modal').style.display = 'none';
        }
    }

    function executeModalAction() {
        const ioBox = document.getElementById('modal-io-box');
        if (activeModalMode === 'export') {
            ioBox.select();
            document.execCommand('copy');
            alert('Data copied to clipboard!');
            closeJJSModal(null);
        } else if (activeModalMode === 'import') {
            loadCode(ioBox.value.trim());
            closeJJSModal(null);
        }
    }
</script>
</body>
</html>
