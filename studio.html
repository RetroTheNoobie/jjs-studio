<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJS Studio - V1.3.1 (Read-Only Workshop)</title>
    <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="./zstd-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style id="custom-theme-style"></style>
    <style>
        * { text-transform: none !important; box-sizing: border-box; font-family: 'Finger Paint', cursive; border-radius: 0 !important; outline: none; }
        
        .uppercase-force, .topbar-btn, .sidebar-header h2, .btn-jjs-action, .container-heading, .workspace-tab, .menu-label, .node-head strong, .anim-cat-header, .workshop-tab, .prompt-title { text-transform: uppercase !important; }

        :root {
            --bg: #121317; --panel: #1a1c23; --node-card: #222530; --accent: #ffcc33; --text: #e2e8f0; --border: #2d313f; --thickness: 3px;
            --font-code: 'Finger Paint', cursive; --bg-image: none; --bg-opacity: 1;
        }

        body.theme-retro   { --bg: #3c3f41; --panel: #2b2b2b; --node-card: #313335; --accent: #ff5722; --text: #f5f5f5; --border: #000000; }
        body.theme-matrix  { --bg: #030704; --panel: #0a0f0d; --node-card: #121a16; --accent: #00ff66; --text: #33ff77; --border: #00ff66; }
        body.theme-nova    { --bg: #0f051d; --panel: #18092b; --node-card: #240e42; --accent: #cc33ff; --text: #f3e8ff; --border: #4a1d8a; }
        body.theme-cyber   { --bg: #1c1e22; --panel: #111215; --node-card: #242930; --accent: #00f0ff; --text: #c0c5cd; --border: #00f0ff; --thickness: 3px; }
        body.theme-crimson { --bg: #141414; --panel: #0b0b0b; --node-card: #1f1f1f; --accent: #ff2a4b; --text: #f5f5f5; --border: #ff2a4b; --thickness: 4px; }
        body.theme-super-dark { --bg: #000000; --panel: #050505; --node-card: #0a0a0a; --accent: #ffffff; --text: #e0e0e0; --border: #1f1f1f; --thickness: 2px; }

        body { margin: 0; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        
        body::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: var(--bg-image); background-size: cover; background-position: center;
            opacity: var(--bg-opacity); z-index: -1; pointer-events: none;
        }

        .topbar { flex-shrink: 0; height: 50px; background: var(--panel); border-bottom: var(--thickness) solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 15px; z-index: 50; }
        .topbar-btn { background: transparent; color: var(--text); border: none; border-bottom: 3px solid transparent; font-weight: bold; cursor: pointer; height: 100%; padding: 0 15px; font-size: 0.85rem; transition: 0.2s; }
        .topbar-btn:hover { color: var(--accent); border-bottom-color: var(--accent); }

        .app-body { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 380px; min-width: 380px; background: var(--panel); border-right: var(--thickness) solid var(--border); display: flex; flex-direction: column; z-index: 10; height: 100%; box-shadow: 5px 0 0 rgba(0,0,0,0.2); }
        .sidebar-header { padding: 25px; border-bottom: var(--thickness) solid var(--border); text-align: center; }
        .engine-status { font-size: 0.7rem; padding: 6px 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); width: fit-content; margin: 10px auto 0 auto; }
        
        .jjs-action-container { padding: 20px 15px; display: flex; flex-direction: column; gap: 10px; border-bottom: var(--thickness) solid var(--border); }
        .jjs-action-row { display: flex; gap: 10px; width: 100%; }
        .btn-jjs-action { flex: 1; padding: 12px; border: var(--thickness) solid var(--border); background: rgba(0,0,0,0.2); color: var(--text); font-weight: bold; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.15s; }
        .btn-jjs-action i { font-size: 0.9rem; color: var(--accent); }
        .btn-jjs-action:hover { background: var(--accent); color: #000; }
        .btn-jjs-action:hover i { color: #000; }

        .container-heading { padding: 15px 20px 5px 20px; font-size: 0.7rem; color: var(--accent); letter-spacing: 1px; }
        .container-list { padding: 10px 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex-grow: 1; }
        .item { padding: 15px; background: var(--node-card); cursor: pointer; border: var(--thickness) solid var(--border); transition: 0.1s; }
        .item:hover { background: rgba(255,255,255,0.05); }
        .item.active { background: var(--accent); color: #000 !important; border-color: var(--border); }
        .item.active .type-tag, .item.active .move-name { color: #000 !important; }
        .item .type-tag { font-size: 0.65rem; color: var(--cont-color, var(--accent)); display: block; margin-bottom: 2px; }
        .item .move-name { display: block; font-size: 1.1rem; color: var(--text); }

        .main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 40px; height: 100%; display: block; background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px); background-size: 30px 30px; position: relative; }

        .editor-header { display: flex; flex-direction: column; gap: 15px; border-left: var(--thickness) solid var(--accent); padding-left: 20px; margin-bottom: 25px; transition: border-color 0.2s; }
        .btn-delete-container { background: #ff4d4d; color: #fff; border: var(--thickness) solid var(--border); padding: 10px 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.75rem; transition: 0.1s; }
        .btn-delete-container:hover { transform: translate(-2px, -2px); filter: brightness(1.1); }
        .container-fields-row { display: flex; gap: 15px; }
        .tooltip-field { background: rgba(0,0,0,0.8); border: 1px solid var(--border); padding: 12px; flex: 1; }
        .tooltip-field label { display: block; font-size: 0.65rem; color: var(--accent); margin-bottom: 5px; }
        .tooltip-field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem; border-bottom: 2px solid #333; }

        .branch-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
        .branch-tab { background: var(--panel); border: var(--thickness) solid var(--border); padding: 8px 16px; color: var(--text); font-size: 0.8rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.1s; }
        .branch-tab:hover { background: rgba(255,255,255,0.1); }
        .branch-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .branch-tab .edit-icon, .branch-tab .delete-icon { opacity: 0.6; font-size: 0.7rem; padding: 4px; transition: opacity 0.1s; }
        .branch-tab .edit-icon:hover { opacity: 1; } .branch-tab.active .edit-icon { color: #000; }
        .branch-tab .delete-icon { color: #ff4d4d; } .branch-tab .delete-icon:hover { opacity: 1; color: #ff1a1a; } .branch-tab.active .delete-icon { color: #cc0000; }
        .branch-add-btn { background: var(--panel); border: 2px solid #00ff66; color: #00ff66; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .branch-add-btn:hover { background: #00ff66; color: #000; }

        .workspace-tabs { display: flex; gap: 5px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .workspace-tab { flex: 1; background: rgba(0,0,0,0.5); border: none; padding: 12px; color: var(--text); opacity: 0.5; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; }
        .workspace-tab:hover { opacity: 0.8; background: rgba(255,255,255,0.05); }
        .workspace-tab.active { opacity: 1; color: var(--accent); border-bottom: 3px solid var(--accent); background: rgba(0,0,0,0.8); }

        .node-card { background: var(--panel); border: var(--thickness) solid var(--border); border-left: 6px solid var(--node-color, var(--border)) !important; margin-bottom: 20px; overflow: hidden; box-shadow: 6px 6px 0px rgba(0,0,0,0.6); transition: 0.1s; position: relative; }
        .node-card.selected { border-color: var(--node-color, var(--accent)); box-shadow: 0 0 15px var(--node-color, rgba(255, 204, 51, 0.5)); transform: translateY(-2px); }
        .node-head { background: rgba(0,0,0,0.3); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: var(--thickness) solid var(--border); user-select: none; cursor: pointer; }
        .node-head:hover { background: rgba(255,255,255,0.03); }
        .node-title-group { display: flex; align-items: center; gap: 12px; }
        .node-title-group strong { color: var(--node-color, var(--accent)); font-size: 1rem; }
        .node-summary-tag { color: #8892b0; font-size: 0.8rem; }
        .btn-delete-node, .btn-comment-node { background: transparent; border: none; cursor: pointer; font-size: 1.1rem; padding: 5px; transition: color 0.1s; }
        .btn-delete-node { color: #ff4d4d; } .btn-delete-node:hover { color: #ff1a1a; }
        .btn-comment-node { color: #a0aec0; } .btn-comment-node:hover { color: #fff; }

        .node-grid { padding: 25px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; background: rgba(0,0,0,0.1); }
        .field { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 12px; }
        .field label { display: block; font-size: 0.65rem; color: #8892b0; margin-bottom: 6px; }
        .field input, .field select { width: 100%; background: transparent; border: none; color: #fff; font-size: 0.95rem; border-bottom: 1px solid var(--border); }
        .field input:disabled { opacity: 0.5; border-bottom: none; cursor: not-allowed; }
        .field input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; border-bottom: none; }

        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 1.3rem; color: #4f566b; text-align: center; line-height: 1.8; }
        .gui-scale-bar { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.6); padding: 10px 20px; border: 1px solid var(--border); margin-bottom: 20px; font-size: 0.75rem; }
        .gui-scale-bar input[type="range"] { flex-grow: 1; cursor: pointer; accent-color: var(--accent); }

        .context-menu { position: fixed; display: none; background: #090a0f; border: var(--thickness) solid var(--border); z-index: 10000; padding: 5px 0; min-width: 220px; max-height: 450px; overflow-y: auto; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); }
        .context-menu .menu-label { padding: 6px 15px; font-size: 0.65rem; color: var(--accent); letter-spacing: 0.5px; background: rgba(255,255,255,0.02); }
        .context-menu .menu-item { padding: 10px 15px; font-size: 0.75rem; color: var(--node-color, #e2e8f0); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.1s; }
        .context-menu .menu-item i { color: var(--node-color, var(--accent)); opacity: 0.8; }
        .context-menu .menu-item:hover { background: var(--node-color, var(--accent)); color: #000; }
        .context-menu .menu-item:hover i { color: #000; }
        .context-menu .menu-separator { height: 1px; background: var(--border); margin: 5px 0; }

        /* Modals */
        .jjs-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10001; display: none; align-items: center; justify-content: center; }
        .jjs-modal-box { background: var(--panel); border: var(--thickness) solid var(--border); width: 550px; max-width: 90%; display: flex; flex-direction: column; max-height: 90vh; }
        .jjs-modal-header { background: rgba(0,0,0,0.5); padding: 20px; border-bottom: var(--thickness) solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .jjs-modal-title { color: var(--accent); font-size: 1.1rem; margin: 0; }
        .jjs-modal-close { background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.2rem; }
        .jjs-modal-close:hover { color: #ff1a1a; }
        .jjs-modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .jjs-modal-footer { padding: 0 20px 20px 20px; display: flex; justify-content: flex-end; gap: 12px; }
        
        .jjs-modal-textarea { width: 100%; height: 220px; background: #090a0f; color: #00ff66; border: 1px solid var(--border); padding: 15px; font-size: 0.85rem; resize: none; }
        .jjs-modal-input { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: #fff; font-size: 1rem; }
        .btn-modal-confirm { background: var(--accent); color: #000; border: 1px solid var(--border); padding: 10px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase !important; transition: filter 0.1s; }
        .btn-modal-confirm:hover { filter: brightness(1.2); }

        .anim-cat-header { font-weight: bold; padding: 12px 18px; margin-top: 6px; cursor: pointer; border: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); font-size: 0.85rem; }
        .anim-cat-content { display: none; padding: 8px; background: rgba(0,0,0,0.6); border: 2px solid var(--border); border-top: none; flex-direction: column; gap: 5px; }
        .anim-item-row { padding: 8px 14px; cursor: pointer; font-size: 0.85rem; color: #fff; transition: background 0.1s; display: flex; justify-content: space-between; }
        .anim-item-row:hover { background: var(--accent); color: #000; }

        /* Workshop & Drag */
        #drag-indicator { position: fixed; height: 4px; background-color: #00ffcc; z-index: 10000; pointer-events: none; box-shadow: 0 0 10px #00ffcc; display: none; }
        .drag-ghost { position: fixed; pointer-events: none; z-index: 9999; opacity: 0.6; filter: brightness(1.3); }

        #workshop-window { position: fixed; top: 100px; left: 100px; width: 750px; height: 550px; background: var(--panel); border: var(--thickness) solid var(--border); z-index: 9000; display: none; flex-direction: column; box-shadow: 10px 10px 0px rgba(0,0,0,0.6); }
        .workshop-header { padding: 15px; background: rgba(0,0,0,0.5); cursor: move; display: flex; justify-content: space-between; align-items: center; border-bottom: var(--thickness) solid var(--border); }
        .workshop-tabs { display: flex; border-bottom: 2px solid var(--border); overflow-x: auto; background: rgba(0,0,0,0.3); }
        .workshop-tab { flex-shrink: 0; padding: 12px 15px; background: transparent; border: none; color: var(--text); opacity: 0.5; font-weight: bold; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; }
        .workshop-tab.active { opacity: 1; color: var(--accent); border-bottom-color: var(--accent); background: rgba(0,0,0,0.4); }
        .workshop-content { padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

        /* Detail Slide-out Notification Panel */
        #workshop-detail-panel { position: fixed; top: 0; right: -40vw; width: 35vw; height: 100vh; background: var(--panel); border-left: var(--thickness) solid var(--border); z-index: 9500; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.5); transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; padding: 30px; }
        #workshop-detail-panel.open { right: 0; }
        .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 20px; }
        .detail-title { font-size: 1.8rem; color: var(--accent); margin: 0; line-height: 1.2; word-break: break-word; text-transform: uppercase !important; }
        .detail-preview-img { width: 100%; height: auto; max-height: 320px; object-fit: contain; background: #000; border: var(--thickness) solid var(--border); margin-bottom: 20px; display: block; }
        .detail-desc-container { background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; position: relative; }
        .detail-desc-text { line-height: 1.6; color: #cbd5e0; word-break: break-word; overflow: hidden; transition: max-height 0.2s ease; }
        .detail-desc-text.collapsed { max-height: 75px; }
        .detail-desc-toggle { background: transparent; border: none; color: var(--accent); font-size: 0.75rem; cursor: pointer; padding: 4px 0 0 0; margin-top: 5px; display: inline-block; text-transform: uppercase !important; }
        .detail-author { font-size: 0.85rem; color: #a0aec0; margin-bottom: 30px; }
        .detail-actions { display: flex; gap: 12px; align-items: center; margin-top: auto; }
        .btn-detail-load { flex: 1; background: #00ff66; color: #000; font-size: 1rem; padding: 15px; border: var(--thickness) solid var(--border); font-weight: bold; cursor: pointer; transition: 0.1s; text-transform: uppercase !important; }
        .btn-detail-load:hover { filter: brightness(1.1); }
        .btn-detail-fav { width: 54px; height: 54px; min-width: 54px; background: rgba(0,0,0,0.4); border: var(--thickness) solid var(--border); color: var(--accent); font-size: 1.4rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.1s; }
        .btn-detail-fav:hover { background: rgba(255,255,255,0.05); }

        #selection-banner { position: fixed; top: 50px; left: 380px; right: 0; height: 50px; background: rgba(255, 204, 51, 0.9); color: #000; display: none; align-items: center; justify-content: space-between; padding: 0 30px; z-index: 80; font-weight: bold; text-transform: uppercase; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="topbar">
    <button class="topbar-btn" onclick="openWorkshop()">Workshop <i class="fa-solid fa-toolbox" style="margin-left:5px;"></i></button>
    <button class="topbar-btn" onclick="openCustomNodeBuilder()">Custom Node Builder <i class="fa-solid fa-hammer" style="margin-left:5px;"></i></button>
    <button class="topbar-btn" onclick="openThemesUI()">Themes <i class="fa-solid fa-palette" style="margin-left:5px;"></i></button>
    <button class="topbar-btn" onclick="showShortcuts()"><i class="fa-solid fa-keyboard" style="margin-right:5px;"></i> Shortcuts</button>
    <div style="flex-grow:1;"></div>
</div>

<div class="app-body">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2 style="margin:0; color: var(--accent); font-size: 1.5rem; letter-spacing: 1px;">JJS Studio</h2>
            <div id="engine-status-box" class="engine-status">Loading...</div>
        </div>

        <div class="jjs-action-container">
            <div class="jjs-action-row">
                <button class="btn-jjs-action" onclick="openIOModal('import')"><i class="fa-solid fa-file-import"></i> Import</button>
                <button class="btn-jjs-action" onclick="openIOModal('export')"><i class="fa-solid fa-file-export"></i> Export</button>
            </div>
            <div id="manual-redirect-container" style="display:none; width: 100%;">
                <button class="btn-jjs-action" style="background: #ff5722; color: #fff; border-color: #000;" onclick="window.open('https://qizhengmo.github.io/Omni/', '_blank')">
                    <i class="fa-solid fa-life-ring"></i> Manual Encoding/Decoding
                </button>
            </div>
        </div>

        <div class="container-heading">Containers</div>
        <div class="container-list" id="sidebar-render-target"></div>
    </div>

    <div class="main" id="workspace-canvas-timeline"></div>
</div>

<div id="drag-indicator"></div>
<div id="selection-banner">
    <span id="selection-banner-text">Click between nodes to place download...</span>
    <div>
        <button class="btn-modal-confirm" style="background: #e2e8f0; margin-right: 10px;" onclick="cancelPlaceMode()">Cancel</button>
    </div>
</div>

<div id="shift-a-context-menu" class="context-menu">
    <div class="menu-label">Create Container</div>
    <div class="menu-item" style="--node-color: #FF6666;" onclick="instantiateContainer('Skill')">Skill <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" style="--node-color: #00FF00;" onclick="instantiateContainer('Melee')">Melee <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" style="--node-color: #FF9933;" onclick="instantiateContainer('Special')">Special <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" style="--node-color: #FFFF00;" onclick="instantiateContainer('Awakening')">Awakening <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" style="--node-color: #7FFFD4;" onclick="instantiateContainer('Chase')">Chase <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-separator"></div>
    <div class="menu-label" id="context-menu-nodes-label">Add Node</div>
    <div id="context-menu-nodes-target"></div>
</div>

<div class="jjs-modal-overlay" id="jjs-prompt-modal" style="z-index: 10005;">
    <div class="jjs-modal-box" style="width: 450px;">
        <div class="jjs-modal-header">
            <h3 class="jjs-modal-title prompt-title" id="prompt-title">Notice</h3>
        </div>
        <div class="jjs-modal-body">
            <p id="prompt-message" style="margin:0; line-height:1.6; font-size:0.9rem;"></p>
        </div>
        <div class="jjs-modal-footer" id="prompt-buttons"></div>
    </div>
</div>

<div class="jjs-modal-overlay" id="jjs-input-modal" style="z-index: 10005;">
    <div class="jjs-modal-box" style="width: 450px;">
        <div class="jjs-modal-header">
            <label for="input-modal-field" class="jjs-modal-title prompt-title" id="input-modal-title">Input</label>
            <button class="jjs-modal-close" onclick="document.getElementById('jjs-input-modal').style.display='none'"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="jjs-modal-body">
            <input type="text" id="input-modal-field" name="modalInput" class="jjs-modal-input" placeholder="...">
        </div>
        <div class="jjs-modal-footer">
            <button class="btn-modal-confirm" id="input-modal-confirm">Confirm</button>
        </div>
    </div>
</div>

<div class="jjs-modal-overlay" id="jjs-io-modal" onclick="closeIOModal(event)">
    <div class="jjs-modal-box" onclick="event.stopPropagation()">

    function buildPropertyFieldsMarkup(node, nodeIdx, context = 'Timeline') {
        let fieldsHtml = ''; const schemaFields = (context === 'Conditions' ? CONDITION_TEMPLATES[node.K_NAME] : NODE_TEMPLATES[node.K_NAME]) || Object.keys(node);
        schemaFields.forEach(fieldKey => {
            if (fieldKey === 'K_NAME' || fieldKey === '_COMMENT') return;
            let randomizedInputId = `fld-node-${nodeIdx}-${fieldKey.replace(/\s+/g, '-')}`;
            
            if (fieldKey === 'Animation' || fieldKey === 'ANIM_USE') {
                let currentVal = node.ANIM_USE || [1, 1]; let matchedLabel = "Select Animation Asset";
                for (let cat in ANIMATION_DICTIONARY) { let match = ANIMATION_DICTIONARY[cat].animations.find(a => a.val[0] === currentVal[0] && a.val[1] === currentVal[1]); if (match) { matchedLabel = match.name; break; } }
                fieldsHtml += `<div class="field" style="grid-column: span 2;"><label for="${randomizedInputId}">Animation Asset Lookup</label><button id="${randomizedInputId}" class="branch-tab" style="width: 100%; border: 1px solid var(--border); background: rgba(0,0,0,0.5); text-transform:none !important;" onclick="triggerAnimMenu(${nodeIdx})"><i class="fa-solid fa-clapperboard"></i> ${matchedLabel} [${currentVal.join(', ')}]</button></div>`;
                return;

            if (node.K_NAME === 'BRANCH' && fieldKey === 'RANDOM') {
                const availableBranches = ["", "Default", ...(getInnerData(currentMoves[activeIndex]).Branch ? Object.keys(getInnerData(currentMoves[activeIndex]).Branch) : [])];
                let val = node[fieldKey] !== undefined ? node[fieldKey] : "";

                fieldsHtml += `<div class="field"><label for="${randomizedInputId}">RANDOM (Existing Target Branch)</label><select id="${randomizedInputId}" name="randomBranchSelection" style="width:100%; color:#fff; background:transparent; border:none; border-bottom:1px solid var(--border);" onchange="alterNodeValue(${nodeIdx}, 'RANDOM', this.value)">${opts}</select></div>`;
                return;
            }

            const currentVal = node[fieldKey] !== undefined ? node[fieldKey] : DEFAULTS_LIB[fieldKey]; let markup = '';
            if (typeof currentVal === 'boolean' || currentVal === 'true' || currentVal === 'false') { markup = `<input type="checkbox" id="${randomizedInputId}" name="${fieldKey}" ${(currentVal === true || currentVal === 'true') ? 'checked' : ''} onchange="pushHistory(); alterNodeValue(${nodeIdx}, '${fieldKey}', this.checked)">`; } 
            else if (Array.isArray(currentVal)) { markup = `<input type="text" id="${randomizedInputId}" name="${fieldKey}" value="${currentVal.join(', ')}" oninput="pushHistory(); alterNodeValue(${nodeIdx}, '${fieldKey}', this.value.split(',').map(n => parseFloat(n.trim()) || n.trim()))">`; }

            fieldsHtml += `<div class="field"><label for="${randomizedInputId}">${fieldKey}</label>${markup}</div>`;
        });
        return fieldsHtml;
    }

    function previewTheme(styleName) { document.body.className = ''; document.getElementById('custom-theme-style').innerHTML = ''; if (styleName !== 'default' && styleName !== 'custom') document.body.classList.add('theme-' + styleName); localStorage.setItem('jjs-theme-pref', styleName); }
    
    function openThemesUI() {
        const content = document.getElementById('themes-modal-content'); const savedThemes = JSON.parse(localStorage.getItem('jjs-saved-themes') || '[]');
        let savedHtml = savedThemes.map((t, i) => `<button class="btn-jjs-action" onclick="applySavedTheme(${i})">${t.name}</button>`).join('');
        if(!savedHtml) savedHtml = `<div style="opacity:0.5; font-size:0.8rem; text-align:center;">No saved themes yet.</div>`;

        content.innerHTML = `
            <div style="display:flex; flex-direction:column; gap:8px; border-bottom:2px solid var(--border); padding-bottom:15px; margin-bottom:5px;"><strong style="color:var(--accent); font-size:0.8rem;" class="uppercase-force">Pre-Made Themes</strong><div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"><button class="btn-jjs-action" onclick="previewTheme('default')">Default Dark</button><button class="btn-jjs-action" onclick="previewTheme('super-dark')">Super Dark</button><button class="btn-jjs-action" onclick="previewTheme('retro')">Retro</button><button class="btn-jjs-action" onclick="previewTheme('matrix')">Matrix</button><button class="btn-jjs-action" onclick="previewTheme('nova')">Nova</button><button class="btn-jjs-action" onclick="previewTheme('cyber')">Cyber</button><button class="btn-jjs-action" onclick="previewTheme('crimson')">Crimson</button></div></div>
            <div style="display:flex; flex-direction:column; gap:8px; border-bottom:2px solid var(--border); padding-bottom:15px; margin-bottom:5px;"><strong style="color:var(--accent); font-size:0.8rem;" class="uppercase-force">Saved Themes</strong><div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">${savedHtml}</div></div>
            <div style="padding:10px 0;"><button class="btn-jjs-action" style="width:100%; border-color:#00ff66; color:#00ff66;" onclick="renderThemeMaker()"><i class="fa-solid fa-paintbrush"></i> Create New Theme</button></div>
        `;
        document.getElementById('jjs-themes-modal').style.display = 'flex';
    }

    function renderThemeMaker() {
        const content = document.getElementById('themes-modal-content'); const s = JSON.parse(localStorage.getItem('jjs-custom-colors')) || { name:"My Theme", bg:"#121317", panel:"#1a1c23", card:"#222530", accent:"#ffcc33", text:"#e2e8f0", border:"#2d313f", bgimg:"", bgop:1 };
        content.innerHTML = `
            <button class="btn-jjs-action" style="margin-bottom:15px; background:transparent;" onclick="openThemesUI()"><i class="fa-solid fa-arrow-left"></i> Back</button><strong style="color:var(--accent); font-size:0.8rem; margin-bottom:10px;" class="uppercase-force">Theme Editor</strong>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <div class="tooltip-field" style="display:flex; align-items:center; justify-content:space-between;"><label for="ct-name">Theme Name</label><input type="text" id="ct-name" name="themeName" value="${s.name||'Custom'}" style="width:60%; text-align:right;"></div>
                <div class="tooltip-field" style="display:flex; align-items:center; justify-content:space-between;"><label for="ct-bgimg">BG Image URL</label><input type="text" id="ct-bgimg" name="themeBgImg" value="${s.bgimg||''}" style="width:60%; text-align:right;"></div>
                <div class="tooltip-field" style="display:flex; align-items:center; justify-content:space-between;"><label for="ct-bgop">BG Opacity</label><input type="range" id="ct-bgop" name="themeBgOp" min="0" max="1" step="0.05" value="${s.bgop||1}" style="width:60%;"></div>
                <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.4); padding:10px; border:1px solid var(--border);"><label for="ct-bg" style="font-size:0.75rem; color:#fff;">Background</label><input type="color" id="ct-bg" name="themeBgColor" value="${s.bg}"></div>
                <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.4); padding:10px; border:1px solid var(--border);"><label for="ct-panel" style="font-size:0.75rem; color:#fff;">Panel</label><input type="color" id="ct-panel" name="themePanelColor" value="${s.panel}"></div>
                <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.4); padding:10px; border:1px solid var(--border);"><label for="ct-card" style="font-size:0.75rem; color:#fff;">Node Card</label><input type="color" id="ct-card" name="themeCardColor" value="${s.card}"></div>
                <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.4); padding:10px; border:1px solid var(--border);"><label for="ct-accent" style="font-size:0.75rem; color:#fff;">Accent</label><input type="color" id="ct-accent" name="themeAccentColor" value="${s.accent}"></div>
                <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.4); padding:10px; border:1px solid var(--border);"><label for="ct-text" style="font-size:0.75rem; color:#fff;">Text</label><input type="color" id="ct-text" name="themeTextColor" value="${s.text}"></div>
                <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.4); padding:10px; border:1px solid var(--border);"><label for="ct-border" style="font-size:0.75rem; color:#fff;">Border</label><input type="color" id="ct-border" name="themeBorderColor" value="${s.border}"></div>
            </div>
            <button class="btn-modal-confirm" style="margin-top:20px; width:100%;" onclick="saveCustomTheme()">Save & Apply</button>
        `;
    }

    function saveCustomTheme() {
        const c = { name: document.getElementById('ct-name').value, bg: document.getElementById('ct-bg').value, panel: document.getElementById('ct-panel').value, card: document.getElementById('ct-card').value, accent: document.getElementById('ct-accent').value, text: document.getElementById('ct-text').value, border: document.getElementById('ct-border').value, bgimg: document.getElementById('ct-bgimg').value, bgop: document.getElementById('ct-bgop').value };
        localStorage.setItem('jjs-custom-colors', JSON.stringify(c)); let saved = JSON.parse(localStorage.getItem('jjs-saved-themes') || '[]'); const idx = saved.findIndex(t => t.name === c.name); if(idx !== -1) saved[idx] = c; else saved.push(c);
        localStorage.setItem('jjs-saved-themes', JSON.stringify(saved)); localStorage.setItem('jjs-theme-pref', 'custom'); applyThemeFromStorage(); customAlert(`Theme '${c.name}' saved and applied!`); openThemesUI();
    }
    
    function applySavedTheme(idx) { const saved = JSON.parse(localStorage.getItem('jjs-saved-themes') || '[]'); localStorage.setItem('jjs-custom-colors', JSON.stringify(saved[idx])); localStorage.setItem('jjs-theme-pref', 'custom'); applyThemeFromStorage(); }
    function closeThemesModal(e) { if (!e || e.target === document.getElementById('jjs-themes-modal')) document.getElementById('jjs-themes-modal').style.display = 'none'; }

    // --- Supabase Workshop System (Read-Only & Drag Drop Imports) ---
    function initWorkshopDragger() {
        const win = document.getElementById('workshop-window'); const header = document.getElementById('workshop-drag-header');
        let isDraggingWin = false; let offsetX, offsetY;
        header.addEventListener('mousedown', e => { if(e.target.tagName === 'BUTTON' || e.target.tagName === 'I') return; isDraggingWin = true; offsetX = e.clientX - win.getBoundingClientRect().left; offsetY = e.clientY - win.getBoundingClientRect().top; });
        document.addEventListener('mousemove', e => { if(isDraggingWin) { win.style.left = (e.clientX - offsetX) + 'px'; win.style.top = (e.clientY - offsetY) + 'px'; } });
        document.addEventListener('mouseup', () => isDraggingWin = false );
    }

    function openWorkshop() { document.getElementById('workshop-window').style.display = 'flex'; setWorkshopTab(currentWorkshopTab); }
    
    async function setWorkshopTab(tab) {
        currentWorkshopTab = tab; document.querySelectorAll('.workshop-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.workshop-tab').forEach(t => { if (t.innerText.trim() === tab) t.classList.add('active'); });

        let content = `<div style="display:flex; justify-content:space-between; margin-bottom:15px;"><strong style="color:var(--accent);" class="uppercase-force">${tab} Hub</strong></div>`;
        content += `<div id="ws-dynamic-content" style="text-align:center; padding:50px; opacity:0.5;">Loading from Supabase...</div>`;
        document.getElementById('workshop-content').innerHTML = content;
        
        await loadWorkshopTemplates(tab);
    }

    function renderTemplateList(templates, tab) {
        const container = document.getElementById('workshop-content');
        if (!container) return;

        if (!templates.length) { container.innerHTML = `<div style="text-align:center; padding:50px; opacity:0.5;">No items found here.</div>`; return; }
        
        let html = `<div style="display:flex; justify-content:space-between; margin-bottom:15px;"><strong style="color:var(--accent);" class="uppercase-force">${tab} Hub</strong></div>`;
        html += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">`;
        
        templates.forEach((item) => {
            let rawDesc = item.description || '';
            let descriptiveSummary = rawDesc.length > 110 ? rawDesc.substring(0, 107) + '...' : rawDesc;
            
            let thumbImageHtml = '';
            if (item.preview && item.preview.trim().startsWith('http')) {
                thumbImageHtml = `<img src="${item.preview.trim()}" crossorigin="anonymous" alt="Thumbnail preview img" style="width: 70px; height: 70px; object-fit: cover; border: 1px solid var(--border); background: #000; flex-shrink:0;">`;
            }

            html += `<div style="background:rgba(0,0,0,0.4); border:1px solid var(--border); padding:15px; display:flex; gap:12px; align-items:flex-start;">
                ${thumbImageHtml}
                <div style="flex-grow:1; min-width:0;">
                    <div style="font-weight:bold; color:#fff; font-size:1.1rem; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.title || 'Untitled'}</div>
                    <div style="font-size:0.7rem; opacity:0.6; margin-bottom:6px;">By: ${item.author || 'Anonymous'}</div>
                    <div style="font-size:0.8rem; margin-bottom:12px; color:#babbc2; height: 2.4em; overflow:hidden; line-height:1.2;">${descriptiveSummary}</div>
                    <button class="btn-modal-confirm" style="width:100%; font-size:0.75rem; background:#00f0ff; color:#000; border-color:#00f0ff;" onclick="viewItemDetails(${JSON.stringify(item).replace(/"/g, '&quot;')})"><i class="fa-solid fa-folder-open"></i> Open</button>
                </div>
            </div>`;
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    async function loadWorkshopTemplates(tab) {
        try {
            let data = [];
            let error = null;

            if (tab === 'Favorited') {
                if (userFavorites.length === 0) {
                    renderTemplateList([], tab); return;
                }
                let response = await supabaseclient
                    .from('workshop_templates')
                    .select('id, title, category, description, author, code, preview, created_at')
                    .in('id', userFavorites)
                    .order('created_at', { ascending: false });
                data = response.data; error = response.error;
            } else {
                let response = await supabaseclient
                    .from('workshop_templates')
                    .select('id, title, category, description, author, code, preview, created_at')
                    .eq('category', tab)
                    .order('created_at', { ascending: false });
                data = response.data; error = response.error;
            }

            if (error) throw error;
            renderTemplateList(data || [], tab);
        } catch (e) {
            console.error("Supabase load error:", e);
            const dyn = document.getElementById('workshop-content');
            if(dyn) dyn.innerHTML = `<div style="text-align:center; padding:50px; opacity:0.5;">Failed to query from workshop database.</div>`;
        }
    }

    // --- Dynamic 1/3 Length Expanded Preview Flow ---
    let activeDetailedViewItem = null;
    function viewItemDetails(item) {
        activeDetailedViewItem = item;
        document.getElementById('dt-title').innerText = item.title || 'Untitled';
        document.getElementById('dt-author').innerText = `Uploaded by - ${item.author || 'Anonymous'}`;
        
        const descriptionBlock = document.getElementById('dt-description');
        descriptionBlock.innerText = item.description || 'No description specified.';
        descriptionBlock.classList.add('collapsed');
        document.getElementById('dt-desc-toggle').innerText = "Show More";

        const imagePreview = document.getElementById('dt-preview');
        if (item.preview && item.preview.trim().startsWith('http')) {
            imagePreview.src = item.preview.trim();
            imagePreview.style.display = 'block';
        } else {
            imagePreview.style.display = 'none';
        }

        const favBtn = document.getElementById('dt-fav-btn');
        if (userFavorites.includes(item.id)) {
            favBtn.innerHTML = '<i class="fa-solid fa-star"></i>';
            favBtn.style.background = 'var(--accent)';
            favBtn.style.color = '#000';
        } else {
            favBtn.innerHTML = '<i class="fa-regular fa-star"></i>';
            favBtn.style.background = 'rgba(0,0,0,0.4)';
            favBtn.style.color = 'var(--accent)';
        }

        favBtn.onclick = () => toggleItemFavoriteState(item.id);
        document.getElementById('dt-load-btn').onclick = () => importTemplateToWorkspace(item.id, item.category);

        document.getElementById('workshop-detail-panel').classList.add('open');
    }

    function toggleDetailDesc() {
        const textElement = document.getElementById('dt-description');
        const toggleBtn = document.getElementById('dt-desc-toggle');
        if (textElement.classList.contains('collapsed')) {
            textElement.classList.remove('collapsed');
            toggleBtn.innerText = "Show Less";
        } else {
            textElement.classList.add('collapsed');
            toggleBtn.innerText = "Show More";
        }
    }

    function closeWorkshopDetail() {
        document.getElementById('workshop-detail-panel').classList.remove('open');
        activeDetailedViewItem = null;
    }

    function toggleItemFavoriteState(id) {
        if (userFavorites.includes(id)) {
            userFavorites = userFavorites.filter(favId => favId !== id);
        } else {
            userFavorites.push(id);
        }
        localStorage.setItem('jjs-workshop-favorites', JSON.stringify(userFavorites));
        
        if (activeDetailedViewItem && activeDetailedViewItem.id === id) {
            viewItemDetails(activeDetailedViewItem);
        }
        if (document.getElementById('workshop-window').style.display === 'flex') {
            loadWorkshopTemplates(currentWorkshopTab);
        }
    }

    async function importTemplateToWorkspace(id, tab) {
        try {
            const { data, error } = await supabaseclient.from('workshop_templates').select('code').eq('id', id).single();
            if (error) throw error;
            
            let rawVal = data?.code || "";
            let parsedPayload = [];
            
            if (typeof rawVal === 'string' && (rawVal.trim().startsWith('[') || rawVal.trim().startsWith('{'))) {
                parsedPayload = JSON.parse(rawVal);
            } else {
                if (!zstd) { customAlert("Engine standby. Please wait for ZSTD to load."); return; }
                const rawBuffer = Uint8Array.from(atob(rawVal), c => c.charCodeAt(0));
                parsedPayload = JSON.parse(new TextDecoder().decode(zstd.decompress(rawBuffer)));
            }
            if (!Array.isArray(parsedPayload)) parsedPayload = [parsedPayload];
            
            document.getElementById('workshop-window').style.display = 'none';
            closeWorkshopDetail();

            if (tab === 'TEMPLATES') {
                importPayload = parsedPayload;
                if (currentMoves.length > 0) {
                    showCustomPrompt("Conflict", "Workspace not empty. Import method?", [
                        { text: "Merge", color: "#00ff66", action: () => { pushHistory(); currentMoves = currentMoves.concat(importPayload); finalizeImport(); } },
                        { text: "Overwrite", color: "#ff4d4d", action: () => { pushHistory(); currentMoves = importPayload; finalizeImport(); } },
                        { text: "Cancel", color: "#e2e8f0", action: () => { importPayload = null; } }
                    ]);
                } else {
                    currentMoves = parsedPayload;
                    finalizeImport();
                }
            } else {
                // Look for the "WS" container
                let wsContainer = parsedPayload.find(c => c.NAME === "WS");
                if (!wsContainer) { customAlert("Invalid Workshop Item: Could not find a container named 'WS' inside this export."); return; }
                
                let innerData = getInnerData(wsContainer);
                let nodesToPlace = innerData.Line || []; 
                if (nodesToPlace.length === 0) { customAlert("The 'WS' container is empty!"); return; }

                if (activeIndex === -1 || activeTab === 'Properties') { customAlert("Please open a container's Timeline or Conditions first to place nodes."); return; }

                let innerCurrent = getInnerData(currentMoves[activeIndex]);
                let destinationList = getListFromInner(innerCurrent);
                
                // AUTOMATICALLY LOAD inside the skill container if it is currently empty instead of blue line method
                if (destinationList && destinationList.length === 0) {
                    pushHistory();
                    destinationList.push(...JSON.parse(JSON.stringify(nodesToPlace)));
                    saveInnerData(currentMoves[activeIndex], innerCurrent);
                    selectedNodes = []; 
                    loadMove(activeIndex);
                    customAlert("Container was empty. Automatically populated nodes successfully!");
                    return;
                }

                // Fallback to manual placing via blue lines if container already has items inside
                importPlaceMode = true; 
                importPayload = nodesToPlace;
                
                document.getElementById('selection-banner-text').innerText = "Click between nodes to place download...";
                document.getElementById('selection-banner').style.display = 'flex';
                const confirmBtn = document.getElementById('selection-banner').querySelector('button:last-child');
                if (confirmBtn) confirmBtn.style.display = 'none';
            }
        } catch (e) { console.error(e); customAlert("Failed to fetch or decompress workshop item."); }
    }

    function cancelPlaceMode() { 
        importPlaceMode = false; importPayload = null; 
        document.getElementById('selection-banner').style.display = 'none'; 
        document.getElementById('drag-indicator').style.display = 'none';
        selectedNodes=[]; loadMove(activeIndex); 
    }

    function openCustomNodeBuilder() { customAlert("Custom Node Builder: Use Shift+A to spawn 'CUSTOM NODE', configuring it as a logical boundary marker for export loops."); }
    
    function generateCleanExportData() {
        let clean = JSON.parse(JSON.stringify(currentMoves));
        clean.forEach(move => {
            let inner = getInnerData(move);
            const processList = (list) => {
                if(!list) return;
                for(let i = list.length - 1; i >= 0; i--) {
                    delete list[i]._COMMENT;
                    if(list[i].K_NAME === 'CUSTOM_NODE') {
                        let node = list[i];
                        let expansion = [ { "K_NAME": "TAG", "ADD/REMOVE": false, "CHECK": false, "SET": false, "VALUE": `Start [${node.NODE_ID}]` }, { "K_NAME": "TAG", "ADD/REMOVE": false, "CHECK": false, "SET": false, "VALUE": `End [MacroReconstruct]` } ];
                        list.splice(i, 1, ...expansion);
                    }
                }
            };
            processList(inner.Line); processList(inner.Req);
            for(let b in inner.Branch) { processList(inner.Branch[b].Line); processList(inner.Branch[b].Req); }
            move.DATA = JSON.stringify(inner);
        });
        return clean;
    }

    // --- IO Center Logic ---
    function executeIOAction() {
        const tx = document.getElementById('io-terminal-textarea');
        if (ioModalMode === 'export') {
            tx.select(); document.execCommand('copy'); customAlert("Data copied to clipboard!"); closeIOModal(null);
        } else if (ioModalMode === 'import') {
            const rawVal = tx.value.trim(); if (!rawVal) return;
            let pData = [];
            try {
                if (rawVal.startsWith('[') || rawVal.startsWith('{')) pData = JSON.parse(rawVal);
                else {
                    if (!zstd) { document.getElementById('manual-redirect-container').style.display='block'; customAlert("Engine standby. Use manual tool."); return; }
                    pData = JSON.parse(new TextDecoder().decode(zstd.decompress(Uint8Array.from(atob(rawVal), c => c.charCodeAt(0)))));
                }
                if (!Array.isArray(pData)) pData = [pData];
                
                if (currentMoves.length > 0) {
                    importPayload = pData;
                    showCustomPrompt("Conflict", "Workspace not empty. Import method?", [
                        { text: "Merge", color: "#00ff66", action: () => { pushHistory(); currentMoves = currentMoves.concat(importPayload); finalizeImport(); } },
                        { text: "Overwrite", color: "#ff4d4d", action: () => { pushHistory(); currentMoves = importPayload; finalizeImport(); } },
                        { text: "Cancel", color: "#e2e8f0", action: () => importPayload = null }
                    ]);
                } else { currentMoves = pData; finalizeImport(); }
            } catch(e) { document.getElementById('manual-redirect-container').style.display='block'; customAlert("Import failed. Check formatting."); }
        }
    }
    
    function finalizeImport() { activeIndex = currentMoves.length > 0 ? 0 : -1; activeBranch = 'Default'; activeTab = 'Timeline'; selectedNodes=[]; renderSidebar(); loadMove(activeIndex); closeIOModal(null); }
    
    function openIOModal(mode) {
        ioModalMode = mode; const overlay = document.getElementById('jjs-io-modal'); const title = document.getElementById('io-modal-title-text'); const tx = document.getElementById('io-terminal-textarea'); const btn = document.getElementById('io-action-button');
        tx.value = ''; overlay.style.display = 'flex';
        if (mode === 'import') { title.innerHTML = "<i class='fa-solid fa-file-import'></i> Import Data"; tx.readOnly = false; btn.innerText = "Import"; } 
        else {
            title.innerHTML = "<i class='fa-solid fa-file-export'></i> Export Data"; tx.readOnly = true; btn.innerText = "Copy to Clipboard";
            if (currentMoves.length === 0) { tx.value = "[]"; return; }
            try {
                const expData = generateCleanExportData();
                if (!zstd) tx.value = JSON.stringify(expData, null, 2); 
                else {
                    const eBin = zstd.compress(new TextEncoder().encode(JSON.stringify(expData)), 3);
                    let b64 = ""; for (let i = 0; i < eBin.length; i++) b64 += String.fromCharCode(eBin[i]);
                    tx.value = btoa(b64);
                }
            } catch (err) { tx.value = "[]"; }
        }
    }

    function closeIOModal(e) { if (!e || e.target === document.getElementById('jjs-io-modal')) document.getElementById('jjs-io-modal').style.display = 'none'; }

    window.addEventListener('DOMContentLoaded', initEngine);
</script>
