<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJS STUDIO - V2.8.8 STABLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

    <style>
        :root {
            --bg: #1a1a1a;
            --thickness: 4px;
            --accent: #ffcc33;
            --panel: #111;
            --text: #e0e0e0;
            --node-card: #252525;
            --border: #000;
            --font-family: 'Finger Paint', cursive;
            --bg-image: linear-gradient(rgba(0,0,0,0.3) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px);
        }

        body.theme-retro   { --bg:#444444; --accent:#ff5722; --panel:#2a2a2a; --text:#eeeeee; --node-card:#333333; --border:#000; }
        body.theme-matrix  { --bg:#050505; --accent:#00ff66; --panel:#0d0d0d; --text:#00ff66; --node-card:#141414; --border:#00ff66; }
        body.theme-nova    { --bg:#120024; --accent:#b026ff; --panel:#090012; --text:#e0b0ff; --node-card:#1c0035; --border:#000; }
        body.theme-toon    { --bg:#000000; --accent:#ffffff; --panel:#000000; --text:#ffffff; --node-card:#000000; --border:#ffffff; --thickness:6px; }
        body.theme-shadow  { --bg:#1c1e22; --accent:#00f0ff; --panel:#111215; --text:#c0c5cd; --node-card:#242930; --border:#00f0ff; --thickness:3px; }
        body.theme-crimson { --bg:#141414; --accent:#ff2a4b; --panel:#0b0b0b; --text:#f5f5f5; --node-card:#1f1f1f; --border:#ff2a4b; --thickness:4px; }

        body.root-shenanigans {
            --bg: #1a1a1a;
            --thickness: 4px;
            --accent: #ffcc33;
            --panel: #111;
            --text: #e0e0e0;
            --node-card: #252525;
            --border: #000;
            --font-family: 'Finger Paint', bold;
            --bg-image: linear-gradient(rgba(0,0,0,0.3) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px);
        }

        body.root-shenanigans.theme-retro   { --bg:#444444; --accent:#ff5722; --panel:#2a2a2a; --text:#eeeeee; --node-card:#333333; --border:#000; }
        body.root-shenanigans.theme-matrix  { --bg:#050505; --accent:#00ff66; --panel:#0d0d0d; --text:#00ff66; --node-card:#141414; --border:#00ff66; }
        body.root-shenanigans.theme-nova    { --bg:#120024; --accent:#b026ff; --panel:#090012; --text:#e0b0ff; --node-card:#1c0035; --border:#000; }
        body.root-shenanigans.theme-toon    { --bg:#000000; --accent:#ffffff; --panel:#000000; --text:#ffffff; --node-card:#000000; --border:#ffffff; --thickness:6px; }
        body.root-shenanigans.theme-shadow  { --bg:#1c1e22; --accent:#00f0ff; --panel:#111215; --text:#c0c5cd; --node-card:#242930; --border:#00f0ff; --thickness:3px; }
        body.root-shenanigans.theme-crimson { --bg:#141414; --accent:#ff2a4b; --panel:#0b0b0b; --text:#f5f5f5; --node-card:#1f1f1f; --border:#ff2a4b; --thickness:4px; }

        * {
            font-family: var(--font-family);
            box-sizing: border-box;
            outline: none;
            border-radius: 0 !important;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            background-image: var(--bg-image);
            background-size: 50px 50px;
            color: var(--text);
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        body.theme-custom-saved {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .sidebar {
            width: 380px;
            min-width: 380px;
            background: var(--panel);
            border-right: var(--thickness) solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 5px 0 0 rgba(0,0,0,0.2);
            height: 100%;
            overflow-y: auto;
            transition: background 0.2s, border-color 0.2s;
        }

        .sidebar-header {
            padding: 20px 25px 12px 25px;
            border-bottom: var(--thickness) solid var(--border);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .engine-status { 
            font-size: 0.7rem; 
            padding: 4px 8px; 
            background: #222; 
            border: 1px solid #444; 
            width: fit-content; 
            margin: 0 auto; 
            color: #fff;
        }

        .layout-toggle-container {
            margin: 12px 15px 4px 15px;
            display: flex;
            gap: 0;
            border: var(--thickness) solid var(--border);
            box-shadow: 4px 4px 0px #000;
            overflow: hidden;
        }

        .btn-layout-toggle {
            flex: 1;
            padding: 9px 6px;
            font-size: 0.65rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
            background: var(--node-card);
            color: var(--text);
            transition: background 0.15s, color 0.15s;
            border-right: var(--thickness) solid var(--border);
        }

        .btn-layout-toggle:last-child { border-right: none; }

        .btn-layout-toggle.active {
            background: #00f2ff;
            color: #000;
        }

        .root-toggle-container {
            margin: 4px 15px 4px 15px;
            display: flex;
            gap: 0;
            border: var(--thickness) solid var(--border);
            box-shadow: 4px 4px 0px #000;
            overflow: hidden;
        }

        .btn-root-toggle {
            flex: 1;
            padding: 9px 6px;
            font-size: 0.65rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
            background: var(--node-card);
            color: var(--text);
            transition: background 0.15s, color 0.15s;
            border-right: var(--thickness) solid var(--border);
        }

        .btn-root-toggle:last-child { border-right: none; }

        .btn-root-toggle.active {
            background: var(--accent);
            color: #000;
        }

        .theme-container {
            margin: 10px 15px;
            padding: 10px;
            background: #000;
            border: var(--thickness) solid var(--border);
            box-shadow: 4px 4px 0px #000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        body.theme-toon .theme-container { border-color: #fff; box-shadow: 4px 4px 0px #fff; }

        .theme-control-row { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; }
        .theme-container label { font-size: 0.65rem; color: var(--accent); text-transform: uppercase; }
        .theme-select { background: #111; color: #fff; border: 2px solid var(--border); padding: 5px; font-size: 0.75rem; cursor: pointer; flex-grow: 1; }
        .btn-delete-theme { display: none; background: #e74c3c; color: #fff; border: 2px solid var(--border); font-size: 0.6rem; padding: 6px 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-delete-theme:hover { background: #c0392b; }

        .custom-panel { display: none; background: #0a0a0a; margin: 0 15px 10px 15px; padding: 15px; border: var(--thickness) solid var(--border); box-shadow: 4px 4px 0px #000; }
        .custom-panel h4 { margin: 0 0 10px 0; font-size: 0.75rem; color: #fff; text-transform: uppercase; border-bottom: 2px solid #222; padding-bottom: 3px; }
        .config-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 0.6rem; color: #aaa; }
        .config-row input[type="color"] { border: none; width: 30px; height: 20px; background: transparent; cursor: pointer; }
        .config-row input[type="text"], .config-row input[type="range"] { width: 65%; background: #111; border: 1px solid #333; color: #fff; font-size: 0.6rem; padding: 4px; }

        .jjs-action-container { padding: 12px 15px; background: #000; margin: 0 15px 15px 15px; border: var(--thickness) solid var(--border); box-shadow: 4px 4px 0px #000; display: flex; gap: 10px; }
        body.theme-toon .jjs-action-container { border-color: #fff; box-shadow: 4px 4px 0px #fff; }

        .btn-jjs-action { flex: 1; padding: 12px; border: var(--thickness) solid var(--border); background: var(--panel); color: var(--text); font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s, box-shadow 0.1s; }
        .btn-jjs-action i { font-size: 0.9rem; color: var(--accent); }
        body.theme-toon .btn-jjs-action i { color: #fff; }
        .btn-jjs-action:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px var(--border); background: var(--accent); color: #000; }
        .btn-jjs-action:hover i { color: #000; }
        body.theme-toon .btn-jjs-action:hover { box-shadow: 4px 4px 0px #fff; background: #fff; color: #000; }

        .container-heading { padding: 0 15px; font-size: 0.65rem; color: var(--accent); opacity: 0.8; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; }
        .container-list { padding: 0 15px 15px 15px; display: block; flex-grow: 1; overflow-y: auto; }

        .item { padding: 18px; background: var(--node-card); margin-bottom: 12px; cursor: pointer; border: var(--thickness) solid var(--border); box-shadow: 4px 4px 0px #000; transition: transform 0.1s, box-shadow 0.1s, background 0.2s; }
        body.theme-toon .item { box-shadow: 4px 4px 0px #fff; }
        .item:hover { background: #333; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
        body.theme-retro .item:hover { background: #4a4a4a; }
        body.theme-matrix .item:hover { background: #1f1f1f; }
        body.theme-nova .item:hover { background: #2d0050; }
        body.theme-toon .item:hover { background: #222; box-shadow: 6px 6px 0px #fff; }
        
        .item.active { background: var(--accent); color: #000; }
        body.theme-toon .item.active { background: #fff; color: #000; }
        .item.active .type-tag, .item.active .move-name { color: inherit; }
        
        .item .type-tag { font-size: 0.65rem; color: var(--accent); text-transform: uppercase; }
        body.theme-toon .item .type-tag { color: #888; }
        .item .move-name { display: block; font-size: 1.2rem; color: var(--text); }
        body.theme-toon .item.active .move-name { color: #000; }

        .jjs-bar {
            display: flex;
            align-items: center;
            width: 100%;
            height: 42px;
            border: var(--thickness) solid var(--border);
            background: var(--node-card);
            color: var(--text);
            box-shadow: 4px 4px 0px #000;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .jjs-bar-icon-box {
            width: 42px; height: 100%; display: flex; align-items: center; justify-content: center; border-right: var(--thickness) solid var(--border); background: rgba(0,0,0,0.2);
        }
        .jjs-bar-icon-box svg { width: 18px; height: 18px; fill: currentColor; }
        .jjs-bar-text { flex-grow: 1; padding: 0 12px; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }

        .jjs-c-skill { border-left: calc(var(--thickness) * 2) solid #ff7b7b; }
        .jjs-c-special { border-left: calc(var(--thickness) * 2) solid #ffb37b; }
        .jjs-c-awakening { border-left: calc(var(--thickness) * 2) solid #ffff7b; }

        .main { flex: 1; overflow-y: auto; padding: 40px; height: 100%; display: block; }

        .editor-header { display: flex; flex-direction: column; gap: 15px; border-left: var(--thickness) solid var(--accent); padding-left: 20px; margin-bottom: 40px; }
        
        .tooltip-field { background: #000; border: var(--thickness) solid var(--border); padding: 12px; max-width: 400px; margin-top: 10px; box-shadow: 5px 5px 0px #000; }
        body.theme-toon .tooltip-field { border-color: #fff; box-shadow: 5px 5px 0px #fff; }
        .tooltip-field label { display: block; font-size: 0.65rem; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; }
        .tooltip-field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem; border-bottom: 2px solid #333; }

        .node-card { background: var(--panel); border: var(--thickness) solid var(--border); margin-bottom: 30px; overflow: hidden; box-shadow: 10px 10px 0px rgba(0,0,0,1); transition: background 0.2s, border-color 0.2s; }
        body.theme-toon .node-card { box-shadow: 10px 10px 0px #fff; }

        .node-head { background: #222; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: var(--thickness) solid var(--border); }
        body.theme-retro  .node-head { background: #1a1a1a; }
        body.theme-matrix .node-head { background: #0a0a0a; }
        body.theme-nova   .node-head { background: #15002a; }
        body.theme-toon   .node-head { background: #ffffff; }
        body.theme-toon   .node-head strong { color: #000000 !important; }

        .node-head strong { color: var(--accent); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }

        .node-grid { padding: 25px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }

        .field { background: #000; border: calc(var(--thickness)/2) solid var(--border); padding: 12px; box-shadow: 4px 4px 0px #000; }
        body.theme-toon .field { border-color: #fff; box-shadow: 4px 4px 0px #fff; }
        .field label { display: block; font-size: 0.65rem; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        body.theme-matrix .field label { color: #00aa44; }
        body.theme-nova   .field label { color: #8a4dbb; }
        body.theme-toon   .field label { color: #aaa; }
        .field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem; border-bottom: 2px solid #333; }
        
        .timeline-track-canvas {
            display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.25); padding: 20px; border: var(--thickness) solid var(--border); box-shadow: 5px 5px 0px #000; margin-top: 15px;
        }

        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 1.5rem; color: #555; text-transform: uppercase; }

        .jjs-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 999; display: none; align-items: center; justify-content: center; }
        .jjs-modal-box { background: var(--panel); border: var(--thickness) solid var(--border); width: 480px; max-width: 90%; box-shadow: 10px 10px 0px rgba(0,0,0,1); animation: modalPop 0.15s ease-out; }
        body.theme-toon .jjs-modal-box { box-shadow: 10px 10px 0px #fff; }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .jjs-modal-header { background: #000; padding: 15px 20px; border-bottom: var(--thickness) solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .jjs-modal-title { color: var(--accent); text-transform: uppercase; font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 8px; }
        body.theme-toon .jjs-modal-title { color: #fff; }

        .jjs-modal-close { background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.1rem; }
        .jjs-modal-close:hover { color: #ff1a1a; }
        .jjs-modal-body { padding: 20px; }
        .jjs-modal-textarea { width: 100%; height: 150px; background: #000; color: var(--text); border: calc(var(--thickness)/2) solid var(--border); padding: 12px; font-size: 0.8rem; resize: none; font-family: monospace !important; }
        .jjs-modal-textarea::placeholder { color: #666; }
        .jjs-modal-footer { padding: 0 20px 20px 20px; display: flex; justify-content: flex-end; gap: 10px; }

        .btn-modal-confirm { background: var(--accent); color: #000; border: calc(var(--thickness)/2) solid var(--border); padding: 10px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        body.theme-toon .btn-modal-confirm { background: #fff; }
        .btn-modal-confirm:hover { filter: brightness(1.2); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0; color: var(--accent); text-transform: uppercase; font-size: 1.6rem;">JJS STUDIO</h2>
        <span style="font-size:0.7rem; color:#555;">V2.8.8 STABLE</span>
        <div id="engine-info" class="engine-status">CHECKING...</div>
    </div>

    <div class="layout-toggle-container">
        <button class="btn-layout-toggle active" id="btn-layout-editor" onclick="switchActiveLayout('editor')">Studio</button>
        <button class="btn-layout-toggle" id="btn-layout-tracks" onclick="switchActiveLayout('tracks')">Shenanigans</button>
    </div>

    <div class="theme-container">
        <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
            <label>Select Workspace Theme</label>
        </div>
        <div class="theme-control-row">
            <select class="theme-select" id="global-theme-picker" onchange="previewTheme(this.value)">
                <optgroup label="Standard Themes">
                    <option value="default" selected>Default Dark</option>
                    <option value="retro">Comic Retro</option>
                    <option value="matrix">Midnight Matrix</option>
                    <option value="nova">Moonlit Nova</option>
                    <option value="toon">Toon Slate</option>
                    <option value="shadow">Cyber Shadow</option>
                    <option value="crimson">Crimson</option>
                </optgroup>
                <optgroup label="Saved Custom Themes" id="custom-themes-group">
                    <option value="custom">[Create New Theme...]</option>
                </optgroup>
            </select>
            <button class="btn-delete-theme" id="delete-theme-trigger" onclick="deleteActiveTheme()">Del</button>
        </div>
    </div>

    <div class="custom-panel" id="custom-editor-ui">
        <h4>Theme Creator Engine</h4>
        <div class="config-row" style="margin-bottom:12px;">
            <label>Theme Name</label>
            <input type="text" id="val-name" value="My Custom Setup" style="width:65%;">
        </div>
        <div class="config-row"><label>BG Color</label><input type="color" id="val-bg" value="#1a1a1a" oninput="applyLiveVar('--bg', this.value)"></div>
        <div class="config-row"><label>Panel Color</label><input type="color" id="val-panel" value="#111111" oninput="applyLiveVar('--panel', this.value)"></div>
        <div class="config-row"><label>Node Card</label><input type="color" id="val-node" value="#252525" oninput="applyLiveVar('--node-card', this.value)"></div>
        <div class="config-row"><label>Accent</label><input type="color" id="val-accent" value="#ffcc33" oninput="applyLiveVar('--accent', this.value)"></div>
        <div class="config-row"><label>Text Color</label><input type="color" id="val-text" value="#e0e0e0" oninput="applyLiveVar('--text', this.value)"></div>
        <div class="config-row"><label>Border Color</label><input type="color" id="val-border" value="#000000" oninput="applyLiveVar('--border', this.value)"></div>
        <div class="config-row"><label>Borders</label><input type="range" id="val-thick" min="0" max="12" value="4" oninput="applyLiveVar('--thickness', this.value + 'px')"></div>
        <div class="config-row" style="flex-direction:column; align-items:flex-start; gap:4px; margin-bottom:12px;">
            <label>Background Image URL</label>
            <input type="text" id="val-bgimg" placeholder="Paste image address..." oninput="applyLiveBg(this.value)" style="width:100%;">
        </div>
        <button style="background:#2ecc71; color:#000; border:2px solid #000; font-size:0.7rem; padding:8px; width:100%; font-weight:bold; cursor:pointer; text-transform:uppercase;" onclick="saveCustomTheme()">Save &amp; Apply</button>
    </div>

    <div class="jjs-action-container">
        <button class="btn-jjs-action" onclick="openJJSModal('import')" style="background: var(--accent); color: #000;">
            <i class="fa-solid fa-file-import" style="color: #000;"></i> Import
        </button>
        <button class="btn-jjs-action" onclick="openJJSModal('export')" style="background: #00f2ff; color: #000;">
            <i class="fa-solid fa-file-export" style="color: #000;"></i> Export
        </button>
    </div>

    <div class="container-heading" id="sidebar-list-heading">Move List</div>
    <div class="container-list" id="sidebar-dynamic-list">
        </div>
</div>

<div class="main" id="main-timeline">
    </div>

<div class="jjs-modal-overlay" id="jjs-system-modal" onclick="closeJJSModal(event)">
    <div class="jjs-modal-box" onclick="event.stopPropagation()">
        <div class="jjs-modal-header">
            <h3 class="jjs-modal-title" id="modal-title-text">
                <i class="fa-solid fa-terminal"></i> Terminal System
            </h3>
            <button class="jjs-modal-close" onclick="closeJJSModal(null)">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="jjs-modal-body">
            <textarea class="jjs-modal-textarea" id="modal-io-box"></textarea>
        </div>
        <div class="jjs-modal-footer">
            <button class="btn-modal-confirm" id="modal-action-btn" onclick="executeModalAction()">Apply</button>
        </div>
    </div>
</div>

<script>
    let dynamicCustomThemes = {};
    let activeModalMode = '';
    let currentRoot = 'default'; 
    let currentLayout = 'editor'; // 'editor' | 'tracks'
    let allContainers = []; // Engine build data parsed from load build

    const MASTER_SCHEMA = {
        "ANIM": { "Speed": 1, "FadeTime": 0.1, "Looped": false, "Weight": 1, "START": 0, "END": 0 },
        "SFX": { "SoundId": 0, "Volume": 0.5, "Pitch": 1, "Looped": false },
        "VELO": { "Velocity": "0,0,0", "Duration": 0.5, "UseCamera": false },
        "LOOP": { "Count": 1, "Interval": 0.1, "ResetOnHit": false },
        "HITCNCL": { "Active": true, "Time": 0.5 },
        "VISUAL": { "VisualType": "Slash", "Limb": "HumanoidRootPart", "Color": "255,255,255", "Transparency": 0, "Scale": "1,1,1" },
        "ULTGIB": { "Amount": 5 }, "HPGIB": { "Amount": 5 }, "EVGIB": { "Amount": 5 },
        "WAIT": { "Duration": 0.1 },
        "SKILL": { "SkillName": "None", "Action": "Activate" },
        "SPECIAL": { "Type": "None", "Power": 1 },
        "TAG": { "TagName": "None", "Duration": 1 },
        "PROJECTILE": { "Id": 0, "Speed": 50, "Distance": 100 },
        "GRAB": { "HoldTime": 1, "Distance": 5 },
        "COUNTER": { "Window": 0.5, "Action": "None" },
        "STATE": { "StateType": "None", "Active": true }
    };

    const NODE_NAME_MAP = { "ANIM": "ANIMATION", "ULTGIB": "ADD AWAKENING", "HPGIB": "ADD HEALTH", "EVGIB": "ADD EVASION" };

    window.addEventListener('DOMContentLoaded', () => {
        checkEngine();

        // Load custom themes from local storage
        const savedData = localStorage.getItem('jjs_studio_custom_registry');
        if (savedData) dynamicCustomThemes = JSON.parse(savedData);

        const savedLayout = localStorage.getItem('jjs_studio_active_layout') || 'editor';

        rebuildDropdownList();
        switchActiveLayout(savedLayout);
    });

    function switchActiveLayout(layoutMode) {
        currentLayout = layoutMode;
        localStorage.setItem('jjs_studio_active_layout', layoutMode);
        
        document.getElementById('btn-layout-editor').classList.toggle('active', layoutMode === 'editor');
        document.getElementById('btn-layout-tracks').classList.toggle('active', layoutMode === 'tracks');

        const rootName = (layoutMode === 'tracks') ? 'shenanigans' : 'default';
        currentRoot = rootName;
        document.body.classList.toggle('root-shenanigans', rootName === 'shenanigans');

        // Refresh currently previewed theme parameters so custom presets match the active layout style properties
        const picker = document.getElementById('global-theme-picker');
        if (picker) {
            previewTheme(picker.value);
        }

        renderSidebarContents();
        renderWorkspaceContents();
    }

    function renderSidebarContents() {
        const heading = document.getElementById('sidebar-list-heading');
        const list = document.getElementById('sidebar-dynamic-list');
        list.innerHTML = '';

        if (currentLayout === 'editor') {
            heading.innerText = "Move List";
            if (allContainers.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding-top: 30px; font-size: 0.8rem; color: #555;">No build loaded yet. Paste Base64 inside actual Import action!</div>';
                return;
            }

            allContainers.forEach((c, i) => {
                const btn = document.createElement('div');
                btn.className = 'item';
                btn.id = `btn-${i}`;
                btn.onclick = () => selectContainer(i);
                
                const kName = c.K_NAME || 'BUILD';
                const moveName = c.NAME || 'UNNAMED';
                
                btn.innerHTML = `
                    <span class="type-tag">${kName}</span>
                    <span class="move-name">${moveName}</span>
                `;
                list.appendChild(btn);
            });
        } else {
            // Tracks layout
            heading.innerText = "Main Target Containers";
            list.innerHTML = `
                <div class="jjs-bar jjs-c-skill" onclick="alert('Container mapped to SKILL track')">
                    <div class="jjs-bar-icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6"/></svg>
                    </div>
                    <div class="jjs-bar-text">Skill Container</div>
                </div>
                <div class="jjs-bar jjs-c-special" onclick="alert('Container mapped to SPECIAL track')">
                    <div class="jjs-bar-icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/></svg>
                    </div>
                    <div class="jjs-bar-text">Special Container</div>
                </div>
                <div class="jjs-bar jjs-c-awakening" onclick="alert('Container mapped to AWAKENING track')">
                    <div class="jjs-bar-icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                    </div>
                    <div class="jjs-bar-text">Awakening Container</div>
                </div>
            `;
        }
    }

    function renderWorkspaceContents() {
        const workspace = document.getElementById('main-timeline');
        workspace.innerHTML = '';

        if (currentLayout === 'editor') {
            if (allContainers.length === 0) {
                workspace.innerHTML = '<div class="empty-state">LOAD A COMPRESSED BUILD TO BEGIN EDITING</div>';
                return;
            }
            selectContainer(0); // Trigger default
        } else {
            // Render Gemini modern sequence tracks layout
            workspace.innerHTML = `
                <div class="editor-header">
                    <h1>Workspace Studio Preview</h1>
                    <div class="tooltip-field">
                        <label>Global Module ID Identifier</label>
                        <input value="Manifest_Profile_Core" readonly>
                    </div>
                </div>

                <div class="node-card">
                    <div class="node-head">
                        <strong>Active Target Properties</strong>
                    </div>
                    <div class="node-grid">
                        <div class="field"><label>Playback Speed</label><input value="1.00" readonly></div>
                        <div class="field"><label>Global Interpolation</label><input value="Linear" readonly></div>
                        <div class="field"><label>Safety Assert Override</label><input value="disabled" readonly></div>
                        <div class="field"><label>Frame Padding Count</label><input value="4" readonly></div>
                    </div>
                </div>

                <div class="node-card">
                    <div class="node-head">
                        <strong>Instanced Sequence Timeline Preview</strong>
                    </div>
                    <div class="timeline-track-canvas">
                        <div class="jjs-bar">
                            <div class="jjs-bar-icon-box">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                            </div>
                            <div class="jjs-bar-text">[1] Wait Action Track</div>
                        </div>
                        <div class="jjs-bar">
                            <div class="jjs-bar-icon-box">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                            </div>
                            <div class="jjs-bar-text">[HollowPurple] Animation Asset</div>
                        </div>
                    </div>
                </div>
            `;
        }
    }

    function checkEngine() {
        const info = document.getElementById('engine-info');
        if (window.pako) {
            info.innerHTML = "ENGINE STATUS: <span style='color:#00ffcc; font-weight:bold;'>NATIVE (ZLIB)</span>";
        } else {
            info.innerHTML = "ENGINE STATUS: <span style='color:#ff4444; font-weight:bold;'>LOADING ERROR</span>";
        }
    }

    function loadCode(raw) {
        if (!raw || !window.pako) return;
        try {
            const binary = atob(raw.trim());
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            
            let decodedText;
            try {
                const inflated = pako.inflate(bytes);
                decodedText = new TextDecoder().decode(inflated);
            } catch(e) {
                decodedText = new TextDecoder().decode(bytes); // Fallback to raw decode
            }
            
            const data = JSON.parse(decodedText);
            allContainers = Array.isArray(data) ? data : [data];
            
            if (currentLayout !== 'editor') {
                currentLayout = 'editor';
            }
            
            renderSidebarContents();
            renderWorkspaceContents();
            selectContainer(0);
        } catch(e) { 
            console.error("IMPORT ERROR:", e); 
            alert("IMPORT FAILED: The data provided is not a valid compressed JSON build or valid theme configuration."); 
        }
    }

    function generateBuildExportCode() {
        if (!window.pako) throw new Error("Engine not loaded yet.");
        if (allContainers.length === 0) throw new Error("No build loaded to export.");

        const jsonString = JSON.stringify(allContainers);
        const compressed = pako.deflate(jsonString);
        
        let binary = '';
        const chunkSize = 8192;
        for (let i = 0; i < compressed.length; i += chunkSize) {
            binary += String.fromCharCode.apply(null, compressed.slice(i, i + chunkSize));
        }
        
        return btoa(binary);
    }

    function selectContainer(index) {
        if (currentLayout !== 'editor' || allContainers.length === 0) return;

        document.querySelectorAll('.item').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${index}`);
        if (activeBtn) activeBtn.classList.add('active');
        
        const container = allContainers[index];
        const timeline = document.getElementById('main-timeline');
        timeline.innerHTML = ''; // Clear

        // Insert Editor Header style from testjjs
        timeline.innerHTML += `
            <div class="editor-header">
                <h1 style="margin:0; font-size:2.5rem; text-transform:uppercase;">${container.NAME || 'UNNAMED'}</h1>
                <div class="tooltip-field">
                    <label>Internal Container Name</label>
                    <input readonly value="${container.K_NAME || 'BUILD'}">
                </div>
            </div>
        `;

        let moveData = [];
        try {
            const inner = typeof container.DATA === 'string' ? JSON.parse(container.DATA) : container.DATA;
            moveData = inner.Line || inner.DATA?.Line || [];
        } catch(e) { moveData = container.Line || []; }

        moveData.forEach((node, i) => {
            const card = document.createElement('div');
            card.className = 'node-card';
            
            const nodeTypeName = NODE_NAME_MAP[node.K_NAME] || node.K_NAME;
            
            card.innerHTML = `
                <div class="node-head">
                    <strong>${nodeTypeName}</strong>
                    <span style="color:var(--accent); font-size: 0.8rem; font-weight:bold;">#${i+1}</span>
                </div>
                <div class="node-grid">${renderProps(node.K_NAME, node)}</div>
            `;
            timeline.appendChild(card);
        });
    }

    function renderProps(type, node) {
        let html = '';
        const data = { ...node };
        
        if (data.Preview && typeof data.Preview === 'string') {
            const s = data.Preview.split(",");
            data.START = s[0]; data.END = s[1];
        }
        
        const temp = MASTER_SCHEMA[type] || {};
        const keys = new Set([...Object.keys(temp), ...Object.keys(data)]);
        
        Array.from(keys).sort().forEach(k => {
            if (k === 'K_NAME' || k === 'Preview' || k === 'AnimationId') return;
            const val = data[k] !== undefined ? data[k] : temp[k];
            
            const isModded = data[k] !== undefined;
            const styleAttribute = isModded ? 'style="color: var(--accent);"' : 'style="opacity: 0.5;"';

            html += `<div class="field">
                <label>${k}</label>
                <input readonly value="${val}" ${styleAttribute}>
            </div>`;
        });
        return html;
    }

    function previewTheme(styleName) {
        const isShena = document.body.classList.contains('root-shenanigans');
        document.body.className = '';
        if (isShena) document.body.classList.add('root-shenanigans');
        document.body.removeAttribute('style');

        document.getElementById('custom-editor-ui').style.display = (styleName === 'custom') ? 'block' : 'none';
        document.getElementById('delete-theme-trigger').style.display = styleName.startsWith('saved_') ? 'block' : 'none';

        if (styleName === 'custom') {
            applyPanelValuesToLivePreview();
        } else if (styleName.startsWith('saved_')) {
            const cfg = dynamicCustomThemes[styleName];
            if (cfg) applyConfigToLayout(cfg);
        } else {
            if (styleName !== 'default') {
                document.body.classList.add('theme-' + styleName);
            }
        }
    }

    function applyLiveVar(property, value) {
        if (document.getElementById('global-theme-picker').value === 'custom') {
            document.body.style.setProperty(property, value);
        }
    }

    function applyLiveBg(url) {
        if (document.getElementById('global-theme-picker').value === 'custom') {
            if (!url || url.trim() === '') {
                document.body.style.setProperty('--bg-image', "linear-gradient(rgba(0,0,0,0.3) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px)");
                document.body.style.removeProperty('background-size');
            } else {
                document.body.style.setProperty('--bg-image', `url('${url}')`);
                document.body.style.setProperty('background-size', 'cover');
            }
        }
    }

    function applyPanelValuesToLivePreview() {
        applyLiveVar('--bg',         document.getElementById('val-bg').value);
        applyLiveVar('--panel',      document.getElementById('val-panel').value);
        applyLiveVar('--node-card',  document.getElementById('val-node').value);
        applyLiveVar('--accent',     document.getElementById('val-accent').value);
        applyLiveVar('--text',       document.getElementById('val-text').value);
        applyLiveVar('--border',     document.getElementById('val-border').value);
        applyLiveVar('--thickness',  document.getElementById('val-thick').value + 'px');
        applyLiveBg(document.getElementById('val-bgimg').value);
    }

    function applyConfigToLayout(config) {
        document.body.style.setProperty('--bg',        config.bg);
        document.body.style.setProperty('--panel',     config.panel);
        document.body.style.setProperty('--node-card', config.node);
        document.body.style.setProperty('--accent',    config.accent);
        document.body.style.setProperty('--text',      config.text);
        document.body.style.setProperty('--border',    config.border);
        document.body.style.setProperty('--thickness', config.thickness);

        if (!config.bgImg || config.bgImg.trim() === '') {
            document.body.style.setProperty('--bg-image', "linear-gradient(rgba(0,0,0,0.3) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px)");
        } else {
            document.body.style.setProperty('--bg-image', `url('${config.bgImg}')`);
            document.body.style.setProperty('background-size', 'cover');
        }
    }

    function saveCustomTheme() {
        const inputName = document.getElementById('val-name').value.trim() || 'My Custom Setup';
        const uniqueKey = 'saved_' + Date.now();

        dynamicCustomThemes[uniqueKey] = {
            name:      inputName,
            bg:        document.getElementById('val-bg').value,
            panel:     document.getElementById('val-panel').value,
            node:      document.getElementById('val-node').value,
            accent:    document.getElementById('val-accent').value,
            text:      document.getElementById('val-text').value,
            border:    document.getElementById('val-border').value,
            thickness: document.getElementById('val-thick').value + 'px',
            bgImg:     document.getElementById('val-bgimg').value
        };

        localStorage.setItem('jjs_studio_custom_registry', JSON.stringify(dynamicCustomThemes));
        rebuildDropdownList();
        document.getElementById('global-theme-picker').value = uniqueKey;
        previewTheme(uniqueKey);
    }

    function deleteActiveTheme() {
        const picker = document.getElementById('global-theme-picker');
        const activeKey = picker.value;
        if (activeKey.startsWith('saved_')) {
            if (confirm(`Are you sure you want to permanently delete "${dynamicCustomThemes[activeKey].name}"?`)) {
                delete dynamicCustomThemes[activeKey];
                localStorage.setItem('jjs_studio_custom_registry', JSON.stringify(dynamicCustomThemes));
                rebuildDropdownList();
                picker.value = 'default';
                previewTheme('default');
            }
        }
    }

    function rebuildDropdownList() {
        const targetGroup = document.getElementById('custom-themes-group');
        targetGroup.innerHTML = '';

        for (const [key, theme] of Object.entries(dynamicCustomThemes)) {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = theme.name;
            targetGroup.appendChild(opt);
        }

        const createOpt = document.createElement('option');
        createOpt.value = 'custom';
        createOpt.textContent = '[Create New Theme...]';
        targetGroup.appendChild(createOpt);
    }

    function openJJSModal(mode) {
        activeModalMode = mode;
        const overlay  = document.getElementById('jjs-system-modal');
        const titleEl  = document.getElementById('modal-title-text');
        const ioBox    = document.getElementById('modal-io-box');
        const actionBtn= document.getElementById('modal-action-btn');

        ioBox.value = '';
        overlay.style.display = 'flex';

        if (mode === 'import') {
            titleEl.innerHTML = '<i class="fa-solid fa-file-import"></i> Unified Import Center';
            ioBox.placeholder = "Paste theme configuration JSON OR compressed base64 Pako build data here...";
            ioBox.readOnly = false;
            actionBtn.innerText = "Execute Import";
        } else if (mode === 'export') {
            titleEl.innerHTML = '<i class="fa-solid fa-file-export"></i> Unified Export Center';
            ioBox.readOnly = true;
            actionBtn.innerText = "Copy to Clipboard";

            // Export logic adapts automatically to output both theme parameters AND binary builds if loaded
            let exportPayload = {};
            const activeThemeKey = document.getElementById('global-theme-picker').value;

            if (activeThemeKey === 'custom') {
                exportPayload.themeConfig = {
                    name:      document.getElementById('val-name').value,
                    bg:        document.getElementById('val-bg').value,
                    panel:     document.getElementById('val-panel').value,
                    node:      document.getElementById('val-node').value,
                    accent:    document.getElementById('val-accent').value,
                    text:      document.getElementById('val-text').value,
                    border:    document.getElementById('val-border').value,
                    thickness: document.getElementById('val-thick').value + 'px',
                    bgImg:     document.getElementById('val-bgimg').value
                };
            } else if (activeThemeKey.startsWith('saved_')) {
                exportPayload.themeConfig = dynamicCustomThemes[activeThemeKey];
            } else {
                exportPayload.themeConfig = { activeTheme: activeThemeKey, activeRoot: currentRoot };
            }

            if (allContainers.length > 0) {
                try {
                    exportPayload.compressedBuild = generateBuildExportCode();
                } catch(err) {
                    console.warn("Could not compress build for export payload", err);
                }
            }

            ioBox.value = JSON.stringify(exportPayload, null, 2);
        }
    }

    function closeJJSModal(e) {
        if (!e || e.target === document.getElementById('jjs-system-modal')) {
            document.getElementById('jjs-system-modal').style.display = 'none';
        }
    }

    function executeModalAction() {
        const ioBox = document.getElementById('modal-io-box');
        
        if (activeModalMode === 'export') {
            if (ioBox.value.startsWith("ERROR:")) {
                closeJJSModal(null);
                return;
            }
            ioBox.select();
            document.execCommand('copy');
            alert('Export configuration copied to clipboard successfully!');
            closeJJSModal(null);
            
        } else if (activeModalMode === 'import') {
            const rawVal = ioBox.value.trim();
            if (rawVal === '') {
                alert("Please provide configuration string data first.");
                return;
            }

            try {
                // Check if JSON configuration payload is provided (like themes or unified exports)
                const parsed = JSON.parse(rawVal);
                
                // Read nested structures if standard exports are imported
                if (parsed.themeConfig) {
                    const cfg = parsed.themeConfig;
                    const uniqueKey = 'saved_' + Date.now();
                    dynamicCustomThemes[uniqueKey] = {
                        name:      cfg.name      || 'Imported Theme',
                        bg:        cfg.bg        || '#1a1a1a',
                        panel:     cfg.panel     || '#111111',
                        node:      cfg.node      || '#252525',
                        accent:    cfg.accent    || '#ffcc33',
                        text:      cfg.text      || '#e0e0e0',
                        border:    cfg.border    || '#000000',
                        thickness: cfg.thickness || '4px',
                        bgImg:     cfg.bgImg     || ''
                    };
                    localStorage.setItem('jjs_studio_custom_registry', JSON.stringify(dynamicCustomThemes));
                    rebuildDropdownList();
                    document.getElementById('global-theme-picker').value = uniqueKey;
                    previewTheme(uniqueKey);
                }

                if (parsed.compressedBuild) {
                    loadCode(parsed.compressedBuild);
                } else if (!parsed.themeConfig) {
                    // Try parsing raw direct theme configuration JSONs
                    const uniqueKey = 'saved_' + Date.now();
                    dynamicCustomThemes[uniqueKey] = {
                        name:      parsed.name      || 'Imported Theme',
                        bg:        parsed.bg        || '#1a1a1a',
                        panel:     parsed.panel     || '#111111',
                        node:      parsed.node      || '#252525',
                        accent:    parsed.accent    || '#ffcc33',
                        text:      parsed.text      || '#e0e0e0',
                        border:    parsed.border    || '#000000',
                        thickness: parsed.thickness || '4px',
                        bgImg:     parsed.bgImg     || ''
                    };
                    localStorage.setItem('jjs_studio_custom_registry', JSON.stringify(dynamicCustomThemes));
                    rebuildDropdownList();
                    document.getElementById('global-theme-picker').value = uniqueKey;
                    previewTheme(uniqueKey);
                }
                
                closeJJSModal(null);
            } catch(e) {
                // If it fails JSON parsing, assume it's direct base64 Pako build data
                loadCode(rawVal);
                closeJJSModal(null);
            }
        }
    }
</script>
