<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJS STUDIO - UNIFIED ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Finger+Paint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

    <style>
        /* ==========================================
           CORE STYLING SYSTEM (Based on Fused Style)
           ========================================== */
        :root {
            --bg: #13131a;
            --panel: #1c1c24;
            --node-card: #22222f;
            --accent: #ffcc33;
            --text: #e2e2e9;
            --border: #2d2d3d;
            --thickness: 1px;
            --border-radius: 8px;
            --font-family: 'Inter', sans-serif;
            --bg-image: none;
        }

        /* ==========================================
           SHENANIGANS STRUCTURAL OVERRIDES
           ========================================== */
        body.mode-shenanigans {
            --bg: #1a1a1a;
            --panel: #111111;
            --node-card: #252525;
            --accent: #ffcc33;
            --text: #e0e0e0;
            --border: #000000;
            --thickness: 4px;
            --font-family: 'Finger Paint', cursive;
            --bg-image: linear-gradient(rgba(0,0,0,0.3) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px);
        }

        body.mode-shenanigans * {
            font-family: 'Finger Paint', cursive !important;
            border-radius: 0px !important;
        }

        body.mode-shenanigans .node-card,
        body.mode-shenanigans .sidebar,
        body.mode-shenanigans .jjs-bar,
        body.mode-shenanigans .field-input,
        body.mode-shenanigans .btn-layout-toggle,
        body.mode-shenanigans .action-btn {
            border: var(--thickness) solid var(--border) !important;
            box-shadow: 5px 5px 0px #000000 !important;
        }

        /* ==========================================
           BASE LAYOUT STRUCTURE
           ========================================== */
        * {
            font-family: var(--font-family);
            box-sizing: border-box;
            outline: none;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            background-image: var(--bg-image);
            background-size: 40px 40px;
            color: var(--text);
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Container */
        .sidebar {
            width: 360px;
            min-width: 360px;
            background: var(--panel);
            border-right: var(--thickness) solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            height: 100%;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: var(--thickness) solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* Workspace Core Toggles */
        .layout-switcher {
            display: flex;
            padding: 15px;
            gap: 10px;
            border-bottom: var(--thickness) solid var(--border);
        }

        .btn-layout-toggle {
            flex: 1;
            padding: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: var(--thickness) solid var(--border);
            background: var(--node-card);
            color: var(--text);
            border-radius: var(--border-radius);
            text-align: center;
        }

        .btn-layout-toggle.active {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
        }

        /* Interactive Dynamic Lists */
        .data-stream-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .jjs-bar {
            background: var(--node-card);
            border: var(--thickness) solid var(--border);
            border-radius: var(--border-radius);
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .jjs-bar:hover {
            border-color: var(--accent);
        }

        .jjs-bar.active {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
        }

        /* Main Workspace Window */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            height: 100%;
            background: rgba(0, 0, 0, 0.1);
        }

        /* ==========================================
           NODE ENGINE GRAPHICAL COMPONENT STYLES
           ========================================== */
        .node-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .node-card {
            background: var(--panel);
            border: var(--thickness) solid var(--border);
            border-radius: var(--border-radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .node-head {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 15px;
            border-bottom: var(--thickness) solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .node-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-row label {
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .field-input {
            background: var(--node-card);
            border: var(--thickness) solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;
        }

        /* Action Panel Bottom Buttons */
        .action-row {
            padding: 15px;
            border-top: var(--thickness) solid var(--border);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.15);
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: var(--thickness) solid var(--border);
            background: var(--node-card);
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            border-radius: var(--border-radius);
            text-align: center;
            font-size: 0.85rem;
        }

        .action-btn.primary {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
        }

        /* ==========================================
           MODAL OVERLAY SYSTEM
           ========================================== */
        .jjs-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .jjs-modal-window {
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: var(--border-radius);
            width: 500px;
            max-width: 90%;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .jjs-modal-window h3 {
            margin: 0;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .jjs-modal-window textarea {
            width: 100%;
            height: 180px;
            background: var(--bg);
            border: var(--thickness) solid var(--border);
            color: var(--text);
            padding: 10px;
            font-family: monospace !important;
            font-size: 0.8rem;
            resize: none;
        }
    </style>
</head>
<body class="mode-studio">

<div class="sidebar">
    <div class="sidebar-header">
        <h2>JJS STUDIO ENGINE</h2>
        <span style="font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 20px;">v2.8.8</span>
    </div>

    <div class="layout-switcher">
        <button class="btn-layout-toggle active" id="btn-studio" onclick="setEngineLayout('Studio')">Studio</button>
        <button class="btn-layout-toggle" id="btn-shenanigans" onclick="setEngineLayout('Shenanigans')">Shenanigans</button>
    </div>

    <div class="data-stream-container" id="sidebar-moves-list">
        <div style="text-align: center; color: rgba(255,255,255,0.4); margin-top: 40px; font-size: 0.85rem;">
            <i class="fa-solid fa-folder-open" style="font-size: 1.5rem; margin-bottom: 10px; display: block;"></i>
            No Engine Code Build Loaded
        </div>
    </div>

    <div class="action-row">
        <button class="action-btn" onclick="openEngineIO('import')">Import</button>
        <button class="action-btn primary" onclick="openEngineIO('export')">Export</button>
    </div>
</div>

<div class="main" id="workspace-viewport">
    <div style="max-width: 800px; margin: 60px auto; text-align: center; color: rgba(255,255,255,0.5);">
        <h1 style="color: var(--text); font-size: 2rem; margin-bottom: 15px;">Welcome to JJS Engine Workspace</h1>
        <p>Please load your compiled character moveset data via the base64 build importer tool at the bottom left to begin schema mapping.</p>
    </div>
</div>

<div class="jjs-modal-overlay" id="engine-modal">
    <div class="jjs-modal-window">
        <h3 id="modal-title-text">Engine Data Port</h3>
        <p id="modal-desc-text" style="font-size: 0.8rem; margin: 0; color: rgba(255,255,255,0.6);"></p>
        <textarea id="modal-io-target" placeholder="Paste your dynamic code block data here..."></textarea>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="action-btn" onclick="closeEngineIO()" style="flex: none; width: 100px;">Cancel</button>
            <button class="action-btn primary" id="modal-action-btn" style="flex: none; width: 120px;">Execute</button>
        </div>
    </div>
</div>

<script>
    /* ===================================================
       MASTER SCHEMAS & DICTIONARIES FROM THE ENGINE
       =================================================== */
    let activeWorkspaceMode = 'Studio';
    let loadedMovesData = [];
    let selectedMoveIndex = null;

    // Dictionary definition frameworks derived from engine rules
    const MASTER_SCHEMA = {
        "K_NAME": "String", "Frame": "Integer", "Duration": "Integer", "X": "Float", "Y": "Float",
        "Width": "Float", "Height": "Float", "Damage": "Float", "Knockback": "Float", "Angle": "Float"
    };

    // Engine UI Handler Lifecycle
    function setEngineLayout(layoutTarget) {
        activeWorkspaceMode = layoutTarget;
        
        const studioBtn = document.getElementById('btn-studio');
        const shenanigansBtn = document.getElementById('btn-shenanigans');
        
        if(layoutTarget === 'Shenanigans') {
            document.body.className = 'mode-shenanigans';
            shenanigansBtn.classList.add('active');
            studioBtn.classList.remove('active');
        } else {
            document.body.className = 'mode-studio';
            studioBtn.classList.add('active');
            shenanigansBtn.classList.remove('active');
        }
        
        renderWorkspaceView();
    }

    /* ===================================================
       COMPRESSION, CORE ENGINE DECODER & PARSER ENGINE
       =================================================== */
    function openEngineIO(mode) {
        const modal = document.getElementById('engine-modal');
        const title = document.getElementById('modal-title-text');
        const desc = document.getElementById('modal-desc-text');
        const textarea = document.getElementById('modal-io-target');
        const actionBtn = document.getElementById('modal-action-btn');
        
        modal.style.display = 'flex';
        textarea.value = '';
        
        if (mode === 'import') {
            title.textContent = 'Import Engine Character Build';
            desc.textContent = 'Paste your raw character code data package below to parse the system configuration structure.';
            actionBtn.textContent = 'Load Build';
            actionBtn.onclick = function() {
                processIncomingBuild(textarea.value);
            };
        } else {
            title.textContent = 'Export Engine Character Build';
            desc.textContent = 'Your current operational schema configurations package code output ready for runtime compilation:';
            actionBtn.textContent = 'Copy Data';
            
            // Build compilation logic matching engine format rules
            let dataString = loadedMovesData.length > 0 ? JSON.stringify(loadedMovesData, null, 2) : "[]";
            textarea.value = btoa(pako.deflate(dataString, { to: 'string' }));
            
            actionBtn.onclick = function() {
                textarea.select();
                document.execCommand('copy');
                alert('Output code package successfully copied to clipboard!');
                closeEngineIO();
            };
        }
    }

    function closeEngineIO() {
        document.getElementById('engine-modal').style.display = 'none';
    }

    function processIncomingBuild(rawData) {
        if(!rawData.trim()) return alert("Input stream payload is empty!");
        try {
            // Decoding package data via runtime engine standards
            const binaryData = atob(rawData.trim());
            const charData = new Uint8Array(binaryData.length);
            for(let i=0; i<binaryData.length; i++) {
                charData[i] = binaryData.charCodeAt(i);
            }
            const restorationText = pako.inflate(charData, { to: 'string' });
            const parsedPackage = JSON.parse(restorationText);
            
            if(Array.isArray(parsedPackage)) {
                loadedMovesData = parsedPackage;
                buildSidebarStreams();
                selectMoveNode(0);
                closeEngineIO();
            } else {
                alert("Data structure parsing failed: Master collection context must be formatted in a valid array frame.");
            }
        } catch(err) {
            alert("Error parsing character build: Unrecognized format or corrupted compilation string.");
            console.error(err);
        }
    }

    /* ===================================================
       WORKSPACE AND GRAPHICS VIEWS CONTROLLERS
       =================================================== */
    function buildSidebarStreams() {
        const streamContainer = document.getElementById('sidebar-moves-list');
        streamContainer.innerHTML = '';
        
        if(loadedMovesData.length === 0) {
            streamContainer.innerHTML = `<div style="text-align: center; color: rgba(255,255,255,0.4); margin-top: 40px; font-size: 0.85rem;">No Engine Code Build Loaded</div>`;
            return;
        }

        loadedMovesData.forEach((move, index) => {
            const el = document.createElement('div');
            el.className = `jjs-bar ${selectedMoveIndex === index ? 'active' : ''}`;
            el.onclick = () => selectMoveNode(index);
            
            const moveName = move.Name || move.K_NAME || `Moveset Stream #${index + 1}`;
            el.innerHTML = `<span><i class="fa-solid fa-bolt" style="margin-right: 8px;"></i> ${moveName}</span> <i class="fa-solid fa-chevron-right" style="font-size:0.75rem;"></i>`;
            streamContainer.appendChild(el);
        });
    }

    function selectMoveNode(index) {
        selectedMoveIndex = index;
        const bars = document.querySelectorAll('.jjs-bar');
        bars.forEach((bar, i) => {
            if(i === index) bar.classList.add('active');
            else bar.classList.remove('active');
        });
        renderWorkspaceView();
    }

    function renderWorkspaceView() {
        const view = document.getElementById('workspace-viewport');
        if (selectedMoveIndex === null || !loadedMovesData[selectedMoveIndex]) {
            return;
        }

        const moveObject = loadedMovesData[selectedMoveIndex];
        const currentTitle = moveObject.Name || moveObject.K_NAME || "Active Matrix View";

        if (activeWorkspaceMode === 'Shenanigans') {
            // Alternative Timeline Tracks/Shenanigans visualization layout
            let htmlBlock = `
                <div style="margin-bottom: 20px;">
                    <h2 style="margin:0; text-transform: uppercase;">⚡ SHENANIGANS TRACKS: ${currentTitle}</h2>
                    <p style="margin: 5px 0 0 0; color: var(--accent);">FORCED CARTOON STRUCTURAL OVERRIDE ACTIVE</p>
                </div>
                <div class="node-card" style="padding: 20px;">
                    <div style="font-size: 1.1rem; border-bottom: 2px dashed var(--border); padding-bottom: 10px; margin-bottom: 15px; font-weight: bold;">
                        RAW TIMELINE DATA STREAM OBJECT
                    </div>
                    <pre style="background: rgba(0,0,0,0.4); padding: 15px; font-family: monospace !important; overflow-x: auto; font-size: 0.85rem;">${JSON.stringify(moveObject, null, 2)}</pre>
                </div>
            `;
            view.innerHTML = htmlBlock;
        } else {
            // Standard Functional Studio build environment
            let htmlBlock = `
                <div style="border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 25px;">
                    <h2 style="margin:0; font-size:1.6rem; font-weight:700;">${currentTitle}</h2>
                    <span style="font-size:0.8rem; color: rgba(255,255,255,0.5);">Engine Node Parameter Field Inspector</span>
                </div>
                <div class="node-grid">
            `;

            // Dynamic structural loop reading node parameters matching MASTER_SCHEMA definitions
            Object.keys(MASTER_SCHEMA).forEach(key => {
                const val = moveObject[key] !== undefined ? moveObject[key] : "";
                htmlBlock += `
                    <div class="node-card">
                        <div class="node-head">
                            <span>FIELD :: ${key}</span>
                            <i class="fa-solid fa-sliders"></i>
                        </div>
                        <div class="node-body">
                            <div class="field-row">
                                <label>Value (${MASTER_SCHEMA[key]})</label>
                                <input type="text" class="field-input" value="${val}" onchange="updateEngineField('${key}', this.value)">
                            </div>
                        </div>
                    </div>
                `;
            });

            htmlBlock += `</div>`;
            view.innerHTML = htmlBlock;
        }
    }

    function updateEngineField(key, value) {
        if(selectedMoveIndex !== null && loadedMovesData[selectedMoveIndex]) {
            // Cast types matching schema definitions rules
            if(MASTER_SCHEMA[key] === "Integer") value = parseInt(value) || 0;
            else if(MASTER_SCHEMA[key] === "Float") value = parseFloat(value) || 0.0;
            
            loadedMovesData[selectedMoveIndex][key] = value;
        }
    }
</script>
</body>
</html>
