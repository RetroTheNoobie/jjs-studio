<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJS Studio - V1.3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="./zstd-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style id="custom-theme-style"></style>
    <style>
        * { text-transform: none !important; box-sizing: border-box; font-family: 'Finger Paint', cursive; border-radius: 0 !important; outline: none; }
        
        .uppercase-force, .topbar-btn, .sidebar-header h2, .btn-jjs-action, .container-heading, .workspace-tab, .menu-label, .node-head strong, .anim-cat-header, .workshop-tab, .prompt-title { text-transform: uppercase !important; }

        :root {
            --bg: #121317; --panel: #1a1c23; --node-card: #222530; --accent: #ffcc33; --text: #e2e8f0; --border: #2d313f; --thickness: 3px;
            --font-code: 'Finger Paint', cursive; --bg-image: none; --bg-opacity: 1;
        }

        body.theme-retro   { --bg: #3c3f41; --panel: #2b2b2b; --node-card: #313335; --accent: #ff5722; --text: #f5f5f5; --border: #000000; }
        body.theme-matrix  { --bg: #030704; --panel: #0a0f0d; --node-card: #121a16; --accent: #00ff66; --text: #33ff77; --border: #00ff66; }
        body.theme-nova    { --bg: #0f051d; --panel: #18092b; --node-card: #240e42; --accent: #cc33ff; --text: #f3e8ff; --border: #4a1d8a; }
        body.theme-cyber   { --bg: #1c1e22; --panel: #111215; --node-card: #242930; --accent: #00f0ff; --text: #c0c5cd; --border: #00f0ff; --thickness: 3px; }
        body.theme-crimson { --bg: #141414; --panel: #0b0b0b; --node-card: #1f1f1f; --accent: #ff2a4b; --text: #f5f5f5; --border: #ff2a4b; --thickness: 4px; }
        body.theme-super-dark { --bg: #000000; --panel: #050505; --node-card: #0a0a0a; --accent: #ffffff; --text: #e0e0e0; --border: #1f1f1f; --thickness: 2px; }

        body { margin: 0; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        
        body::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: var(--bg-image); background-size: cover; background-position: center;
            opacity: var(--bg-opacity); z-index: -1; pointer-events: none;
        }

        .topbar { flex-shrink: 0; height: 50px; background: var(--panel); border-bottom: var(--thickness) solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 15px; z-index: 50; }
        .topbar-btn { background: transparent; color: var(--text); border: none; border-bottom: 3px solid transparent; font-weight: bold; cursor: pointer; height: 100%; padding: 0 15px; font-size: 0.85rem; transition: 0.2s; }
        .topbar-btn:hover { color: var(--accent); border-bottom-color: var(--accent); }

        .app-body { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 380px; min-width: 380px; background: var(--panel); border-right: var(--thickness) solid var(--border); display: flex; flex-direction: column; z-index: 10; height: 100%; box-shadow: 5px 0 0 rgba(0,0,0,0.2); }
        .sidebar-header { padding: 25px; border-bottom: var(--thickness) solid var(--border); text-align: center; }
        .engine-status { font-size: 0.7rem; padding: 6px 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); width: fit-content; margin: 10px auto 0 auto; }
        
        .jjs-action-container { padding: 20px 15px; display: flex; flex-direction: column; gap: 10px; border-bottom: var(--thickness) solid var(--border); }
        .jjs-action-row { display: flex; gap: 10px; width: 100%; }
        .btn-jjs-action { flex: 1; padding: 12px; border: var(--thickness) solid var(--border); background: rgba(0,0,0,0.2); color: var(--text); font-weight: bold; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.15s; }
        .btn-jjs-action i { font-size: 0.9rem; color: var(--accent); }
        .btn-jjs-action:hover { background: var(--accent); color: #000; }
        .btn-jjs-action:hover i { color: #000; }

        .container-heading { padding: 15px 20px 5px 20px; font-size: 0.7rem; color: var(--accent); letter-spacing: 1px; }
        .container-list { padding: 10px 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex-grow: 1; }
        .item { padding: 15px; background: var(--node-card); cursor: pointer; border: var(--thickness) solid var(--border); transition: 0.1s; }
        .item:hover { background: rgba(255,255,255,0.05); }
        .item.active { background: var(--accent); color: #000 !important; border-color: var(--border); }
        .item.active .type-tag, .item.active .move-name { color: #000 !important; }
        .item .type-tag { font-size: 0.65rem; color: var(--accent); display: block; margin-bottom: 2px;}
        .item .move-name { display: block; font-size: 1.1rem; color: var(--text); }

        .main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 40px; height: 100%; display: block; background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px); background-size: 30px 30px; position: relative; }

        .editor-header { display: flex; flex-direction: column; gap: 15px; border-left: var(--thickness) solid var(--accent); padding-left: 20px; margin-bottom: 25px; }
        .btn-delete-container { background: #ff4d4d; color: #fff; border: var(--thickness) solid var(--border); padding: 10px 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.75rem; transition: 0.1s; }
        .btn-delete-container:hover { transform: translate(-2px, -2px); filter: brightness(1.1); }
        .container-fields-row { display: flex; gap: 15px; }
        .tooltip-field { background: rgba(0,0,0,0.8); border: 1px solid var(--border); padding: 12px; flex: 1; }
        .tooltip-field label { display: block; font-size: 0.65rem; color: var(--accent); margin-bottom: 5px; }
        .tooltip-field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem; border-bottom: 2px solid #333; }

        .branch-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
        .branch-tab { background: var(--panel); border: var(--thickness) solid var(--border); padding: 8px 16px; color: var(--text); font-size: 0.8rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.1s; }
        .branch-tab:hover { background: rgba(255,255,255,0.1); }
        .branch-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .branch-tab .edit-icon, .branch-tab .delete-icon { opacity: 0.6; font-size: 0.7rem; padding: 4px; transition: opacity 0.1s; }
        .branch-tab .edit-icon:hover { opacity: 1; } .branch-tab.active .edit-icon { color: #000; }
        .branch-tab .delete-icon { color: #ff4d4d; } .branch-tab .delete-icon:hover { opacity: 1; color: #ff1a1a; } .branch-tab.active .delete-icon { color: #cc0000; }
        .branch-add-btn { background: var(--panel); border: 2px solid #00ff66; color: #00ff66; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .branch-add-btn:hover { background: #00ff66; color: #000; }

        .workspace-tabs { display: flex; gap: 5px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .workspace-tab { flex: 1; background: rgba(0,0,0,0.5); border: none; padding: 12px; color: var(--text); opacity: 0.5; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; }
        .workspace-tab:hover { opacity: 0.8; background: rgba(255,255,255,0.05); }
        .workspace-tab.active { opacity: 1; color: var(--accent); border-bottom: 3px solid var(--accent); background: rgba(0,0,0,0.8); }

        .node-card { background: var(--panel); border: var(--thickness) solid var(--border); margin-bottom: 20px; overflow: hidden; box-shadow: 6px 6px 0px rgba(0,0,0,0.6); transition: 0.1s; position: relative; }
        .node-card.selected { border-color: var(--accent); box-shadow: 0 0 15px rgba(255, 204, 51, 0.5); transform: translateY(-2px); }
        .node-head { background: rgba(0,0,0,0.3); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: var(--thickness) solid var(--border); user-select: none; cursor: pointer; }
        .node-head:hover { background: rgba(255,255,255,0.03); }
        .node-title-group { display: flex; align-items: center; gap: 12px; }
        .node-title-group strong { color: var(--accent); font-size: 1rem; }
        .node-summary-tag { color: #8892b0; font-size: 0.8rem; }
        .btn-delete-node, .btn-comment-node { background: transparent; border: none; cursor: pointer; font-size: 1.1rem; padding: 5px; transition: color 0.1s; }
        .btn-delete-node { color: #ff4d4d; } .btn-delete-node:hover { color: #ff1a1a; }
        .btn-comment-node { color: #a0aec0; } .btn-comment-node:hover { color: #fff; }

        .node-grid { padding: 25px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; background: rgba(0,0,0,0.1); }
        .field { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 12px; }
        .field label { display: block; font-size: 0.65rem; color: #8892b0; margin-bottom: 6px; }
        .field input, .field select { width: 100%; background: transparent; border: none; color: #fff; font-size: 0.95rem; border-bottom: 1px solid var(--border); }
        .field input:disabled { opacity: 0.5; border-bottom: none; cursor: not-allowed; }
        .field input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; border-bottom: none; }

        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 1.3rem; color: #4f566b; text-align: center; line-height: 1.8; }
        .gui-scale-bar { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.6); padding: 10px 20px; border: 1px solid var(--border); margin-bottom: 20px; font-size: 0.75rem; }
        .gui-scale-bar input[type="range"] { flex-grow: 1; cursor: pointer; accent-color: var(--accent); }

        .context-menu { position: fixed; display: none; background: #090a0f; border: var(--thickness) solid var(--border); z-index: 10000; padding: 5px 0; min-width: 220px; max-height: 450px; overflow-y: auto; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); }
        .context-menu .menu-label { padding: 6px 15px; font-size: 0.65rem; color: var(--accent); letter-spacing: 0.5px; background: rgba(255,255,255,0.02); }
        .context-menu .menu-item { padding: 10px 15px; font-size: 0.75rem; color: #e2e8f0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .context-menu .menu-item:hover { background: var(--accent); color: #000; }
        .context-menu .menu-separator { height: 1px; background: var(--border); margin: 5px 0; }

        /* Modals */
        .jjs-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10001; display: none; align-items: center; justify-content: center; }
        .jjs-modal-box { background: var(--panel); border: var(--thickness) solid var(--border); width: 550px; max-width: 90%; display: flex; flex-direction: column; max-height: 90vh; }
        .jjs-modal-header { background: rgba(0,0,0,0.5); padding: 20px; border-bottom: var(--thickness) solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .jjs-modal-title { color: var(--accent); font-size: 1.1rem; margin: 0; }
        .jjs-modal-close { background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.2rem; }
        .jjs-modal-close:hover { color: #ff1a1a; }
        .jjs-modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .jjs-modal-footer { padding: 0 20px 20px 20px; display: flex; justify-content: flex-end; gap: 12px; }
        
        .jjs-modal-textarea { width: 100%; height: 220px; background: #090a0f; color: #00ff66; border: 1px solid var(--border); padding: 15px; font-size: 0.85rem; resize: none; }
        .jjs-modal-input { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: #fff; font-size: 1rem; }
        .btn-modal-confirm { background: var(--accent); color: #000; border: 1px solid var(--border); padding: 10px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase !important; transition: filter 0.1s; }
        .btn-modal-confirm:hover { filter: brightness(1.2); }

        .anim-cat-header { font-weight: bold; padding: 12px 18px; margin-top: 6px; cursor: pointer; border: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); font-size: 0.85rem; }
        .anim-cat-content { display: none; padding: 8px; background: rgba(0,0,0,0.6); border: 2px solid var(--border); border-top: none; flex-direction: column; gap: 5px; }
        .anim-item-row { padding: 8px 14px; cursor: pointer; font-size: 0.85rem; color: #fff; transition: background 0.1s; display: flex; justify-content: space-between; }
        .anim-item-row:hover { background: var(--accent); color: #000; }

        /* Workshop & Drag */
        #drag-indicator { position: fixed; height: 4px; background-color: #00ffcc; z-index: 10000; pointer-events: none; box-shadow: 0 0 10px #00ffcc; display: none; }
        .drag-ghost { position: fixed; pointer-events: none; z-index: 9999; opacity: 0.6; filter: brightness(1.3); }

        #workshop-window { position: fixed; top: 100px; left: 100px; width: 750px; height: 550px; background: var(--panel); border: var(--thickness) solid var(--border); z-index: 9000; display: none; flex-direction: column; box-shadow: 10px 10px 0px rgba(0,0,0,0.6); }
        .workshop-header { padding: 15px; background: rgba(0,0,0,0.5); cursor: move; display: flex; justify-content: space-between; align-items: center; border-bottom: var(--thickness) solid var(--border); }
        .workshop-tabs { display: flex; border-bottom: 2px solid var(--border); overflow-x: auto; background: rgba(0,0,0,0.3); }
        .workshop-tab { flex-shrink: 0; padding: 12px 15px; background: transparent; border: none; color: var(--text); opacity: 0.5; font-weight: bold; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; }
        .workshop-tab.active { opacity: 1; color: var(--accent); border-bottom-color: var(--accent); background: rgba(0,0,0,0.4); }
        .workshop-content { padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

        #selection-banner { position: fixed; top: 50px; left: 380px; right: 0; height: 50px; background: rgba(255, 204, 51, 0.9); color: #000; display: none; align-items: center; justify-content: space-between; padding: 0 30px; z-index: 80; font-weight: bold; text-transform: uppercase; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="topbar">
    <button class="topbar-btn" onclick="openWorkshop()">Workshop <i class="fa-solid fa-toolbox" style="margin-left:5px;"></i></button>
    <button class="topbar-btn" onclick="openCustomNodeBuilder()">Custom Node Builder <i class="fa-solid fa-hammer" style="margin-left:5px;"></i></button>
    <button class="topbar-btn" onclick="openThemesUI()">Themes <i class="fa-solid fa-palette" style="margin-left:5px;"></i></button>
    <button class="topbar-btn" onclick="showShortcuts()"><i class="fa-solid fa-keyboard" style="margin-right:5px;"></i> Shortcuts</button>
    <div style="flex-grow:1;"></div>
    <span id="auth-status" style="font-size:0.75rem; opacity:0.6; margin-right:15px;">Unauthenticated</span>
    <button class="btn-jjs-action" style="padding: 6px 12px; height:auto; width:auto;" onclick="Auth()"><i class="fa-solid fa-user-lock"></i>Register</button>
</div>

<div class="app-body">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2 style="margin:0; color: var(--accent); font-size: 1.5rem; letter-spacing: 1px;">JJS Studio</h2>
            <div id="engine-status-box" class="engine-status">Loading...</div>
        </div>

        <div class="jjs-action-container">
            <div class="jjs-action-row">
                <button class="btn-jjs-action" onclick="openIOModal('import')"><i class="fa-solid fa-file-import"></i> Import</button>
                <button class="btn-jjs-action" onclick="openIOModal('export')"><i class="fa-solid fa-file-export"></i> Export</button>
            </div>
            <div id="manual-redirect-container" style="display:none; width: 100%;">
                <button class="btn-jjs-action" style="background: #ff5722; color: #fff; border-color: #000;" onclick="window.open('https://qizhengmo.github.io/Omni/', '_blank')">
                    <i class="fa-solid fa-life-ring"></i> Manual Encoding/Decoding
                </button>
            </div>
        </div>

        <div class="container-heading">Containers</div>
        <div class="container-list" id="sidebar-render-target"></div>
    </div>

    <div class="main" id="workspace-canvas-timeline"></div>
</div>

<div id="drag-indicator"></div>
<div id="selection-banner">
    <span id="selection-banner-text">Select nodes to upload...</span>
    <div>
        <button class="btn-modal-confirm" style="background: #e2e8f0; margin-right: 10px;" onclick="cancelSelectionMode()">Cancel</button>
        <button class="btn-modal-confirm" onclick="confirmSelectionMode()">Confirm</button>
    </div>
</div>

<div id="shift-a-context-menu" class="context-menu">
    <div class="menu-label">Create Container</div>
    <div class="menu-item" onclick="instantiateContainer('Skill')">Skill <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" onclick="instantiateContainer('Melee')">Melee <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" onclick="instantiateContainer('Special')">Special <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" onclick="instantiateContainer('Awakening')">Awakening <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" onclick="instantiateContainer('Chase')">Chase <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-separator"></div>
    <div class="menu-label" id="context-menu-nodes-label">Add Node</div>
    <div id="context-menu-nodes-target"></div>
</div>

<div class="jjs-modal-overlay" id="jjs-prompt-modal" style="z-index: 10005;">
    <div class="jjs-modal-box" style="width: 450px;">
        <div class="jjs-modal-header">
            <h3 class="jjs-modal-title prompt-title" id="prompt-title">Notice</h3>
        </div>
        <div class="jjs-modal-body">
            <p id="prompt-message" style="margin:0; line-height:1.6; font-size:0.9rem;"></p>
        </div>
        <div class="jjs-modal-footer" id="prompt-buttons"></div>
    </div>
</div>

<div class="jjs-modal-overlay" id="jjs-input-modal" style="z-index: 10005;">
    <div class="jjs-modal-box" style="width: 450px;">
        <div class="jjs-modal-header">
            <h3 class="jjs-modal-title prompt-title" id="input-modal-title">Input</h3>
            <button class="jjs-modal-close" onclick="document.getElementById('jjs-input-modal').style.display='none'"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="jjs-modal-body">
            <input type="text" id="input-modal-field" class="jjs-modal-input" placeholder="...">
        </div>
        <div class="jjs-modal-footer">
            <button class="btn-modal-confirm" id="input-modal-confirm">Confirm</button>
        </div>
    </div>
</div>

<div class="jjs-modal-overlay" id="jjs-io-modal" onclick="closeIOModal(event)">
    <div class="jjs-modal-box" onclick="event.stopPropagation()">
        <div class="jjs-modal-header">
            <h3 class="jjs-modal-title prompt-title" id="io-modal-title-text"><i class="fa-solid fa-terminal"></i> Data Center</h3>
            <button class="jjs-modal-close" onclick="closeIOModal(null)"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="jjs-modal-body">
            <textarea class="jjs-modal-textarea" id="io-terminal-textarea"></textarea>
        </div>
        <div class="jjs-modal-footer">
            <button class="btn-modal-confirm" id="io-action-button" onclick="executeIOAction()">Process</button>
        </div>
    </div>
</div>

<div class="jjs-modal-overlay" id="jjs-anim-modal" onclick="closeAnimModal(event)">
    <div class="jjs-modal-box" style="width: 500px;" onclick="event.stopPropagation()">
        <div class="jjs-modal-header">
            <h3 class="jjs-modal-title prompt-title"><i class="fa-solid fa-clapperboard"></i> Select Animation</h3>
            <button class="jjs-modal-close" onclick="closeAnimModal(null)"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="jjs-modal-body" id="anim-modal-body"></div>
    </div>
</div>

<div class="jjs-modal-overlay" id="jjs-themes-modal" onclick="closeThemesModal(event)">
    <div class="jjs-modal-box" onclick="event.stopPropagation()">
        <div class="jjs-modal-header">
            <h3 class="jjs-modal-title prompt-title"><i class="fa-solid fa-palette"></i> Themes Hub</h3>
            <button class="jjs-modal-close" onclick="closeThemesModal(null)"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="jjs-modal-body" id="themes-modal-content" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
</div>

<div id="workshop-window">
    <div class="workshop-header" id="workshop-drag-header">
        <strong style="color:var(--accent); font-size:1.1rem; text-transform:uppercase;"><i class="fa-solid fa-toolbox"></i> Workshop</strong>
        <button style="background:none; border:none; color:#ff4d4d; cursor:pointer; font-size:1.2rem;" onclick="document.getElementById('workshop-window').style.display='none'"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="workshop-tabs" id="workshop-tabs-container">
        <button class="workshop-tab active" onclick="setWorkshopTab('SFX')">SFX</button>
        <button class="workshop-tab" onclick="setWorkshopTab('VFX')">VFX</button>
        <button class="workshop-tab" onclick="setWorkshopTab('Mesh VFX')">Mesh VFX</button>
        <button class="workshop-tab" onclick="setWorkshopTab('Mixed VFX')">Mixed VFX</button>
        <button class="workshop-tab" onclick="setWorkshopTab('TEMPLATES')">TEMPLATES</button>
    </div>
    <div class="workshop-content" id="workshop-content"></div>
</div>

    // --- Core Engine Helpers ---
    function getInnerData(move) {
        if (!move || !move.DATA) return { Line: [], Req: [], Branch: {}, Prop: {} };
        try { return typeof move.DATA === 'string' ? JSON.parse(move.DATA) : move.DATA; } 
        catch(e) { return { Line: [], Req: [], Branch: {}, Prop: {} }; }
    }
    function saveInnerData(move, inner) { if (move) move.DATA = typeof inner === 'string' ? inner : JSON.stringify(inner); }

    // --- Init ---
    async function initEngine() {
        const engine = window.ZstdWeb || window.zstd || window.Zstd;
        if (engine?.init) { await engine.init(); zstd = engine; document.getElementById('engine-status-box').innerHTML = "ZSTD Engine: <span style='color:#00ffcc;'>Active</span>"; } 
        else { document.getElementById('engine-status-box').innerHTML = "ZSTD Engine: <span style='color:#ff9900;'>Standby</span>"; }
        
        setTimeout(() => { if (!zstd) document.getElementById('manual-redirect-container').style.display = 'block'; }, 10000);

            document.getElementById('auth-status').innerHTML = `<span style="color:#00ff66;">Authenticated</span>`;
        }
    }

    function showCustomPrompt(title, message, buttons) {
        document.getElementById('prompt-title').innerText = title;
        document.getElementById('prompt-message').innerText = message;
        const btnContainer = document.getElementById('prompt-buttons');
        btnContainer.innerHTML = '';
        buttons.forEach(btn => {
            const b = document.createElement('button');
            b.innerText = btn.text; b.className = 'btn-modal-confirm'; b.style.backgroundColor = btn.color || 'var(--accent)';
            b.onclick = () => { document.getElementById('jjs-prompt-modal').style.display = 'none'; if (btn.action) btn.action(); };
            btnContainer.appendChild(b);
        });
        document.getElementById('jjs-prompt-modal').style.display = 'flex';
    }
    function customAlert(message) { showCustomPrompt("Notice", message, [{ text: "OK", action: null }]); }
    function customConfirm(message, onYes) { showCustomPrompt("Confirm", message, [{ text: "Cancel", color: "#e2e8f0", action: null }, { text: "Confirm", color: "#ff4d4d", action: onYes }]); }

    function openInputPrompt(title, placeholder, onConfirm) {
        document.getElementById('input-modal-title').innerText = title;
        const input = document.getElementById('input-modal-field');
        input.value = ''; input.placeholder = placeholder;
        document.getElementById('input-modal-confirm').onclick = () => {
            const val = input.value.trim();
            if(val) { document.getElementById('jjs-input-modal').style.display = 'none'; onConfirm(val); }
        };
        document.getElementById('jjs-input-modal').style.display = 'flex';
        input.focus();
    }

    function pushHistory() {
        redoStack = []; historyStack.push(JSON.stringify(currentMoves));
        if(historyStack.length > 30) historyStack.shift();
    }
    function performUndo() {
        if(!historyStack.length) return;
        redoStack.push(JSON.stringify(currentMoves));
        currentMoves = JSON.parse(historyStack.pop()); selectedNodes = []; loadMove(activeIndex);
    }
    function performRedo() {
        if(!redoStack.length) return;
        historyStack.push(JSON.stringify(currentMoves));
        currentMoves = JSON.parse(redoStack.pop()); selectedNodes = []; loadMove(activeIndex);
    }

    function showShortcuts() { customAlert("SHORTCUTS:\n\nShift + Click: Multi-select nodes\nShift + A: Add Node/Menu\nShift + C: Copy\nShift + V: Paste\nShift + X: Cut\nShift + Delete: Delete\nShift + Z: Undo\nShift + Y: Redo"); }

    document.addEventListener('keydown', e => {
        if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
        if (e.shiftKey) {
            const key = e.key.toLowerCase();
            if(key === 'a') {
                e.preventDefault(); if (activeTab === 'Properties') return;
                const menu = document.getElementById('shift-a-context-menu');
                menu.style.display = 'block'; menu.style.left = Math.min(mouseX, window.innerWidth - 230) + 'px'; menu.style.top = Math.min(mouseY, window.innerHeight - menu.offsetHeight - 10) + 'px';
            }
            if(key === 'c') { e.preventDefault(); copySelected(); }
            if(key === 'x') { e.preventDefault(); cutSelected(); }
            if(key === 'v') { e.preventDefault(); pasteCopied(); }
            if(key === 'delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
            if(key === 'z') { e.preventDefault(); performUndo(); }
            if(key === 'y') { e.preventDefault(); performRedo(); }
        }
    });

    document.addEventListener('click', e => {
        const menu = document.getElementById('shift-a-context-menu');
        if (menu && !menu.contains(e.target)) menu.style.display = 'none';
    });

    function getActiveList() {
        if(activeIndex === -1 || activeTab === 'Properties') return null;
        const inner = getInnerData(currentMoves[activeIndex]);
        return (activeTab === 'Conditions') ? (activeBranch === 'Default' ? inner.Req : inner.Branch[activeBranch].Req) : (activeBranch === 'Default' ? inner.Line : inner.Branch[activeBranch].Line);
    }

    function copySelected() {
        if(!selectedNodes.length) return;
        const list = getActiveList(); if(!list) return;
        clipboard = selectedNodes.sort((a,b)=>a-b).map(idx => JSON.parse(JSON.stringify(list[idx])));
    }
    function cutSelected() { copySelected(); deleteSelected(); }
    function pasteCopied() {
        if(!clipboard.length) return; pushHistory();
        const list = getActiveList(); if(!list) return;
        const insertIdx = selectedNodes.length ? Math.max(...selectedNodes) + 1 : list.length;
        clipboard.forEach((node, i) => list.splice(insertIdx + i, 0, JSON.parse(JSON.stringify(node))));
        saveInnerData(currentMoves[activeIndex], getInnerData(currentMoves[activeIndex]));
        selectedNodes = []; loadMove(activeIndex);
    }
    function deleteSelected() {
        if(!selectedNodes.length) return; pushHistory();
        const list = getActiveList(); if(!list) return;
        const toDelete = selectedNodes.sort((a,b)=>b-a);
        toDelete.forEach(idx => list.splice(idx, 1));
        saveInnerData(currentMoves[activeIndex], getInnerData(currentMoves[activeIndex]));
        selectedNodes = []; loadMove(activeIndex);
    }

    // --- Container/Node Engine ---
    function instantiateContainer(type) {
        pushHistory();
        currentMoves.push({ K_NAME: type.toUpperCase(), NAME: "New " + type, DATA: JSON.stringify({ Line: [], Req: [], Branch: {}, Prop: {} }) });
        activeIndex = currentMoves.length - 1; activeBranch = 'Default'; activeTab = 'Timeline'; selectedNodes = [];
        renderSidebar(); loadMove(activeIndex); document.getElementById('shift-a-context-menu').style.display = 'none';
    }

    function buildContextMenuNodes() {
        const target = document.getElementById('context-menu-nodes-target'); if (!target) return;
        target.innerHTML = '';
        Object.keys(NODE_TEMPLATES).forEach(k => {
            const item = document.createElement('div'); item.className = 'menu-item';
            item.innerHTML = `${TRANSLATIONS[k] || k} <i class="fa-solid fa-plus" style="font-size:0.65rem; opacity:0.5;"></i>`;
            item.onclick = () => { appendNodeToActiveList(k); document.getElementById('shift-a-context-menu').style.display = 'none'; };
            target.appendChild(item);
        });
    }

    function appendNodeToActiveList(type) {
        if (activeIndex === -1 || activeTab === 'Properties') return;
        pushHistory();
        const inner = getInnerData(currentMoves[activeIndex]);
        const nodeTemplate = { K_NAME: type };
        const fields = (activeTab === 'Conditions' ? CONDITION_TEMPLATES[type] : NODE_TEMPLATES[type]) || [];
        fields.forEach(f => {
            if(f === "Animation") nodeTemplate["ANIM_USE"] = [1,1];
            else nodeTemplate[f] = TYPE_OVERRIDES[type]?.[f] !== undefined ? TYPE_OVERRIDES[type][f] : DEFAULTS_LIB[f];
        });
        const list = (activeTab === 'Conditions') ? (activeBranch === 'Default' ? inner.Req : inner.Branch[activeBranch].Req) : (activeBranch === 'Default' ? inner.Line : inner.Branch[activeBranch].Line);
        list.push(nodeTemplate); saveInnerData(currentMoves[activeIndex], inner); loadMove(activeIndex);
    }

    function renderSidebar() {
        const target = document.getElementById('sidebar-render-target'); if (!target) return;
        target.innerHTML = '';
        if (currentMoves.length === 0) { target.innerHTML = `<div style="text-align:center; padding:20px; opacity:0.5; font-size:0.8rem;">No containers</div>`; return; }
        currentMoves.forEach((move, idx) => {
            const el = document.createElement('div'); el.className = `item ${idx === activeIndex ? 'active' : ''}`; el.id = `btn-${idx}`;
            el.onclick = () => { activeBranch = 'Default'; activeTab = 'Timeline'; selectedNodes = []; loadMove(idx); };
            el.innerHTML = `<span class="type-tag">${move.K_NAME || 'SKILL'}</span><span class="move-name">${move.NAME || 'Unnamed'}</span>`;
            target.appendChild(el);
        });
    }

    function generateSummaryHeaderStr(node) {
        if (node.K_NAME === 'WAIT') return ` (${node.TIME ?? 1}s)`; if (node.K_NAME === 'ANIM') return ` (Asset: ${node.ANIM_USE ? node.ANIM_USE.join(',') : '1,1'})`;
        if (node.K_NAME === 'SFX') return ` (ID: ${node.ID ?? ''})`; if (node.K_NAME === 'HITBOX') return ` (Size: ${node.SIZE ?? ''})`;
        if (node.K_NAME === 'TELEPORT') return ` (Pos: ${node.POSITION ?? ''})`; if (node.K_NAME === 'CUSTOM_NODE') return ` [${node.NODE_ID ?? 'Custom'}]`;
        return '';
    }

    function toggleNodeBody(idx) { const grid = document.getElementById(`node-grid-${idx}`); if (grid) grid.style.display = grid.style.display === 'none' ? 'grid' : 'none'; }
    function alterContainerCoreName(idx, val) { currentMoves[idx].NAME = val; const sidebarItem = document.getElementById(`btn-${idx}`); if (sidebarItem) sidebarItem.querySelector('.move-name').innerText = val || 'Unnamed'; }
    
    function deleteActiveContainer(idx) {
        customConfirm("Delete this entire container?", () => { pushHistory(); currentMoves.splice(idx, 1); activeIndex = currentMoves.length > 0 ? 0 : -1; activeBranch = 'Default'; activeTab = 'Timeline'; selectedNodes = []; renderSidebar(); loadMove(activeIndex); });
    }

    function switchBranch(b) { activeBranch = b; selectedNodes = []; loadMove(activeIndex); }
    function openBranchModal(mode, currentName = '') {
        branchModalMode = mode; editingBranchName = currentName;
        openInputPrompt(mode === 'create' ? "Create Branch" : "Rename Branch", "Enter branch name...", (val) => {
            const inner = getInnerData(currentMoves[activeIndex]); if (!inner.Branch) inner.Branch = {};
            if (mode === 'create') {
                if (inner.Branch[val] || val === 'Default') { customAlert("Branch already exists!"); return; }
                pushHistory(); inner.Branch[val] = { Line: [], Req: [] }; activeBranch = val;
            } else {
                if (val === 'Default' || (inner.Branch[val] && val !== currentName)) { customAlert("Invalid branch name!"); return; }
                pushHistory(); inner.Branch[val] = inner.Branch[currentName]; delete inner.Branch[currentName];
                if (activeBranch === currentName) activeBranch = val;
            }
            saveInnerData(currentMoves[activeIndex], inner); loadMove(activeIndex);
        });
    }

    function deleteBranch(b) {
        customConfirm(`Delete branch '${b}'?`, () => { pushHistory(); const inner = getInnerData(currentMoves[activeIndex]); delete inner.Branch[b]; if (activeBranch === b) activeBranch = 'Default'; saveInnerData(currentMoves[activeIndex], inner); loadMove(activeIndex); });
    }

    function switchTab(t) { activeTab = t; selectedNodes = []; loadMove(activeIndex); }

    function alterNodeValue(nodeIdx, fieldKey, val) { const list = getActiveList(); if (!list || !list[nodeIdx]) return; list[nodeIdx][fieldKey] = val; saveInnerData(currentMoves[activeIndex], getInnerData(currentMoves[activeIndex])); const summarySpan = document.getElementById(`summary-span-${nodeIdx}`); if (summarySpan) summarySpan.innerText = generateSummaryHeaderStr(list[nodeIdx]); }
    function alterPropValue(key, val) { pushHistory(); const inner = getInnerData(currentMoves[activeIndex]); if (!inner.Prop || Array.isArray(inner.Prop)) inner.Prop = {}; inner.Prop[key] = val; saveInnerData(currentMoves[activeIndex], inner); }

    function renderWorkspaceEmpty() {
        const canvas = document.getElementById('workspace-canvas-timeline');
        if (canvas) canvas.innerHTML = `<div class="empty-state"><div><i class="fa-solid fa-folder-open" style="font-size: 3rem; color: var(--border); margin-bottom: 15px; display: block;"></i>No container open.<br><span style="font-size:0.9rem; opacity:0.6;">Select a container from the sidebar or press Shift + A to build a new one.</span></div></div>`;

    // --- Drag Mechanics ---
    document.addEventListener('mousemove', e => { 
        mouseX = e.clientX; mouseY = e.clientY; 
        if((isDraggingNode || importPlaceMode) && activeTab !== 'Properties') {
            if(isDraggingNode && dragClone) { dragClone.style.left = (e.clientX + 10) + 'px'; dragClone.style.top = (e.clientY + 10) + 'px'; }
            const container = document.getElementById('nodes-scale-container-target'); if(!container) return;
            const nodes = Array.from(container.querySelectorAll('.node-card:not(.drag-ghost)'));
            
            let closestIdx = nodes.length;
            for(let i = 0; i < nodes.length; i++) {
                const rect = nodes[i].getBoundingClientRect();
                if(e.clientY < (rect.top + rect.height / 2)) { closestIdx = i; break; }
            }
            currentDropIdx = closestIdx;
            
            if(nodes.length > 0) {
                let ind = document.getElementById('drag-indicator');
                let refRect = closestIdx < nodes.length ? nodes[closestIdx].getBoundingClientRect() : nodes[nodes.length-1].getBoundingClientRect();
                let indicatorY = closestIdx < nodes.length ? refRect.top - 10 : refRect.bottom + 10;
                ind.style.width = refRect.width + 'px'; ind.style.left = refRect.left + 'px'; ind.style.top = indicatorY + 'px'; ind.style.display = 'block';
            }
        }
    });

    document.addEventListener('mouseup', e => {
        if(importPlaceMode && currentDropIdx !== -1) {
            pushHistory(); const list = getActiveList(); list.splice(currentDropIdx, 0, ...importPayload); saveInnerData(currentMoves[activeIndex], getInnerData(currentMoves[activeIndex]));
            importPlaceMode = false; importPayload = null; document.getElementById('selection-banner').style.display = 'none'; document.getElementById('selection-banner').querySelector('button:last-child').style.display = 'inline-block'; document.getElementById('drag-indicator').style.display = 'none'; loadMove(activeIndex); return;
        }

        if(!isDraggingNode) return;
        isDraggingNode = false; if(dragClone && dragClone.parentNode) document.body.removeChild(dragClone); dragClone = null; document.getElementById('drag-indicator').style.display = 'none';
        
        if(currentDropIdx !== -1 && currentDropIdx !== draggedNodeIdx && currentDropIdx !== draggedNodeIdx + 1) {
            pushHistory(); const list = getActiveList(); const movingNode = list.splice(draggedNodeIdx, 1)[0];
            let adjustedDropIdx = currentDropIdx > draggedNodeIdx ? currentDropIdx - 1 : currentDropIdx;
            list.splice(adjustedDropIdx, 0, movingNode); saveInnerData(currentMoves[activeIndex], getInnerData(currentMoves[activeIndex]));
            selectedNodes = []; loadMove(activeIndex);
        }
        draggedNodeIdx = -1; currentDropIdx = -1;
    });

    function initCustomDrag(e, idx) { e.preventDefault(); e.stopPropagation(); if(activeTab === 'Properties') return; isDraggingNode = true; draggedNodeIdx = idx; const nodeEl = document.getElementById(`node-block-${idx}`); dragClone = nodeEl.cloneNode(true); dragClone.classList.add('drag-ghost'); dragClone.style.width = nodeEl.offsetWidth + 'px'; document.body.appendChild(dragClone); }

    function handleNodeClick(e, idx) {
        if(uploadSelectMode) {
            if(selectedNodes.includes(idx)) selectedNodes = selectedNodes.filter(i => i !== idx); else selectedNodes.push(idx);
            loadMove(activeIndex); return;
        }
        if(e.shiftKey) {
            if(selectedNodes.includes(idx)) selectedNodes = selectedNodes.filter(i => i !== idx); else selectedNodes.push(idx);
            loadMove(activeIndex);
        } else {
            if(selectedNodes.length === 1 && selectedNodes[0] === idx) toggleNodeBody(idx);
            else { selectedNodes = [idx]; loadMove(activeIndex); }
        }
    }
    
    function promptComment(idx) {

    }

    // --- Loading Routine ---
    function loadMove(idx) {
        if (currentMoves.length === 0) { renderWorkspaceEmpty(); return; }
        activeIndex = idx; document.querySelectorAll('.container-list .item').forEach(el => el.classList.remove('active')); const tb = document.getElementById(`btn-${idx}`); if (tb) tb.classList.add('active');

        const move = currentMoves[idx]; const innerData = getInnerData(move); const branchNames = innerData.Branch ? Object.keys(innerData.Branch).sort() : []; const canvas = document.getElementById('workspace-canvas-timeline');

            html += `<div class="branch-bar"><button class="branch-tab ${activeBranch === 'Default' ? 'active' : ''}" onclick="switchBranch('Default')">Default</button>`;
            branchNames.forEach(b => { html += `<button class="branch-tab ${activeBranch === b ? 'active' : ''}" onclick="switchBranch('${b}')">${b} <span style="display:flex; gap:2px; margin-left:6px;"><i class="fa-solid fa-pen edit-icon" onclick="openBranchModal('edit', '${b}'); event.stopPropagation();"></i><i class="fa-solid fa-trash delete-icon" onclick="deleteBranch('${b}'); event.stopPropagation();"></i></span></button>`; });

        if (activeTab === 'Timeline' || activeTab === 'Conditions') {

            const currentNodesList = (activeTab === 'Timeline') ? ((activeBranch === 'Default') ? innerData.Line : innerData.Branch[activeBranch]?.Line) : ((activeBranch === 'Default') ? innerData.Req : innerData.Branch[activeBranch]?.Req);
            
            if (!currentNodesList || currentNodesList.length === 0) {
                html += `<div style="text-align:center; opacity:0.4; font-size:0.8rem; padding: 40px 0;">No nodes here yet. Press Shift + A to add one.</div>`;
            } else {

            PROPERTY_ORDER.forEach(key => {
                let val = innerData.Prop[key] !== undefined ? innerData.Prop[key] : PROPERTY_DEFAULTS[key];
                let inputHtml = typeof PROPERTY_DEFAULTS[key] === 'boolean' ? `<input type="checkbox" ${val === true || val === 'true' ? 'checked' : ''} onchange="alterPropValue('${key}', this.checked)">` : (typeof PROPERTY_DEFAULTS[key] === 'number' ? `<input type="number" step="0.1" value="${val}" oninput="alterPropValue('${key}', parseFloat(this.value) || 0)">` : `<input type="text" value="${val}" oninput="alterPropValue('${key}', this.value)">`);

    function buildPropertyFieldsMarkup(node, nodeIdx, context = 'Timeline') {
        let fieldsHtml = ''; const schemaFields = (context === 'Conditions' ? CONDITION_TEMPLATES[node.K_NAME] : NODE_TEMPLATES[node.K_NAME]) || Object.keys(node);
        schemaFields.forEach(fieldKey => {
            if (fieldKey === 'K_NAME' || fieldKey === '_COMMENT') return;
            
            if (fieldKey === 'Animation' || fieldKey === 'ANIM_USE') {
                let currentVal = node.ANIM_USE || [1, 1]; let matchedLabel = "Select Animation Asset";
                for (let cat in ANIMATION_DICTIONARY) { let match = ANIMATION_DICTIONARY[cat].animations.find(a => a.val[0] === currentVal[0] && a.val[1] === currentVal[1]); if (match) { matchedLabel = match.name; break; } }
                fieldsHtml += `<div class="field" style="grid-column: span 2;"><label>Animation Asset Lookup</label><button class="branch-tab" style="width: 100%; border: 1px solid var(--border); background: rgba(0,0,0,0.5); text-transform:none !important;" onclick="triggerAnimMenu(${nodeIdx})"><i class="fa-solid fa-clapperboard"></i> ${matchedLabel} [${currentVal.join(', ')}]</button></div>`;
                return;
            }

            if (node.K_NAME === 'BRANCH' && fieldKey === 'RANDOM') {
                const availableBranches = ["", "Default", ...(getInnerData(currentMoves[activeIndex]).Branch ? Object.keys(getInnerData(currentMoves[activeIndex]).Branch) : [])];
                let val = node[fieldKey] !== undefined ? node[fieldKey] : "";
                let opts = availableBranches.map(b => `<option value="${b}" ${val === b ? 'selected' : ''}>${b || 'None'}</option>`).join('');
                fieldsHtml += `<div class="field"><label>RANDOM (Existing Target Branch)</label><select style="width:100%; color:#fff; background:transparent; border:none; border-bottom:1px solid var(--border);" onchange="alterNodeValue(${nodeIdx}, 'RANDOM', this.value)">${opts}</select></div>`;
                return;
            }

            const currentVal = node[fieldKey] !== undefined ? node[fieldKey] : DEFAULTS_LIB[fieldKey]; let markup = '';
            if (typeof currentVal === 'boolean' || currentVal === 'true' || currentVal === 'false') { markup = `<input type="checkbox" ${(currentVal === true || currentVal === 'true') ? 'checked' : ''} onchange="pushHistory(); alterNodeValue(${nodeIdx}, '${fieldKey}', this.checked)">`; } 
            else if (Array.isArray(currentVal)) { markup = `<input type="text" value="${currentVal.join(', ')}" oninput="pushHistory(); alterNodeValue(${nodeIdx}, '${fieldKey}', this.value.split(',').map(n => parseFloat(n.trim()) || n.trim()))">`; } 
            else if (typeof currentVal === 'number' || (!isNaN(currentVal) && currentVal !== '')) { markup = `<input type="number" step="0.01" value="${currentVal}" oninput="pushHistory(); alterNodeValue(${nodeIdx}, '${fieldKey}', parseFloat(this.value) || 0)">`; } 
            else { markup = `<input type="text" value="${currentVal ?? ''}" oninput="pushHistory(); alterNodeValue(${nodeIdx}, '${fieldKey}', this.value)">`; }
            fieldsHtml += `<div class="field"><label>${fieldKey}</label>${markup}</div>`;
        });
        return fieldsHtml;
    }

    async function Auth() {
        const { data, error } = await supabase.auth.signInAnonymously();
        if (error) { customAlert("Auth failed. Please ensure 'Anonymous Sign-ins' is enabled in your Supabase Auth Providers settings."); return; }
        authUser = { name: "Creator_" + data.user.id.substring(0, 6), uid: data.user.id };
        document.getElementById('auth-status').innerHTML = `<span style="color:#00ff66;">Authenticated</span>`;
        customAlert("Successfully authenticated with Supabase.");
    }

    function initWorkshopDragger() {
        const win = document.getElementById('workshop-window'); const header = document.getElementById('workshop-drag-header');
        let isDraggingWin = false; let offsetX, offsetY;
        header.addEventListener('mousedown', e => { if(e.target.tagName === 'BUTTON' || e.target.tagName === 'I') return; isDraggingWin = true; offsetX = e.clientX - win.getBoundingClientRect().left; offsetY = e.clientY - win.getBoundingClientRect().top; });
        document.addEventListener('mousemove', e => { if(isDraggingWin) { win.style.left = (e.clientX - offsetX) + 'px'; win.style.top = (e.clientY - offsetY) + 'px'; } });
        document.addEventListener('mouseup', () => isDraggingWin = false );
    }

    function openWorkshop() { document.getElementById('workshop-window').style.display = 'flex'; setWorkshopTab(currentWorkshopTab); }
    
    async function setWorkshopTab(tab) {
        currentWorkshopTab = tab; document.querySelectorAll('.workshop-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.workshop-tab').forEach(t => { if (t.innerText.trim() === tab) t.classList.add('active'); });

        let content = `<div style="display:flex; justify-content:space-between; margin-bottom:15px;"><strong style="color:var(--accent);" class="uppercase-force">${tab} Hub</strong><button class="btn-jjs-action" style="width:auto; padding:5px 15px;" onclick="startWorkshopUpload()"><i class="fa-solid fa-cloud-arrow-up"></i> Upload to ${tab}</button></div>`;

        if (tab === 'TEMPLATES') {
            content += `<div style="text-align:center; padding:50px; opacity:0.5;">Loading templates from Supabase...</div>`;
            document.getElementById('workshop-content').innerHTML = content;
            await loadWorkshopTemplates(); return;
        }

        const items = JSON.parse(localStorage.getItem(`ws_${tab}`) || '[]');
        if(items.length === 0) content += `<div style="text-align:center; padding:50px; opacity:0.5;">Placeholder [${tab} is Empty]</div>`;
        else {
            content += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">`;
            items.forEach((item, i) => {
                content += `<div style="background:rgba(0,0,0,0.4); border:1px solid var(--border); padding:15px;"><div style="font-weight:bold; color:#fff; font-size:1.1rem; margin-bottom:5px;">${item.title}</div><div style="font-size:0.75rem; opacity:0.7; margin-bottom:10px;">By: ${item.author}</div><div style="font-size:0.85rem; margin-bottom:15px; color:#aaa;">${item.desc}</div><button class="btn-modal-confirm" style="width:100%; font-size:0.7rem;" onclick="importFromWorkshop('${tab}', ${i})"><i class="fa-solid fa-download"></i> Get</button></div>`;
            });
            content += `</div>`;
        }
        document.getElementById('workshop-content').innerHTML = content;
    }

    function renderTemplateList(official, community) {
        const all = [...official, ...community];
        if (!all.length) { document.getElementById('workshop-content').innerHTML = `<div style="text-align:center; padding:50px; opacity:0.5;">No templates yet.</div>`; return; }
        
        let html = `<div style="display:flex; justify-content:space-between; margin-bottom:15px;"><strong style="color:var(--accent);" class="uppercase-force">TEMPLATES Hub</strong><span style="font-size:0.75rem; opacity:0.6;">Official + Community</span></div>`;
        html += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">`;
        all.forEach((item) => {
            const isOwner = authUser && authUser.uid === item.user_id;
            const delBtn = isOwner ? `<button style="background:transparent; border:none; color:#ff4d4d; cursor:pointer;" onclick="deleteTemplate('${item.id}', event)"><i class="fa-solid fa-trash"></i></button>` : '';
            
            html += `<div style="background:rgba(0,0,0,0.4); border:1px solid var(--border); padding:15px;">
                <div style="display:flex; justify-content:space-between;">
                    <div style="font-weight:bold; color:#fff; font-size:1.1rem; margin-bottom:5px;">${item.title || 'Untitled'} ${item.is_official ? '(OFFICIAL)' : ''}</div>
                    ${delBtn}
                </div>
                <div style="font-size:0.75rem; opacity:0.7; margin-bottom:10px;">By: ${item.author || 'Anonymous'}</div>
                <div style="font-size:0.85rem; margin-bottom:15px; color:#aaa;">${item.description || ''}</div>
                <button class="btn-modal-confirm" style="width:100%; font-size:0.7rem;" onclick="importTemplateToWorkspace('${item.id}', ${item.is_official ? 'true' : 'false'})"><i class="fa-solid fa-download"></i> Get</button>
            </div>`;
        });
        html += `</div>`;
        document.getElementById('workshop-content').innerHTML = html;
    }

    async function loadWorkshopTemplates() {
        try {
            const { data, error } = await supabase.from('templates').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            const templates = Array.isArray(data) ? data : [];
            const official = templates.filter(t => t.is_official === true);
            const community = templates.filter(t => !t.is_official);
            renderTemplateList(official, community);
        } catch (e) {
            console.error(e);
            document.getElementById('workshop-content').innerHTML = `<div style="text-align:center; padding:50px; opacity:0.5;">Failed to load templates. Are Supabase keys set?</div>`;
        }
    }

    async function saveCustomTemplate(title, description, dataPayload) {
        try {
            if (!Array.isArray(dataPayload)) dataPayload = [dataPayload];
            const row = { title, description: description || null, author: authUser?.name || 'Anonymous', is_official: false, data: dataPayload };
            const { error } = await supabase.from('templates').insert(row);
            if (error) throw error;
            customAlert("Successfully uploaded template to Supabase!");
            await loadWorkshopTemplates();
        } catch (e) { console.error(e); customAlert("Failed to upload template to Supabase."); }
    }

    async function importTemplateToWorkspace(id, isOfficial) {
        try {
            const { data, error } = await supabase.from('templates').select('data').eq('id', id).single();
            if (error) throw error;
            currentMoves = JSON.parse(JSON.stringify(data?.data || []));
            activeIndex = currentMoves.length > 0 ? 0 : -1; activeBranch = 'Default'; activeTab = 'Timeline'; selectedNodes = [];
            document.getElementById('workshop-window').style.display = 'none';
            renderSidebar(); loadMove(activeIndex);
        } catch (e) { console.error(e); customAlert("Failed to import template from Supabase."); }
    }

    async function deleteTemplate(id, event) {
        if (event) event.stopPropagation();
        customConfirm("Delete this template from the cloud?", async () => {
            try {
                const { error } = await supabase.from('templates').delete().eq('id', id);
                if (error) throw error;
                customAlert("Template deleted.");
                await loadWorkshopTemplates();
            } catch (e) { console.error(e); customAlert("Failed to delete template."); }
        });
    }

    function startWorkshopUpload() {
        if(!authUser) { customAlert("You must authenticate with Roblox (Login) first to upload."); return; }
        document.getElementById('workshop-window').style.display = 'none';
        
        if (currentWorkshopTab === 'TEMPLATES') {
            openInputPrompt("Upload Template", "Paste ZSTD string or JSON here...", async (val) => {
                let payloadToStore = [];
                try {
                    if (typeof val === 'string' && (val.trim().startsWith('[') || val.trim().startsWith('{'))) {
                        payloadToStore = JSON.parse(val);
                        if (!Array.isArray(payloadToStore)) payloadToStore = [payloadToStore];
                    } else {
                        if (!zstd) { customAlert("ZSTD Engine is still loading. Wait a moment."); return; }
                        const rawBuffer = Uint8Array.from(atob(val), c => c.charCodeAt(0));
                        payloadToStore = JSON.parse(new TextDecoder().decode(zstd.decompress(rawBuffer)));
                        if (!Array.isArray(payloadToStore)) payloadToStore = [payloadToStore];
                    }
                } catch (e) { customAlert("Invalid string format. Could not decode."); return; }

                openInputPrompt("Template Title", "Enter title...", async (title) => {
                    openInputPrompt("Description", "Enter short description...", async (desc) => {
                        await saveCustomTemplate(title, desc, payloadToStore);
                        openWorkshop();
                    });
                });
            });
            return;
        }

        uploadSelectMode = true; selectedNodes = []; document.getElementById('selection-banner').style.display = 'flex'; loadMove(activeIndex);
    }

    function confirmSelectionMode() {
        if(!selectedNodes.length) { customAlert("No nodes selected."); return; }
        const list = getActiveList();
        
        for(let idx of selectedNodes) {
            let node = list[idx];
            if(currentWorkshopTab === 'SFX' && node.K_NAME !== 'SFX') { customAlert("SFX category only accepts Sound nodes."); return; }
            if(currentWorkshopTab === 'VFX' && (node.K_NAME !== 'VISUAL' || node.EFFECT === 'Mesh')) { customAlert("VFX accepts non-mesh visual nodes only."); return; }
            if(currentWorkshopTab === 'Mesh VFX' && (node.K_NAME !== 'VISUAL' || node.EFFECT !== 'Mesh')) { customAlert("Mesh VFX requires visual nodes with the 'Mesh' effect."); return; }
            if(currentWorkshopTab === 'Mixed VFX' && node.K_NAME !== 'VISUAL') { customAlert("Mixed VFX accepts any Visual nodes only."); return; }
        }

        const dataToUpload = selectedNodes.sort((a,b)=>a-b).map(i => list[i]);
        cancelSelectionMode();
        
        openInputPrompt("Upload Title", "Enter title...", (title) => {
            openInputPrompt("Description", "Enter short description...", (desc) => {
                let items = JSON.parse(localStorage.getItem(`ws_${currentWorkshopTab}`) || '[]');
                items.push({ title, desc, author: authUser.name, payload: dataToUpload });
                localStorage.setItem(`ws_${currentWorkshopTab}`, JSON.stringify(items));
                customAlert("Successfully uploaded to local workshop memory!");
                openWorkshop();
            });
        });
    }

    function cancelSelectionMode() { uploadSelectMode = false; document.getElementById('selection-banner').style.display = 'none'; selectedNodes=[]; loadMove(activeIndex); }

    function importFromWorkshop(tab, idx) {
        if (tab === 'TEMPLATES') return;
        const item = JSON.parse(localStorage.getItem(`ws_${tab}`))[idx];
        document.getElementById('workshop-window').style.display = 'none';
        importPlaceMode = true; importPayload = item.payload;
        document.getElementById('selection-banner-text').innerText = "Click between nodes to place download...";
        document.getElementById('selection-banner').style.display = 'flex';
        document.getElementById('selection-banner').querySelector('button:last-child').style.display = 'none';
    }

    function openCustomNodeBuilder() { customAlert("Custom Node Builder: Use Shift+A to spawn 'CUSTOM NODE', configuring it as a logical boundary marker for export loops."); }
    
    function generateCleanExportData() {
        let clean = JSON.parse(JSON.stringify(currentMoves));
        clean.forEach(move => {
            let inner = getInnerData(move);
            const processList = (list) => {
                if(!list) return;
                for(let i = list.length - 1; i >= 0; i--) {
                    delete list[i]._COMMENT;
                    if(list[i].K_NAME === 'CUSTOM_NODE') {
                        let node = list[i];
                        let expansion = [ { "K_NAME": "TAG", "ADD/REMOVE": false, "CHECK": false, "SET": false, "VALUE": `Start [${node.NODE_ID}]` }, { "K_NAME": "TAG", "ADD/REMOVE": false, "CHECK": false, "SET": false, "VALUE": `End [MacroReconstruct]` } ];
                        list.splice(i, 1, ...expansion);
                    }
                }
            };
            processList(inner.Line); processList(inner.Req);
            for(let b in inner.Branch) { processList(inner.Branch[b].Line); processList(inner.Branch[b].Req); }
            move.DATA = JSON.stringify(inner);
        });
        return clean;
    }

    // --- IO Center Logic ---
    function executeIOAction() {
        const tx = document.getElementById('io-terminal-textarea');
        if (ioModalMode === 'export') {
            tx.select(); document.execCommand('copy'); customAlert("Data copied to clipboard!"); closeIOModal(null);
        } else if (ioModalMode === 'import') {
            const rawVal = tx.value.trim(); if (!rawVal) return;
            let pData = [];
            try {
                if (rawVal.startsWith('[') || rawVal.startsWith('{')) pData = JSON.parse(rawVal);
                else {
                    if (!zstd) { document.getElementById('manual-redirect-container').style.display='block'; customAlert("Engine standby. Use manual tool."); return; }
                    pData = JSON.parse(new TextDecoder().decode(zstd.decompress(Uint8Array.from(atob(rawVal), c => c.charCodeAt(0)))));
                }
                if (!Array.isArray(pData)) pData = [pData];
                
                if (currentMoves.length > 0) {
                    importPayload = pData;
                    showCustomPrompt("Conflict", "Workspace not empty. Import method?", [
                        { text: "Merge", color: "#00ff66", action: () => { pushHistory(); currentMoves = currentMoves.concat(importPayload); finalizeImport(); } },
                        { text: "Overwrite", color: "#ff4d4d", action: () => { pushHistory(); currentMoves = importPayload; finalizeImport(); } },
                        { text: "Cancel", color: "#e2e8f0", action: () => importPayload = null }
                    ]);
                } else { currentMoves = pData; finalizeImport(); }
            } catch(e) { document.getElementById('manual-redirect-container').style.display='block'; customAlert("Import failed. Check formatting."); }
        }
    }
    
    function finalizeImport() { activeIndex = currentMoves.length > 0 ? 0 : -1; activeBranch = 'Default'; activeTab = 'Timeline'; selectedNodes=[]; renderSidebar(); loadMove(activeIndex); closeIOModal(null); }
    
    function openIOModal(mode) {
        ioModalMode = mode; const overlay = document.getElementById('jjs-io-modal'); const title = document.getElementById('io-modal-title-text'); const tx = document.getElementById('io-terminal-textarea'); const btn = document.getElementById('io-action-button');
        tx.value = ''; overlay.style.display = 'flex';
        if (mode === 'import') { title.innerHTML = "<i class='fa-solid fa-file-import'></i> Import Data"; tx.readOnly = false; btn.innerText = "Import"; } 
        else {
            title.innerHTML = "<i class='fa-solid fa-file-export'></i> Export Data"; tx.readOnly = true; btn.innerText = "Copy to Clipboard";
            if (currentMoves.length === 0) { tx.value = "[]"; return; }
            try {
                const expData = generateCleanExportData();
                if (!zstd) tx.value = JSON.stringify(expData, null, 2); 
                else {
                    const eBin = zstd.compress(new TextEncoder().encode(JSON.stringify(expData)), 3);
                    let b64 = ""; for (let i = 0; i < eBin.length; i++) b64 += String.fromCharCode(eBin[i]);
                    tx.value = btoa(b64);
                }
            } catch (err) { tx.value = "[]"; }
        }
    }

    function closeIOModal(e) { if (!e || e.target === document.getElementById('jjs-io-modal')) document.getElementById('jjs-io-modal').style.display = 'none'; }

    window.addEventListener('DOMContentLoaded', initEngine);
</script>
