<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JJS STUDIO V1.7.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #1a1a1a; 
            --thickness: 4px; 
            --accent: #ffcc33; 
            --panel: #111;
            --text: #e0e0e0; 
            --node-card: #252525;
            --border: #000;
        }

        * { font-family: 'Finger Paint', cursive; box-sizing: border-box; outline: none; border-radius: 0 !important; }
        
        body { 
            margin: 0; 
            background-color: var(--bg);
            background-image: 
                linear-gradient(rgba(0,0,0,0.3) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px);
            background-size: 50px 50px;
            color: var(--text); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .sidebar { 
            width: 380px; 
            background: var(--panel); 
            border-right: var(--thickness) solid var(--border); 
            display: flex; 
            flex-direction: column; 
            z-index: 10; 
            box-shadow: 5px 0 0 rgba(0,0,0,0.2);
        }
        
        .sidebar-header { 
            padding: 25px; 
            border-bottom: var(--thickness) solid var(--border); 
            text-align: center; 
        }
        
        .io-container { 
            padding: 20px; 
            background: #000; 
            margin: 15px; 
            border: var(--thickness) solid var(--border); 
            box-shadow: 6px 6px 0px #000;
        }
        
        textarea { 
            width: 100%; 
            height: 100px; 
            background: #050505; 
            color: #2ecc71; 
            border: calc(var(--thickness)/2) solid var(--border); 
            font-size: 10px; 
            resize: none; 
            margin-bottom: 10px; 
            padding: 8px; 
            font-family: monospace; 
        }
        
        .btn { 
            width: 100%; 
            padding: 14px; 
            border: var(--thickness) solid var(--border); 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: transform 0.1s, box-shadow 0.1s; 
            margin-bottom: 8px; 
        }
        
        .btn-load { background: var(--accent); color: #000; }
        .btn-save { background: #2ecc71; color: #fff; }
        
        .btn:hover { 
            transform: translate(-4px, -4px); 
            box-shadow: 6px 6px 0px #000; 
            filter: brightness(1.1);
        }

        .container-list { flex: 1; overflow-y: auto; padding: 15px; scrollbar-width: thin; scrollbar-color: var(--accent) #000; }
        
        .item { 
            padding: 18px; 
            background: var(--node-card); 
            margin-bottom: 12px; 
            cursor: pointer; 
            border: var(--thickness) solid var(--border);
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .item:hover { 
            background: #333; 
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }
        
        .item.active { 
            background: var(--accent); 
            color: #000;
        }
        
        .item.active .type-tag, .item.active .move-name { color: #000; }
        .item .type-tag { font-size: 0.65rem; color: var(--accent); text-transform: uppercase; }
        .item .move-name { display: block; font-size: 1.2rem; color: #fff; }

        .main { flex: 1; overflow-y: auto; padding: 40px; }
        
        .editor-header { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            border-left: var(--thickness) solid var(--accent); 
            padding-left: 20px; 
            margin-bottom: 40px; 
        }
        
        .tooltip-field { 
            background: #000; 
            border: var(--thickness) solid var(--border); 
            padding: 12px; 
            max-width: 400px; 
            margin-top: 10px; 
            box-shadow: 5px 5px 0px #000;
        }
        
        .tooltip-field label { display: block; font-size: 0.65rem; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; }
        .tooltip-field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem; border-bottom: 2px solid #333; }
        .tooltip-field input:focus { border-bottom-color: var(--accent); }
        
        .node-card { 
            background: var(--panel); 
            border: var(--thickness) solid var(--border); 
            margin-bottom: 30px; 
            overflow: hidden; 
            box-shadow: 10px 10px 0px rgba(0,0,0,1); 
        }
        
        .node-head { 
            background: #222; 
            padding: 15px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: var(--thickness) solid var(--border); 
        }
        
        .node-head strong { color: var(--accent); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .node-grid { padding: 25px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        
        .field { 
            background: #000; 
            border: calc(var(--thickness)/2) solid var(--border); 
            padding: 12px; 
            box-shadow: 4px 4px 0px #000;
        }
        
        .field label { display: block; font-size: 0.65rem; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        .field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem; border-bottom: 2px solid #222; }
        .field input:focus { border-bottom-color: var(--accent); }

        .empty-state { text-align: center; margin-top: 150px; border: var(--thickness) dashed var(--border); padding: 40px; background: #111; max-width: 500px; margin-left: auto; margin-right: auto; box-shadow: 10px 10px 0 #000; }

        /* SAFETY CUSTOM PROMPT DIALOG SCREEN OVERLAYS */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none; align-items: center;
            justify-content: center; z-index: 1000;
        }
        .modal-box {
            background: #111; border: var(--thickness) solid #000;
            padding: 30px; max-width: 520px; width: 90%; box-shadow: 15px 15px 0 #000; text-align: center;
        }
        .modal-title { font-size: 1.4rem; color: var(--accent); margin-top: 0; margin-bottom: 15px; text-transform: uppercase; }
        .modal-body { font-size: 0.9rem; margin-bottom: 25px; color: #bbb; line-height: 1.4; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-modal { padding: 12px; border: var(--thickness) solid #000; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; }
        .btn-cancel { background: #555; color: #fff; }
        .btn-merge { background: #3498db; color: #fff; }
        .btn-replace { background: #e74c3c; color: #fff; }
        .btn-modal:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 #000; }
    </style>
</head>
<body>

<div class="modal-overlay" id="safety-modal">
    <div class="modal-box">
        <h3 class="modal-title" id="modal-header-text">Action Intercepted</h3>
        <p class="modal-body" id="modal-body
