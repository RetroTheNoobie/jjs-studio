<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJS Studio - V1.3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap\" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="./zstd-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script async crossorigin="anonymous" data-clerk-publishable-key="YOUR_CLERK_PUBLISHABLE_KEY" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>

    <style id="custom-theme-style"></style>
    <style>
        * { text-transform: none !important; box-sizing: border-box; font-family: 'Finger Paint', cursive; border-radius: 0 !important; outline: none; }
        
        .uppercase-force, .topbar-btn, .sidebar-header h2, .btn-jjs-action, .container-heading, .workspace-tab, .menu-label, .node-head strong, .anim-cat-header, .workshop-tab, .prompt-title { text-transform: uppercase !important; }

        :root {
            --bg: #121317; --panel: #1a1c23; --node-card: #222530; --accent: #ffcc33; --text: #e2e8f0; --border: #2d313f; --thickness: 3px;
            --font-code: 'Finger Paint', cursive;
        }

        body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 14px; user-select: none; }
        
        /* Account Dropdown Styles */
        .account-menu-container { position: relative; display: inline-block; }
        .account-dropdown { display: none; position: absolute; right: 0; top: calc(100% + 5px); background: var(--panel); border: var(--thickness) solid var(--border); min-width: 240px; z-index: 2000; box-shadow: 0 8px 24px rgba(0,0,0,0.6); flex-direction: column; }
        .account-dropdown.show { display: flex; }
        .account-item { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 0.8rem; cursor: pointer; color: var(--text); transition: background 0.15s; display: flex; align-items: center; gap: 10px; }
        .account-item:last-child { border-bottom: none; }
        .account-item:hover { background: var(--accent); color: #000; }
        .account-item.active-session { background: rgba(0,255,102,0.08); border-left: var(--thickness) solid #00ff66; cursor: default; color: var(--text); }
        .account-item.active-session:hover { background: rgba(0,255,102,0.08); color: var(--text); }

        #topbar { height: 50px; background: var(--panel); border-bottom: var(--thickness) solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 10; }
        .topbar-brand { display: flex; align-items: center; gap: 10px; }
        .topbar-brand h1 { margin: 0; font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; }
        .btn-jjs-action { background: var(--panel); border: var(--thickness) solid var(--border); color: var(--text); padding: 8px 16px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 8px; box-shadow: 3px 3px 0 var(--border); }
        .btn-jjs-action:hover { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 1px 1px 0 #000; transform: translate(2px, 2px); }
        .btn-jjs-action:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #000; }

        #main-container { display: flex; flex: 1; height: calc(100vh - 50px); overflow: hidden; position: relative; }
        #left-sidebar { width: 320px; background: var(--panel); border-right: var(--thickness) solid var(--border); display: flex; flex-direction: column; z-index: 5; }
        .sidebar-header { padding: 15px; border-bottom: var(--thickness) solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header h2 { margin: 0; font-size: 0.9rem; color: var(--accent); letter-spacing: 0.5px; }
        
        .list-container { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .move-card { background: var(--node-card); border: var(--thickness) solid var(--border); padding: 12px; cursor: pointer; transition: all 0.15s ease; position: relative; display: flex; flex-direction: column; gap: 4px; }
        .move-card:hover { border-color: var(--accent); }
        .move-card.active { border-color: var(--accent); background: rgba(255,204,51,0.05); }
        .move-card-title { font-weight: bold; font-size: 0.9rem; color: #fff; word-break: break-all; padding-right: 25px; }
        .move-card-branch { font-size: 0.7rem; color: var(--accent); opacity: 0.8; }
        .move-card-actions { position: absolute; right: 10px; top: 12px; display: flex; gap: 8px; opacity: 0; transition: opacity 0.15s; }
        .move-card:hover .move-card-actions { opacity: 1; }
        .move-action-btn { background: none; border: none; color: var(--text); cursor: pointer; padding: 2px; font-size: 0.85rem; opacity: 0.6; transition: opacity 0.15s, color 0.15s; }
        .move-action-btn:hover { opacity: 1; color: var(--accent); }
        .move-action-btn.del-btn:hover { color: #ff4d4d; }

        #workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; }
        #workspace-tabs { height: 40px; background: var(--panel); border-bottom: var(--thickness) solid var(--border); display: flex; align-items: center; padding: 0 10px; gap: 5px; }
        .workspace-tab { padding: 0 15px; height: calc(100% + var(--thickness)); display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: bold; border: var(--thickness) solid transparent; border-bottom: none; cursor: pointer; transition: all 0.15s; position: relative; top: calc(var(--thickness) / 2); margin-top: calc(var(--thickness) * -1); color: var(--text); opacity: 0.6; }
        .workspace-tab:hover { opacity: 1; background: rgba(255,255,255,0.02); }
        .workspace-tab.active { opacity: 1; background: var(--bg); border-color: var(--border); border-bottom-color: var(--bg); color: var(--accent); z-index: 2; }
        
        #workspace-view-content { flex: 1; position: relative; overflow: hidden; display: flex; }
        .view-panel { display: none; width: 100%; height: 100%; position: relative; }
        .view-panel.active { display: flex; }

        #timeline-view { flex-direction: column; overflow-y: auto; padding: 20px; gap: 20px; }
        .timeline-section { background: var(--panel); border: var(--thickness) solid var(--border); display: flex; flex-direction: column; }
        .timeline-section-header { padding: 10px 15px; border-bottom: var(--thickness) solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.15); }
        .timeline-section-header h3 { margin: 0; font-size: 0.85rem; color: var(--accent); }
        .timeline-row-container { display: flex; flex-direction: column; }
        .timeline-row { display: flex; border-bottom: 1px solid var(--border); min-height: 45px; align-items: center; }
        .timeline-row:last-child { border-bottom: none; }
        .timeline-label { width: 150px; padding: 0 15px; border-right: var(--thickness) solid var(--border); font-size: 0.75rem; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; height: 100%; background: rgba(0,0,0,0.05); }
        .timeline-track { flex: 1; display: flex; position: relative; height: 100%; min-height: 45px; align-items: center; padding: 0 10px; gap: 10px; overflow-x: auto; }
        
        .timeline-node { background: var(--node-card); border: 2px solid var(--border); padding: 6px 12px; font-size: 0.75rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; white-space: nowrap; height: 30px; }
        .timeline-node:hover { border-color: var(--accent); }
        .timeline-node.selected { border-color: var(--accent); background: rgba(255,204,51,0.1); box-shadow: 0 0 8px rgba(255,204,51,0.2); }

        #canvas-view { position: relative; background: var(--bg); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #canvas-container { position: absolute; width: 5000px; height: 5000px; background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 24px 24px; transform-origin: 0 0; }
        
        .canvas-node-card { position: absolute; background: var(--panel); border: var(--thickness) solid var(--border); width: 220px; display: flex; flex-direction: column; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); z-index: 1; cursor: grab; }
        .canvas-node-card:active { cursor: grabbing; }
        .canvas-node-card.selected { border-color: var(--accent); box-shadow: 0 0 12px rgba(255,204,51,0.3); z-index: 2; }
        .node-head { padding: 8px 12px; background: rgba(0,0,0,0.2); border-bottom: var(--thickness) solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--accent); }
        .node-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; background: var(--node-card); }
        .node-body-row { display: flex; justify-content: space-between; opacity: 0.8; }
        .node-body-row span:last-child { color: #fff; font-weight: bold; }
        
        #right-inspector { width: 340px; background: var(--panel); border-left: var(--thickness) solid var(--border); display: flex; flex-direction: column; z-index: 5; }
        .inspector-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; pading: 40px; text-align: center; opacity: 0.4; gap: 15px; }
        .inspector-placeholder i { font-size: 2.5rem; }
        .inspector-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .inspector-group { padding: 15px; border-bottom: var(--thickness) solid var(--border); display: flex; flex-direction: column; gap: 12px; }
        .inspector-group:last-child { border-bottom: none; }
        .inspector-group-title { font-size: 0.75rem; color: var(--accent); margin: 0 0 4px 0; letter-spacing: 0.5px; }
        
        .field-row { display: flex; flex-direction: column; gap: 6px; }
        .field-row label { font-size: 0.7rem; opacity: 0.6; font-weight: bold; }
        .field-input { background: var(--bg); border: 2px solid var(--border); color: #fff; padding: 8px 10px; font-size: 0.8rem; width: 100%; transition: border-color 0.15s; }
        .field-input:focus { border-color: var(--accent); }
        .field-input[type="checkbox"] { width: auto; align-self: flex-start; cursor: pointer; accent-color: var(--accent); margin: 4px 0; }
        
        .window-overlay { position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .jjs-window { background: var(--panel); border: var(--thickness) solid var(--border); width: 650px; max-width: 90%; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .window-header { padding: 15px; border-bottom: var(--thickness) solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.15); }
        .window-title { margin:0; font-size: 0.9rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        .window-close { background: none; border: none; color: var(--text); cursor: pointer; font-size: 1.1rem; opacity: 0.5; transition: opacity 0.15s, color 0.15s; }
        .window-close:hover { opacity: 1; color: #ff4d4d; }
        .window-body { padding: 20px; overflow-y: auto; max-height: 70vh; display: flex; flex-direction: column; gap: 15px; }
        
        .workshop-tabs { display: flex; gap: 10px; border-bottom: var(--thickness) solid var(--border); padding-bottom: 12px; }
        .workshop-tab { padding: 8px 16px; background: var(--node-card); border: 2px solid var(--border); font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: all 0.15s; }
        .workshop-tab:hover { border-color: var(--accent); }
        .workshop-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
        
        .workshop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; padding: 5px 0; }
        .workshop-card { background: var(--node-card); border: var(--thickness) solid var(--border); padding: 15px; cursor: pointer; transition: all 0.15s ease; display: flex; flex-direction: column; gap: 8px; position: relative; }
        .workshop-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .workshop-card-title { font-weight: bold; font-size: 0.95rem; color: #fff; word-break: break-all; padding-right: 25px; }
        .workshop-card-desc { font-size: 0.75rem; opacity: 0.6; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .workshop-card-meta { margin-top: auto; display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--accent); opacity: 0.8; border-top: 1px solid var(--border); padding-top: 8px; }
        .workshop-delete-btn { position: absolute; right: 12px; top: 12px; background: none; border: none; color: opacity:0.5; cursor: pointer; font-size: 0.85rem; color: var(--text); transition: color 0.15s, opacity 0.15s; opacity: 0.5; }
        .workshop-card:hover .workshop-delete-btn { opacity: 1; }
        .workshop-delete-btn:hover { color: #ff4d4d !important; }

        .terminal-textarea { background: #0c0d10; border: 2px solid var(--border); color: #00ff66; font-family: monospace; font-size: 0.85rem; padding: 12px; width: 100%; height: 180px; resize: none; line-height: 1.5; }
        
        .branch-tag-container { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.1); }
        .branch-tag { padding: 4px 10px; font-size: 0.7rem; font-weight: bold; background: var(--node-card); border: 2px solid var(--border); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
        .branch-tag:hover { border-color: var(--accent); }
        .branch-tag.active { border-color: var(--accent); color: var(--accent); background: rgba(255,204,51,0.05); }
        .branch-tag-del { font-size: 0.75rem; opacity: 0.5; transition: opacity 0.15s; }
        .branch-tag-del:hover { opacity: 1; color: #ff4d4d; }

        .jjs-prompt-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .jjs-prompt-box { background: var(--panel); border: var(--thickness) solid var(--border); width: 400px; max-width: 90%; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); padding: 20px; gap: 15px; }
        .prompt-title { margin: 0; font-size: 0.95rem; color: var(--accent); }
        .prompt-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 5px; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border: 1px solid var(--bg); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>

    <div id="topbar">
        <div class="topbar-brand">
            <h1>JJS STUDIO</h1>
            <span style="font-size:0.7rem; background:var(--border); padding:2px 6px; font-weight:bold; opacity:0.8; letter-spacing:0.5px;">V1.3.0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="account-menu-container">
                <button class="btn-jjs-action" style="padding: 6px 12px; height:auto; width:auto;" onclick="toggleAccountMenu(event)">
                    <i class="fa-solid fa-user"></i> <span id="account-btn-text">Account</span>
                </button>
                <div id="account-dropdown" class="account-dropdown">
                    </div>
            </div>

            <button class="btn-jjs-action" style="padding: 6px 12px; height:auto; width:auto;" onclick="openWorkshopWindow()"><i class="fa-solid fa-cloud"></i> Cloud Workshop</button>
            <button class="btn-jjs-action" style="padding: 6px 12px; height:auto; width:auto;" onclick="openSettingsWindow()"><i class="fa-solid fa-gear"></i> Settings</button>
        </div>
    </div>

    <div id="main-container">
        <div id="left-sidebar">
            <div class="sidebar-header">
                <h2>Move Sequences</h2>
                <button class="btn-jjs-action" style="padding:4px 8px; font-size:0.75rem; box-shadow: 2px 2px 0 var(--border);" onclick="createNewMove()"><i class="fa-solid fa-plus"></i> New Move</button>
            </div>
            <div id="branch-tags" class="branch-tag-container"></div>
            <div id="move-list" class="list-container"></div>
        </div>

        <div id="workspace">
            <div id="workspace-tabs">
                <div class="workspace-tab active" data-tab="Timeline" onclick="switchWorkspaceTab('Timeline')"><i class="fa-solid fa-timeline"></i> Timeline View</div>
                <div class="workspace-tab" data-tab="Canvas" onclick="switchWorkspaceTab('Canvas')"><i class="fa-solid fa-diagram-project"></i> Node Graph Canvas</div>
            </div>
            
            <div id="workspace-view-content">
                <div id="timeline-view" class="view-panel active">
                    </div>
                
                <div id="canvas-view" class="view-panel">
                    <div id="canvas-container"></div>
                </div>
            </div>
        </div>

        <div id="right-inspector">
            <div id="inspector-root" style="display:contents;"></div>
        </div>
    </div>

    <div id="workshop-window" class="window-overlay" onclick="closeWorkshopWindow(event)">
        <div class="jjs-window">
            <div class="window-header">
                <h2 class="window-title"><i class="fa-solid fa-cloud"></i> Cloud Move Workshop</h2>
                <button class="window-close" onclick="document.getElementById('workshop-window').style.display='none'"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="window-body">
                <div class="workshop-tabs">
                    <div class="workshop-tab active" data-tab="official" onclick="switchWorkshopCategory('official')">Official Presets</div>
                    <div class="workshop-tab" data-tab="community" onclick="switchWorkshopCategory('community')">Community Shared</div>
                </div>
                <div style="display:flex; justify-content:flex-end;">
                    <button class="btn-jjs-action" style="font-size:0.75rem; padding:6px 12px;" onclick="openPublishModal()"><i class="fa-solid fa-cloud-arrow-up"></i> Share Current Workspace</button>
                </div>
                <div id="workshop-content" style="min-height:200px;"></div>
            </div>
        </div>
    </div>

    <div id="publish-modal" class="window-overlay" onclick="closePublishModal(event)">
        <div class="jjs-window" style="width: 450px;">
            <div class="window-header">
                <h2 class="window-title"><i class="fa-solid fa-upload"></i> Publish to Cloud</h2>
                <button class="window-close" onclick="document.getElementById('publish-modal').style.display='none'"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="window-body">
                <div class="field-row">
                    <label>Sequence Title</label>
                    <input type="text" id="publish-title-input" class="field-input" placeholder="e.g., Ultimate Fireball Combo">
                </div>
                <div class="field-row">
                    <label>Sequence Category</label>
                    <input type="text" id="publish-category-input" class="field-input" placeholder="e.g., Combat, Movement, VFX">
                </div>
                <div class="field-row">
                    <label>Sequence Description</label>
                    <input type="text" id="publish-desc-input" class="field-input" placeholder="Brief details about controls or styling features...">
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:5px;">
                    <button class="btn-jjs-action" style="background:var(--node-card);" onclick="document.getElementById('publish-modal').style.display='none'">Cancel</button>
                    <button id="publish-submit-btn" class="btn-jjs-action" onclick="submitPublishTemplate()">Publish Sequence</button>
                </div>
            </div>
        </div>
    </div>

    <div id="jjs-io-modal" class="window-overlay" onclick="closeIOModal(event)">
        <div class="jjs-window">
            <div class="window-header">
                <h2 class="window-title" id="io-modal-title-text"><i class="fa-solid fa-file-import"></i> Porting Studio Context Data</h2>
                <button class="window-close" onclick="closeIOModal(null)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="window-body">
                <div class="field-row">
                    <label>Raw Content Streams</label>
                    <textarea id="io-terminal-textarea" class="terminal-textarea" placeholder="Paste data matrix profiles here..."></textarea>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button class="btn-jjs-action" style="background:var(--node-card);" onclick="closeIOModal(null)">Close Terminal</button>
                    <button id="io-action-button" class="btn-jjs-action" onclick="executeIOAction()">Execute</button>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-window" class="window-overlay" onclick="closeSettingsWindow(event)">
        <div class="jjs-window" style="width: 500px;">
            <div class="window-header">
                <h2 class="window-title"><i class="fa-solid fa-gear"></i> Application Configuration Settings</h2>
                <button class="window-close" onclick="document.getElementById('settings-window').style.display='none'"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="window-body">
                <div class="inspector-group-title" style="font-size:0.8rem; margin-bottom:5px;">Data Pipeline Pipeline Routing</div>
                <div class="field-row">
                    <label style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="setting-compression-toggle" onchange="toggleSettingCompression()"> Enforce Compression Encoding Layers (Zstd Encoder Array Engine Matrix)
                    </label>
                </div>
                <div style="border-top: 1px solid var(--border); margin: 10px 0;"></div>
                <div class="inspector-group-title" style="font-size:0.8rem; margin-bottom:5px;">Interface Theme Profiling</div>
                <div class="field-row">
                    <label>Color Accent Matrix Profile</label>
                    <input type="color" id="setting-theme-color" class="field-input" style="height:40px; padding:2px; cursor:pointer;" onchange="applyCustomThemeColor(this.value)">
                </div>
                <div style="display:flex; justify-content:flex-end; margin-top:10px;">
                    <button class="btn-jjs-action" onclick="document.getElementById('settings-window').style.display='none'">Apply Configuration</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA DECOUPLING LAYERS & STRUCTS ---
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_REF.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        // Supabase Client Setup with Dynamic Clerk Token Hook Access Layer Injection
        const supabaseclient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            global: {
                fetch: async (url, options = {}) => {
                    const headers = new Headers(options?.headers);
                    if (window.Clerk?.session) {
                        try {
                            const token = await window.Clerk.session.getToken({ template: 'supabase' });
                            if (token) {
                                headers.set('Authorization', `Bearer ${token}`);
                            }
                        } catch (clerkErr) {
                            console.error("Token translation pipeline fault:", clerkErr);
                        }
                    }
                    return fetch(url, { ...options, headers });
                }
            }
        });

        let authUser = null; 

        // Core Clerk Multi-Session Embedded Initialization Runtime
        window.addEventListener('load', async () => {
            if (window.Clerk) {
                try {
                    await window.Clerk.load({ multiSessionSingleSignOut: true });
                    
                    window.Clerk.addListener(({ user }) => {
                        // Extract identity securely without parsing emails
                        authUser = user ? { uid: user.id, name: `User_${user.id.substring(0, 5)}` } : null;
                        renderAccountMenu();
                        if (document.getElementById('workshop-window').style.display === 'flex') {
                            loadWorkshopTemplates();
                        }
                    });
                } catch (err) {
                    console.error("Clerk instance initialization crash:", err);
                }
            }
        });

        function toggleAccountMenu(e) {
            if (e) e.stopPropagation();
            document.getElementById('account-dropdown').classList.toggle('show');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.account-menu-container')) {
                const dropdown = document.getElementById('account-dropdown');
                if (dropdown) dropdown.classList.remove('show');
            }
        });

        function renderAccountMenu() {
            const btnText = document.getElementById('account-btn-text');
            const dropdown = document.getElementById('account-dropdown');
            dropdown.innerHTML = '';

            if (!window.Clerk || !window.Clerk.user) {
                btnText.innerText = "Account";
                dropdown.innerHTML = `
                    <div class="account-item" onclick="window.Clerk.openSignIn()"><i class="fa-solid fa-right-to-bracket"></i> Sign In</div>
                    <div class="account-item" onclick="window.Clerk.openSignUp()"><i class="fa-solid fa-user-plus"></i> Register</div>
                `;
                return;
            }

            btnText.innerText = "Signed In";
            
            // Highlight Active Session Context without email
            dropdown.innerHTML += `
                <div class="account-item active-session">
                    <i class="fa-solid fa-circle-check" style="color:#00ff66;"></i> 
                    <strong>Active: User_${window.Clerk.user.id.substring(0, 5)}</strong>
                </div>
            `;

            // Enumerate Switchable Sub-Account Session Matrix profiles
            const alternateSessions = window.Clerk.client.sessions.filter(s => s.id !== window.Clerk.session.id);
            alternateSessions.forEach(session => {
                dropdown.innerHTML += `
                    <div class="account-item" onclick="window.Clerk.setActive({ session: '${session.id}' })">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i> Switch to User_${session.user.id.substring(0, 5)}
                    </div>
                `;
            });

            // Enforce account count capping limit (Max 5 profiles)
            if (window.Clerk.client.sessions.length < 5) {
                dropdown.innerHTML += `
                    <div class="account-item" onclick="window.Clerk.openSignIn()"><i class="fa-solid fa-user-plus"></i> Add Account</div>
                `;
            }

            // Termination Action
            dropdown.innerHTML += `
                <div class="account-item" onclick="window.Clerk.signOut()" style="color:#ff4d4d; border-top:1px solid var(--border);">
                    <i class="fa-solid fa-right-from-bracket"></i> Sign Out All Accounts
                </div>
            `;
        }

        const CORE_NODES = {
            "CFrame": { fields: { X: "number", Y: "number", Z: "number", R_X: "number", R_Y: "number", R_Z: "number" }, defaults: { X:0, Y:0, Z:0, R_X:0, R_Y:0, R_Z:0 }, color: "#ff4d4d" },
            "VFX": { fields: { AssetId: "string", ScaleX: "number", ScaleY: "number", ScaleZ: "number", Transparency: "number" }, defaults: { AssetId:"", ScaleX:1, ScaleY:1, ScaleZ:1, Transparency:0 }, color: "#4da6ff" },
            "Sound": { fields: { SoundId: "string", Volume: "number", Pitch: "number" }, defaults: { SoundId:"", Volume:1, Pitch:1 }, color: "#2ecc71" },
            "Hitbox": { fields: { SizeX: "number", SizeY: "number", SizeZ: "number", OffsetX: "number", OffsetY: "number", OffsetZ: "number", Damage: "number" }, defaults: { SizeX:2, SizeY:2, SizeZ:2, OffsetX:0, OffsetY:0, OffsetZ:0, Damage:10 }, color: "#e67e22" },
            "Camera": { fields: { FieldOfView: "number", ShakeIntensity: "number", ShakeDuration: "number" }, defaults: { FieldOfView:70, ShakeIntensity:0, ShakeDuration:0 }, color: "#9b59b6" },
            "CustomNode": { fields: { NodeTitle: "string", Key: "string", Value: "string" }, defaults: { NodeTitle:"Custom Action", Key:"Attribute", Value:"" }, color: "#f1c40f" }
        };

        let currentMoves = [];
        let activeIndex = -1;
        let activeBranch = 'Default';
        let activeTab = 'Timeline';
        let selectedNodes = [];
        let ioModalMode = 'import'; 
        let configCompression = false;

        // --- CORE APPLICATION ROUTINES & STORAGE HANDLERS ---
        window.addEventListener('DOMContentLoaded', () => {
            const rawData = localStorage.getItem('jjs_studio_moves');
            if (rawData) {
                try {
                    currentMoves = JSON.parse(rawData);
                    if (currentMoves.length > 0) activeIndex = 0;
                } catch(e) { currentMoves = []; }
            }
            const savedColor = localStorage.getItem('jjs_theme_color');
            if (savedColor) {
                applyCustomThemeColor(savedColor);
                const picker = document.getElementById('setting-theme-color');
                if (picker) picker.value = savedColor;
            }
            const compState = localStorage.getItem('jjs_compression_enabled');
            if (compState !== null) {
                configCompression = (compState === 'true');
                const tgl = document.getElementById('setting-compression-toggle');
                if (tgl) tgl.checked = configCompression;
            }
            renderSidebar();
            loadMove(activeIndex);
        });

        function saveLocalContextState() {
            localStorage.setItem('jjs_studio_moves', JSON.stringify(currentMoves));
        }

        function renderSidebar() {
            const list = document.getElementById('move-list');
            list.innerHTML = '';
            
            const branches = new Set(['Default']);
            currentMoves.forEach(m => { if(m.branch) branches.add(m.branch); });
            
            const tagContainer = document.getElementById('branch-tags');
            tagContainer.innerHTML = '';
            branches.forEach(b => {
                const tag = document.createElement('div');
                tag.className = `branch-tag ${activeBranch === b ? 'active' : ''}`;
                tag.onclick = () => { activeBranch = b; renderSidebar(); };
                tag.innerHTML = `<i class="fa-solid fa-code-branch"></i> ${escapeHTML(b)}`;
                
                if (b !== 'Default') {
                    const del = document.createElement('i');
                    del.className = 'fa-solid fa-xmark branch-tag-del';
                    del.onclick = (e) => {
                        e.stopPropagation();
                        customConfirm(`Purge branch reference profile [${b}]? Nodes will fall back down to Default allocation arrays.`, () => {
                            currentMoves.forEach(m => { if(m.branch === b) m.branch = 'Default'; });
                            if (activeBranch === b) activeBranch = 'Default';
                            saveLocalContextState(); renderSidebar(); loadMove(activeIndex);
                        });
                    };
                    tag.appendChild(del);
                }
                tagContainer.appendChild(tag);
            });

            const filtered = currentMoves.map((m, i) => ({ move: m, originalIndex: i })).filter(item => item.move.branch === activeBranch || (!item.move.branch && activeBranch === 'Default'));

            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:30px; opacity:0.4; font-size:0.8rem;">Empty Branch Vector</div>';
                return;
            }

            filtered.forEach(item => {
                const m = item.move;
                const idx = item.originalIndex;
                const card = document.createElement('div');
                card.className = `move-card ${activeIndex === idx ? 'active' : ''}`;
                card.onclick = () => loadMove(idx);
                
                let nCount = 0;
                if (m.frames) { Object.keys(m.frames).forEach(f => { nCount += m.frames[f].length; }); }

                card.innerHTML = `
                    <div class="move-card-title">${escapeHTML(m.name || 'Unnamed Chain')}</div>
                    <div class="move-card-branch"><i class="fa-solid fa-clock"></i> ${m.length || 0}s | <i class="fa-solid fa-nodes-diagonal"></i> ${nCount} Nodes</div>
                    <div class="move-card-actions">
                        <button class="move-action-btn" onclick="cloneMoveSequence(${idx}, event)" title="Clone Matrix Sequence"><i class="fa-solid fa-clone"></i></button>
                        <button class="move-action-btn del-btn" onclick="deleteMoveSequence(${idx}, event)" title="Purge Sequence Profile"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function createNewMove() {
            const name = prompt("Declare identifier registry allocation tag name:");
            if (name === null) return;
            const cleanName = name.trim() || `Sequence_${Date.now().toString().slice(-4)}`;
            const branchInput = prompt("Target runtime branch target identifier mapping allocation matrix:", activeBranch);
            const cleanBranch = branchInput ? branchInput.trim() : 'Default';
            
            const newMove = { name: cleanName, length: 4, branch: cleanBranch, frames: { "0.0": [], "1.0": [], "2.0": [] } };
            currentMoves.push(newMove);
            activeIndex = currentMoves.length - 1;
            activeBranch = cleanBranch;
            saveLocalContextState(); renderSidebar(); loadMove(activeIndex);
        }

        function cloneMoveSequence(idx, e) {
            e.stopPropagation();
            const source = currentMoves[idx];
            if (!source) return;
            const clone = JSON.parse(JSON.stringify(source));
            clone.name = `${clone.name} (Copy)`;
            currentMoves.push(clone);
            activeIndex = currentMoves.length - 1;
            saveLocalContextState(); renderSidebar(); loadMove(activeIndex);
        }

        function deleteMoveSequence(idx, e) {
            e.stopPropagation();
            customConfirm("Purge sequence execution profile template map entirely?", () => {
                currentMoves.splice(idx, 1);
                if (activeIndex >= currentMoves.length) activeIndex = currentMoves.length - 1;
                saveLocalContextState(); renderSidebar(); loadMove(activeIndex);
            });
        }

        function loadMove(idx) {
            selectedNodes = [];
            if (idx < 0 || idx >= currentMoves.length) {
                activeIndex = -1;
                renderTimeline(); renderCanvas(); renderInspector(); return;
            }
            activeIndex = idx;
            const move = currentMoves[activeIndex];
            if (!move.frames) move.frames = {};
            
            renderSidebar(); renderTimeline(); renderCanvas(); renderInspector();
        }

        // --- INTERFACE CANVAS WORKSPACE VIEWPORT LAYER TABS ---
        function switchWorkspaceTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.workspace-tab').forEach(t => {
                t.classList.toggle('active', t.getAttribute('data-tab') === tab);
            });
            document.querySelectorAll('.view-panel').forEach(p => {
                p.classList.toggle('active', p.id === `${tab.toLowerCase()}-view`);
            });
            if (tab === 'Canvas') renderCanvas();
            else renderTimeline();
        }

        // --- VIEWPORT ENGINE TYPE A: TIMELINE VIEW MANAGER ---
        function renderTimeline() {
            const container = document.getElementById('timeline-view');
            container.innerHTML = '';
            if (activeIndex < 0) {
                container.innerHTML = '<div class="inspector-placeholder"><i class="fa-solid fa-folder-open"></i> Select context array registry parameters from profile stack.</div>';
                return;
            }
            const move = currentMoves[activeIndex];
            
            const ctrlBar = document.createElement('div');
            ctrlBar.style = 'display:flex; justify-content:space-between; align-items:center; background:var(--panel); padding:10px 15px; border:var(--thickness) solid var(--border);';
            ctrlBar.innerHTML = `
                <div style="font-weight:bold; color:#fff; font-size:0.85rem;"><i class="fa-solid fa-sliders"></i> Context Vector Parameters configuration profiles</div>
                <div style="display:flex; gap:12px; align-items:center;">
                    <div style="display:flex; align-items:center; gap:6px; font-size:0.75rem;">
                        <span style="opacity:0.6;">Duration Config:</span>
                        <input type="number" step="0.5" min="0.5" value="${move.length || 4}" style="width:60px; background:var(--bg); border:1px solid var(--border); color:#fff; padding:2px 6px;" onchange="updateMoveLength(this.value)">
                    </div>
                    <div style="display:flex; align-items:center; gap:6px; font-size:0.75rem;">
                        <span style="opacity:0.6;">Vector Pool Allocation Channel Branch:</span>
                        <input type="text" value="${escapeHTML(move.branch || 'Default')}" style="width:100px; background:var(--bg); border:1px solid var(--border); color:#fff; padding:2px 6px;" onchange="updateMoveBranch(this.value)">
                    </div>
                    <button class="btn-jjs-action" style="padding:4px 8px; font-size:0.7rem; box-shadow:1px 1px 0 var(--border);" onclick="openPublishModal()"><i class="fa-solid fa-cloud-arrow-up"></i> Push to Cloud</button>
                    <button class="btn-jjs-action" style="padding:4px 8px; font-size:0.7rem; box-shadow:1px 1px 0 var(--border);" onclick="openIOModal('export')"><i class="fa-solid fa-file-export"></i> Local Export</button>
                    <button class="btn-jjs-action" style="padding:4px 8px; font-size:0.7rem; box-shadow:1px 1px 0 var(--border);" onclick="openIOModal('import')"><i class="fa-solid fa-file-import"></i> Local Import</button>
                </div>
            `;
            container.appendChild(ctrlBar);

            const timelineCard = document.createElement('div');
            timelineCard.className = 'timeline-section';
            
            const head = document.createElement('div');
            head.className = 'timeline-section-header';
            head.innerHTML = `<h3>Tracking Context Matrix Configuration Array Layout Profile Layers</h3>
                              <button class="btn-jjs-action" style="padding:4px 8px; font-size:0.7rem; box-shadow:2px 2px 0 var(--border);" onclick="addNewKeyframeNode()"><i class="fa-solid fa-plus"></i> Allocate Keyframe Node Stream</button>`;
            timelineCard.appendChild(head);
            
            const rowHolder = document.createElement('div');
            rowHolder.className = 'timeline-row-container';
            
            const sortedFrames = Object.keys(move.frames).sort((a,b) => parseFloat(a) - parseFloat(b));
            if (sortedFrames.length === 0) {
                rowHolder.innerHTML = '<div style="text-align:center; padding:4px 20px; opacity:0.4; font-size:0.75rem;">No Allocated Timeline Matrix Frame Layers Registered</div>';
            } else {
                sortedFrames.forEach(f => {
                    const row = document.createElement('div');
                    row.className = 'timeline-row';
                    
                    const label = document.createElement('div');
                    label.className = 'timeline-label';
                    label.innerHTML = `<i class="fa-solid fa-stopwatch" style="color:var(--accent);"></i> Frame ${f}s`;
                    label.style.cursor = 'pointer';
                    label.onclick = () => renameKeyframeTimelineTimestamp(f);

                    const track = document.createElement('div');
                    track.className = 'timeline-track';
                    
                    const nodes = move.frames[f] || [];
                    nodes.forEach(node => {
                        const nEl = document.createElement('div');
                        const isSelected = selectedNodes.some(s => s.frame === f && s.id === node.id);
                        nEl.className = `timeline-node ${isSelected ? 'selected' : ''}`;
                        
                        const typeCfg = CORE_NODES[node.type] || { color: '#7f8c8d' };
                        nEl.style.borderLeft = `4px solid ${typeCfg.color}`;
                        
                        let displayLabel = node.type;
                        if (node.type === 'CustomNode' && node.properties?.NodeTitle) displayLabel = node.properties.NodeTitle;
                        else if (node.type === 'VFX' && node.properties?.AssetId) displayLabel = `VFX: ${node.properties.AssetId.slice(-5)}`;
                        
                        nEl.innerHTML = `<strong>${escapeHTML(displayLabel)}</strong><span style="opacity:0.4; font-size:0.6rem;">ID:${node.id.slice(-3)}</span>`;
                        nEl.onclick = (e) => { e.stopPropagation(); selectNodeContextPointer(f, node.id, e.ctrlKey); };
                        track.appendChild(nEl);
                    });
                    
                    row.appendChild(label);
                    row.appendChild(track);
                    rowHolder.appendChild(row);
                });
            }
            timelineCard.appendChild(rowHolder);
            container.appendChild(timelineCard);
        }

        function updateMoveLength(v) {
            const val = parseFloat(v); if (isNaN(val) || val <= 0) return;
            currentMoves[activeIndex].length = val; saveLocalContextState(); renderSidebar();
        }
        function updateMoveBranch(v) {
            const val = v.trim() || 'Default';
            currentMoves[activeIndex].branch = val; activeBranch = val; saveLocalContextState(); renderSidebar();
        }

        function renameKeyframeTimelineTimestamp(oldF) {
            const n = prompt(`Reallocate Keyframe configuration registration index profile parameters tracking timestamp coordinate mapping index positions (Current: ${oldF}s):`, oldF);
            if (n === null) return;
            const newF = parseFloat(n).toFixed(1);
            if (isNaN(parseFloat(n)) || parseFloat(n) < 0) { customAlert("Invalid matrix allocation parameter coordinate value profile format configuration alignment errors detected."); return; }
            if (oldF === newF) return;
            
            const move = currentMoves[activeIndex];
            if (move.frames[newF]) {
                customConfirm(`Timestamp profile matrix target alignment layer configurations [${newF}s] already allocation mapped. Merge arrays?`, () => {
                    move.frames[newF] = move.frames[newF].concat(move.frames[oldF]);
                    delete move.frames[oldF]; saveLocalContextState(); renderTimeline();
                });
            } else {
                move.frames[newF] = move.frames[oldF];
                delete move.frames[oldF]; saveLocalContextState(); renderTimeline();
            }
        }

        function addNewKeyframeNode() {
            const fInput = prompt("Declare context coordinate data mapping tracking frame snapshot allocation placement timestamps:", "0.0");
            if (fInput === null) return;
            const f = parseFloat(fInput).toFixed(1);
            if (isNaN(parseFloat(fInput)) || parseFloat(fInput) < 0) { customAlert("Allocation mapping fault parameters parsing mismatch profiles alignment failure layers."); return; }
            
            const move = currentMoves[activeIndex];
            if (!move.frames[f]) move.frames[f] = [];
            
            const typeStr = prompt(`Select execution element matrix primitive tracking layout types profiles:\n(${Object.keys(CORE_NODES).join(', ')})`, "CFrame");
            if (!typeStr) return;
            let matchedType = Object.keys(CORE_NODES).find(k => k.toLowerCase() === typeStr.trim().toLowerCase());
            if (!matchedType) { customAlert("Declared layout array profile primitive element definition mismatch configurations."); return; }
            
            const cfg = CORE_NODES[matchedType];
            const newNode = {
                id: 'node-' + Math.random().toString(36).substr(2, 9),
                type: matchedType,
                properties: JSON.parse(JSON.stringify(cfg.defaults)),
                canvasPosition: { x: 100 + Math.random() * 150, y: 100 + Math.random() * 150 }
            };
            
            move.frames[f].push(newNode);
            saveLocalContextState(); renderTimeline();
            selectNodeContextPointer(f, newNode.id, false);
        }

        // --- VIEWPORT ENGINE TYPE B: NODE GRAPH CANVAS VISUAL ENGINE LAYER ---
        function renderCanvas() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';
            if (activeIndex < 0) return;
            const move = currentMoves[activeIndex];
            
            Object.keys(move.frames).forEach(f => {
                const nodes = move.frames[f] || [];
                nodes.forEach(node => {
                    const card = document.createElement('div');
                    const isSelected = selectedNodes.some(s => s.frame === f && s.id === node.id);
                    card.className = `canvas-node-card ${isSelected ? 'selected' : ''}`;
                    
                    if (!node.canvasPosition) node.canvasPosition = { x: 50 + Math.random() * 300, y: 50 + Math.random() * 300 };
                    card.style.left = `${node.canvasPosition.x}px`;
                    card.style.top = `${node.canvasPosition.y}px`;
                    
                    const typeCfg = CORE_NODES[node.type] || { color: '#7f8c8d' };
                    card.style.borderTop = `${varThickness = '4px'} solid ${typeCfg.color}`;
                    
                    let titleText = node.type;
                    if (node.type === 'CustomNode' && node.properties?.NodeTitle) titleText = node.properties.NodeTitle;

                    card.innerHTML = `
                        <div class="node-head">
                            <strong>${escapeHTML(titleText)}</strong>
                            <span style="opacity:0.5; font-size:0.6rem;">${f}s</span>
                        </div>
                    `;
                    
                    const body = document.createElement('div');
                    body.className = 'node-body';
                    
                    // Display compact subset variables inside graph node panels
                    const props = node.properties || {};
                    const keys = Object.keys(props).slice(0, 3);
                    keys.forEach(k => {
                        const row = document.createElement('div');
                        row.className = 'node-body-row';
                        let vStr = String(props[k]);
                        if (vStr.length > 12) vStr = vStr.slice(0,10) + '..';
                        row.innerHTML = `<span>${k}:</span><span>${escapeHTML(vStr)}</span>`;
                        body.appendChild(row);
                    });
                    if (Object.keys(props).length > 3) {
                        body.innerHTML += `<div style="text-align:center; opacity:0.3; font-size:0.6rem; padding-top:2px;">+ ${Object.keys(props).length - 3} Parameters</div>`;
                    }
                    
                    card.appendChild(body);
                    
                    // Bind canvas object vector transforms and movement pointer tracks
                    card.addEventListener('mousedown', (e) => {
                        if (e.target.closest('.node-head') || e.target.closest('.node-body')) {
                            e.stopPropagation();
                            selectNodeContextPointer(f, node.id, e.ctrlKey);
                            
                            const startX = e.clientX; const startY = e.clientY;
                            const origX = node.canvasPosition.x; const origY = node.canvasPosition.y;
                            
                            function doDrag(moveEvent) {
                                node.canvasPosition.x = origX + (moveEvent.clientX - startX);
                                node.canvasPosition.y = origY + (moveEvent.clientY - startY);
                                card.style.left = `${node.canvasPosition.x}px`;
                                card.style.top = `${node.canvasPosition.y}px`;
                            }
                            function stopDrag() {
                                window.removeEventListener('mousemove', doDrag);
                                window.removeEventListener('mouseup', stopDrag);
                                saveLocalContextState();
                            }
                            window.addEventListener('mousemove', doDrag);
                            window.addEventListener('mouseup', stopDrag);
                        }
                    });
                    
                    container.appendChild(card);
                });
            });
        }

        // --- CONTEXT REGISTRY MANAGEMENT PARAMETER SPECIFICATION ENGINE LOOPS ---
        function selectNodeContextPointer(frame, id, appendMode) {
            if (!appendMode) { selectedNodes = [{ frame, id }]; }
            else {
                const idx = selectedNodes.findIndex(s => s.frame === frame && s.id === id);
                if (idx >= 0) selectedNodes.splice(idx, 1);
                else selectedNodes.push({ frame, id });
            }
            if (activeTab === 'Timeline') renderTimeline();
            else renderCanvas();
            renderInspector();
        }

        function renderInspector() {
            const root = document.getElementById('inspector-root');
            root.innerHTML = '';
            
            if (selectedNodes.length === 0) {
                root.innerHTML = `
                    <div class="inspector-placeholder">
                        <i class="fa-solid fa-circle-info"></i>
                        <div class="uppercase-force" style="font-weight:bold; font-size:0.8rem; letter-spacing:0.5px;">Inspector Properties</div>
                        <span style="font-size:0.75rem; max-width:200px; line-height:1.4;">Select layout node frames inside viewport tracking channels to alter properties configuration.</span>
                    </div>`;
                return;
            }

            if (selectedNodes.length > 1) {
                root.innerHTML = `
                    <div class="inspector-placeholder">
                        <i class="fa-solid fa-layer-group"></i>
                        <div class="uppercase-force" style="font-weight:bold; font-size:0.8rem; letter-spacing:0.5px;">Bulk Operations</div>
                        <span style="font-size:0.75rem; max-width:200px; line-height:1.4; margin-bottom:10px;">[${selectedNodes.length}] Vector Nodes targeted. Bulk attributes updates disabled.</span>
                        <button class="btn-jjs-action" style="font-size:0.7rem; padding:6px 12px; color:#ff4d4d;" onclick="purgeSelectedNodesMatrix()"><i class="fa-solid fa-trash"></i> Delete Selected Array [${selectedNodes.length}]</button>
                    </div>`;
                return;
            }

            const activeTarget = selectedNodes[0];
            const move = currentMoves[activeIndex];
            if (!move || !move.frames[activeTarget.frame]) return;
            const node = move.frames[activeTarget.frame].find(n => n.id === activeTarget.id);
            if (!node) return;

            const panel = document.createElement('div');
            panel.className = 'inspector-content';

            // Segment Alpha Header Details Profile
            const hGroup = document.createElement('div');
            hGroup.className = 'inspector-group';
            hGroup.style.background = 'rgba(0,0,0,0.1)';
            hGroup.innerHTML = `
                <div class="inspector-group-title">Target Node Definition Layer Mapping</div>
                <div style="font-weight:bold; font-size:1.05rem; color:#fff;">${node.type}</div>
                <div style="font-size:0.7rem; opacity:0.5; display:flex; flex-direction:column; gap:2px; margin-top:4px;">
                    <span>Object Reference UUID: ${node.id}</span>
                    <span>Tracking Core Timeline Offset: Frame ${activeTarget.frame}s</span>
                </div>
                <div style="display:flex; gap:10px; margin-top:5px;">
                    <button class="btn-jjs-action" style="padding:4px 8px; font-size:0.7rem; flex:1; box-shadow:1px 1px 0 var(--border); color:#ff4d4d;" onclick="purgeSelectedNodesMatrix()"><i class="fa-solid fa-trash"></i> Purge Object</button>
                    <button class="btn-jjs-action" style="padding:4px 8px; font-size:0.7rem; flex:1; box-shadow:1px 1px 0 var(--border);" onclick="shiftNodeFrameTimestamp()"><i class="fa-solid fa-clock"></i> Shift Frame</button>
                </div>
            `;
            panel.appendChild(hGroup);

            // Segment Beta Fields Variable Transformation Matrix Setup
            const fGroup = document.createElement('div');
            fGroup.className = 'inspector-group';
            fGroup.innerHTML = '<div class="inspector-group-title">Attribute Profiles Parameter Vectors</div>';
            
            const schema = CORE_NODES[node.type] || { fields: {} };
            const props = node.properties || {};

            Object.keys(schema.fields).forEach(key => {
                const type = schema.fields[key];
                const row = document.createElement('div');
                row.className = 'field-row';
                row.style.marginBottom = '8px';
                
                row.innerHTML = `<label>${key} (${type})</label>`;
                
                const val = props[key] !== undefined ? props[key] : '';
                const input = document.createElement('input');
                input.className = 'field-input';
                
                if (type === 'number') {
                    input.type = 'number'; input.step = 'any'; input.value = val;
                    input.onchange = () => { node.properties[key] = parseFloat(input.value) || 0; saveLocalContextState(); updateLiveViewports(); };
                } else if (type === 'bool' || typeof schema.defaults[key] === 'boolean') {
                    input.type = 'checkbox'; input.checked = !!val;
                    input.onchange = () => { node.properties[key] = input.checked; saveLocalContextState(); updateLiveViewports(); };
                } else {
                    input.type = 'text'; input.value = val;
                    input.onchange = () => { node.properties[key] = input.value; saveLocalContextState(); updateLiveViewports(); };
                }
                
                row.appendChild(input);
                fGroup.appendChild(row);
            });
            panel.appendChild(fGroup);
            root.appendChild(panel);
        }

        function updateLiveViewports() {
            if (activeTab === 'Timeline') renderTimeline();
            else renderCanvas();
        }

        function shiftNodeFrameTimestamp() {
            if (selectedNodes.length !== 1) return;
            const target = selectedNodes[0];
            const move = currentMoves[activeIndex];
            const nodeIdx = move.frames[target.frame].findIndex(n => n.id === target.id);
            if (nodeIdx < 0) return;
            
            const dest = prompt("Declare parameters alignment destination coordinate timestamp values mapping profiles:", target.frame);
            if (dest === null) return;
            const newF = parseFloat(dest).toFixed(1);
            if (isNaN(parseFloat(dest)) || parseFloat(dest) < 0) { customAlert("Invalid floating precision configuration placement coordinates index targets alignment errors."); return; }
            if (target.frame === newF) return;

            const nodeObj = move.frames[target.frame].splice(nodeIdx, 1)[0];
            if (move.frames[target.frame].length === 0) delete move.frames[target.frame];
            
            if (!move.frames[newF]) move.frames[newF] = [];
            move.frames[newF].push(nodeObj);
            
            selectedNodes = [{ frame: newF, id: nodeObj.id }];
            saveLocalContextState(); updateLiveViewports(); renderInspector();
        }

        function purgeSelectedNodesMatrix() {
            if (selectedNodes.length === 0) return;
            customConfirm(`Purge selected parameters processing graph execution object stack [Size: ${selectedNodes.length}]?`, () => {
                const move = currentMoves[activeIndex];
                selectedNodes.forEach(target => {
                    if (move.frames[target.frame]) {
                        move.frames[target.frame] = move.frames[target.frame].filter(n => n.id !== target.id);
                        if (move.frames[target.frame].length === 0) delete move.frames[target.frame];
                    }
                });
                selectedNodes = [];
                saveLocalContextState(); updateLiveViewports(); renderInspector();
            });
        }

        // --- CONTEXT SYSTEM IO PORT ENGINE LAYER TERMINAL SYSTEMS ---
        function generateCleanExportData() {
            const current = currentMoves[activeIndex];
            if (!current) return [];
            
            const outArr = [];
            const sorted = Object.keys(current.frames).sort((a,b) => parseFloat(a) - parseFloat(b));
            
            sorted.forEach(f => {
                const nodes = current.frames[f] || [];
                nodes.forEach(n => {
                    const nodeDump = { Time: parseFloat(f), Type: n.type, Properties: {} };
                    
                    if (n.type === 'CustomNode') {
                        const k = n.properties?.Key || "Param";
                        nodeDump.Properties[k] = n.properties?.Value || "";
                    } else {
                        nodeDump.Properties = JSON.parse(JSON.stringify(n.properties || {}));
                    }
                    outArr.push(nodeDump);
                });
            });
            return outArr;
        }

        function openIOModal(mode) {
            ioModalMode = mode;
            const overlay = document.getElementById('jjs-io-modal');
            const title = document.getElementById('io-modal-title-text');
            const tx = document.getElementById('io-terminal-textarea');
            const btn = document.getElementById('io-action-button');
            
            tx.value = ''; overlay.style.display = 'flex';
            
            if (mode === 'import') {
                title.innerHTML = "<i class='fa-solid fa-file-import'></i> Import Data Matrix Profiles Stream";
                tx.readOnly = false; btn.innerText = "Execute Load Matrix Pipeline";
            } else {
                title.innerHTML = "<i class='fa-solid fa-file-export'></i> Export Structured Data Matrix Output Stream";
                tx.readOnly = true; btn.innerText = "Copy Stream Output Logs";
                
                if (currentMoves.length === 0 || activeIndex < 0) { tx.value = "[]"; return; }
                try {
                    const exportBlob = generateCleanExportData();
                    if (!configCompression || typeof zstd === 'undefined') {
                        tx.value = JSON.stringify(exportBlob, null, 2);
                    } else {
                        const bin = window.zstd.compress(new TextEncoder().encode(JSON.stringify(exportBlob)), 3);
                        let b64 = ""; for (let i = 0; i < bin.length; i++) b64 += String.fromCharCode(bin[i]);
                        tx.value = btoa(b64);
                    }
                } catch (err) { tx.value = "/* Pipeline export encoding compression fault layers exception block triggered */\n[]"; }
            }
        }

        function closeIOModal(e) {
            if (!e || e.target === document.getElementById('jjs-io-modal')) document.getElementById('jjs-io-modal').style.display = 'none';
        }

        function executeIOAction() {
            const tx = document.getElementById('io-terminal-textarea');
            if (ioModalMode === 'export') {
                tx.select(); navigator.clipboard.writeText(tx.value); customAlert("Copied clipboard data allocation streams."); return;
            }
            
            // Handle parsing import data
            const raw = tx.value.trim(); if (!raw) return;
            try {
                let parsed = null;
                if (raw.startsWith('[') || raw.startsWith('{')) { parsed = JSON.parse(raw); }
                else if (typeof zstd !== 'undefined') {
                    const bString = atob(raw); const bArr = new Uint8Array(bString.length);
                    for (let i = 0; i < bString.length; i++) bArr[i] = bString.charCodeAt(i);
                    parsed = JSON.parse(new TextDecoder().decode(window.zstd.decompress(bArr)));
                }
                
                if (!Array.isArray(parsed)) throw new Error("Root configuration entity parsing array layer signature validation mismatches.");
                
                const moveName = prompt("Declare imported identifier sequence lookup pointer name string definition profile maps:", `Imported_${Date.now().toString().slice(-4)}`);
                const targetBranch = prompt("Declare destination branch allocation vector matrix container tracking scope:", activeBranch);
                
                const newMove = { name: moveName || "Imported Sequence Array", length: 4, branch: targetBranch || 'Default', frames: {} };
                
                parsed.forEach(item => {
                    const timeKey = parseFloat(item.Time || 0).toFixed(1);
                    if (!newMove.frames[timeKey]) newMove.frames[timeKey] = [];
                    
                    let normType = item.Type || "CFrame";
                    let matchedType = Object.keys(CORE_NODES).find(k => k.toLowerCase() === normType.toLowerCase()) || "CustomNode";
                    const schema = CORE_NODES[matchedType];
                    
                    let props = {};
                    if (matchedType === 'CustomNode') {
                        const firstKey = Object.keys(item.Properties || {})[0] || "Attribute";
                        props = { NodeTitle: item.Type || "Custom Action", Key: firstKey, Value: String(item.Properties?.[firstKey] || "") };
                    } else {
                        props = JSON.parse(JSON.stringify(schema.defaults));
                        if (item.Properties) { Object.keys(item.Properties).forEach(pk => { if(props[pk] !== undefined) props[pk] = item.Properties[pk]; }); }
                    }

                    newMove.frames[timeKey].push({
                        id: 'node-' + Math.random().toString(36).substr(2, 9),
                        type: matchedType,
                        properties: props,
                        canvasPosition: { x: 80 + Math.random() * 350, y: 80 + Math.random() * 350 }
                    });
                });
                
                // Track max length metrics
                const keys = Object.keys(newMove.frames).map(parseFloat);
                if (keys.length > 0) { newMove.length = Math.max(...keys) + 1.0; }
                
                currentMoves.push(newMove);
                activeIndex = currentMoves.length - 1;
                activeBranch = newMove.branch;
                saveLocalContextState(); closeIOModal(null); renderSidebar(); loadMove(activeIndex);
                customAlert("Data pipeline load execution mapping profile stream array loading succeeded.");
            } catch(err) { console.error(err); customAlert("Pipeline tracking load parse validation error mapping context data matrices: " + err.message); }
        }

        // --- CLOUD WORKSHOP REPOSITORY CRUD SYNC CONTROLLER ---
        let workshopTabState = 'official'; 

        function openWorkshopWindow() {
            document.getElementById('workshop-window').style.display = 'flex';
            switchWorkshopCategory('official');
        }

        function closeWorkshopWindow(e) {
            if (e.target === document.getElementById('workshop-window')) document.getElementById('workshop-window').style.display = 'none';
        }

        function switchWorkshopCategory(cat) {
            workshopTabState = cat;
            document.querySelectorAll('.workshop-tab').forEach(t => {
                t.classList.toggle('active', t.getAttribute('data-tab') === cat);
            });
            loadWorkshopTemplates();
        }

        async function loadWorkshopTemplates() {
            const content = document.getElementById('workshop-content');
            content.innerHTML = '<div style="text-align:center; padding:50px; font-size:1.1rem; opacity:0.6;"><i class="fa-solid fa-spinner fa-spin"></i> Reading cloud matrix vectors repository arrays...</div>';
            
            try {
                // Read operations: Allowed for unauthenticated & authenticated users alike
                const { data, error } = await supabaseclient
                    .from('workshop_templates')
                    .select('id, title, category, description, author, is_official, data, created_at, owner_id')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const templates = Array.isArray(data) ? data : [];
                const officialList = templates.filter(t => t.is_official === true || t.is_official === 'true');
                const communityList = templates.filter(t => !t.is_official || t.is_official === 'false');

                const activeList = workshopTabState === 'official' ? officialList : communityList;
                renderCloudGrid(activeList);
            } catch (err) {
                console.error("Cloud backend pipeline reading failure code execution route block:", err);
                content.innerHTML = `<div style="text-align:center; padding:50px; color:#ff4d4d;"><i class="fa-solid fa-triangle-exclamation"></i> Sync read fault parameters database pipeline tracking connection failure: ${escapeHTML(err.message || err)}</div>`;
            }
        }

        function renderCloudGrid(list) {
            const content = document.getElementById('workshop-content');
            content.innerHTML = '';

            if (list.length === 0) {
                content.innerHTML = '<div style="text-align:center; padding:60px; opacity:0.4;"><i class="fa-solid fa-folder-open" style="font-size:2rem; margin-bottom:10px;"></i><br>Empty Cloud Registry Workspace Layer</div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'workshop-grid';

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'workshop-card';
                card.onclick = () => importTemplateToWorkspace(item.id);

                let totalNodesCount = 0;
                try {
                    const payload = typeof item.data === 'string' ? JSON.parse(item.data) : item.data;
                    if (Array.isArray(payload)) totalNodesCount = payload.length;
                } catch (e) {}

                // Delete Capabilities: Client filter (backend RLS applies absolute verification gates)
                let deleteButtonHTML = '';
                if (!item.is_official && authUser && item.owner_id === authUser.uid) {
                    deleteButtonHTML = `<button class="workshop-delete-btn" onclick="deleteTemplate('${item.id}', event)" title="Purge Cloud Profile"><i class="fa-solid fa-trash"></i></button>`;
                }

                card.innerHTML = `
                    <div class="workshop-card-title">${escapeHTML(item.title || 'Untitled Cloud Data Array')}</div>
                    <div style="font-size:0.65rem; color:var(--accent); margin-top:-4px; opacity:0.7;">Category: ${escapeHTML(item.category || 'General')}</div>
                    <div class="workshop-card-desc">${escapeHTML(item.description || 'No descriptive summary configuration variables trace profiling logs recorded.')}</div>
                    <div class="workshop-card-meta">
                        <span><i class="fa-solid fa-square-user"></i> ${escapeHTML(item.author || 'Anonymous')}</span>
                        <span><i class="fa-solid fa-cubes-stacked"></i> ${totalNodesCount} Elements</span>
                    </div>
                    ${deleteButtonHTML}
                `;
                grid.appendChild(card);
            });
            content.appendChild(grid);
        }

        function openPublishModal() {
            if (activeIndex < 0 || currentMoves.length === 0) { customAlert("Cannot allocate publish vectors execution from blank working maps."); return; }
            document.getElementById('publish-title-input').value = currentMoves[activeIndex].name || '';
            document.getElementById('publish-category-input').value = currentMoves[activeIndex].branch || 'Community';
            document.getElementById('publish-desc-input').value = '';
            document.getElementById('publish-modal').style.display = 'flex';
        }

        function closePublishModal(e) {
            if (!e || e.target === document.getElementById('publish-modal')) document.getElementById('publish-modal').style.display = 'none';
        }

        async function submitPublishTemplate() {
            if (!authUser) { customAlert("Authentication Token Requirement Fault. Access your dropdown menu tracking link accounts portfolio workspace layers to proceed."); return; }
            
            const title = document.getElementById('publish-title-input').value.trim();
            const category = document.getElementById('publish-category-input').value.trim() || 'Community';
            const desc = document.getElementById('publish-desc-input').value.trim();
            if (!title) { customAlert("Validation failed: Identification profile label name string values arrays cannot map empty."); return; }

            const submitBtn = document.getElementById('publish-submit-btn');
            const cachedTxt = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Transmitting stream payloads...';
            submitBtn.disabled = true;

            try {
                const matrixPayload = generateCleanExportData();
                
                // Construct Row mapping directly to your explicitly specified schema columns
                const insertRow = {
                    title: title,
                    category: category,
                    description: desc || null,
                    author: authUser.name,
                    is_official: false,
                    data: matrixPayload,
                    owner_id: authUser.uid // Automatically verified on backend by Supabase RLS policies via Clerk sub claims
                };

                const { error } = await supabaseclient.from('workshop_templates').insert(insertRow);
                if (error) throw error;

                closePublishModal();
                customAlert("Successfully pushed cloud matrix template array tracking records pipeline registry entries!");
                if (document.getElementById('workshop-window').style.display === 'flex') {
                    workshopTabState = 'community';
                    await loadWorkshopTemplates();
                }
            } catch (err) {
                console.error("Cloud insert trace write violation fault execution exceptions payload details:", err);
                customAlert("Supabase repository transaction upload fault validation failure exceptions: " + (err.message || err));
            } finally {
                submitBtn.innerHTML = cachedTxt;
                submitBtn.disabled = false;
            }
        }

        async function deleteTemplate(id, event) {
            if (event) event.stopPropagation();
            if (!authUser) { customAlert("Authentication scope evaluation failure. Operations denied profiles allocation layers access verification."); return; }

            customConfirm("Purge sequence data matrix compilation template array logs matching this ID tracking point permanently from cloud records?", async () => {
                try {
                    // Backend RLS policy ensures users can only delete matching owner_id tracking maps
                    const { error } = await supabaseclient
                        .from('workshop_templates')
                        .delete()
                        .eq('id', id)
                        .eq('owner_id', authUser.uid);

                    if (error) throw error;
                    customAlert("Cloud templates database sequence index dropped successfully.");
                    await loadWorkshopTemplates();
                } catch (err) {
                    console.error("Cloud repository delete pipeline routine crash exceptions parameters layout:", err);
                    customAlert("Database deletion request tracking route transaction failed execution logic pipelines: " + (err.message || err));
                }
            });
        }

        async function importTemplateToWorkspace(id) {
            try {
                const { data, error } = await supabaseclient
                    .from('workshop_templates')
                    .select('title, category, data')
                    .eq('id', id)
                    .single();

                if (error) throw error;
                if (!data) throw new Error("Target matrix allocation sequence entity record reference query profiling results unlocated mapping layers.");

                let parsedElements = [];
                if (data.data) {
                    parsedElements = typeof data.data === 'string' ? JSON.parse(data.data) : data.data;
                }
                if (!Array.isArray(parsedElements)) parsedElements = [];

                const reconstructedMove = {
                    name: `${data.title || 'Cloud Imported'}`,
                    branch: data.category || 'Default',
                    length: 4,
                    frames: {}
                };

                parsedElements.forEach(item => {
                    const tKey = parseFloat(item.Time || 0).toFixed(1);
                    if (!reconstructedMove.frames[tKey]) reconstructedMove.frames[tKey] = [];

                    let normType = item.Type || "CFrame";
                    let matchedType = Object.keys(CORE_NODES).find(k => k.toLowerCase() === normType.toLowerCase()) || "CustomNode";
                    const schema = CORE_NODES[matchedType];

                    let props = {};
                    if (matchedType === 'CustomNode') {
                        const firstKey = Object.keys(item.Properties || {})[0] || "Attribute";
                        props = { NodeTitle: item.Type || "Custom Action", Key: firstKey, Value: String(item.Properties?.[firstKey] || "") };
                    } else {
                        props = JSON.parse(JSON.stringify(schema.defaults));
                        if (item.Properties) { Object.keys(item.Properties).forEach(pk => { if (props[pk] !== undefined) props[pk] = item.Properties[pk]; }); }
                    }

                    reconstructedMove.frames[tKey].push({
                        id: 'node-' + Math.random().toString(36).substr(2, 9),
                        type: matchedType,
                        properties: props,
                        canvasPosition: { x: 100 + Math.random() * 300, y: 100 + Math.random() * 300 }
                    });
                });

                const tKeys = Object.keys(reconstructedMove.frames).map(parseFloat);
                if (tKeys.length > 0) reconstructedMove.length = Math.max(...tKeys) + 1.0;

                currentMoves.push(reconstructedMove);
                activeIndex = currentMoves.length - 1;
                activeBranch = reconstructedMove.branch;

                saveLocalContextState();
                document.getElementById('workshop-window').style.display = 'none';
                renderSidebar();
                loadMove(activeIndex);
                customAlert(`Sequence [${reconstructedMove.name}] unpacked down to working workspace cache tracks layout models.`);
            } catch (err) {
                console.error("Cloud data download import routine failure tracing matrix details logs:", err);
                customAlert("Failed translation compiling operations trace sequences mapping layers arrays components: " + (err.message || err));
            }
        }

        // --- PREFERENCES APP CONFIG WINDOW MODALS LOGIC LAYERS ---
        function openSettingsWindow() { document.getElementById('settings-window').style.display = 'flex'; }
        function closeSettingsWindow(e) { if (e.target === document.getElementById('settings-window')) document.getElementById('settings-window').style.display = 'none'; }
        function toggleSettingCompression() { configCompression = document.getElementById('setting-compression-toggle').checked; localStorage.setItem('jjs_compression_enabled', configCompression); }
        
        function applyCustomThemeColor(hex) {
            localStorage.setItem('jjs_theme_color', hex);
            document.getElementById('custom-theme-style').innerHTML = `:root { --accent: ${hex} !important; } .account-item:hover { color:#fff !important; }`;
        }

        // --- SYSTEM AUXILIARY UTILITIES AND INTERFACE PROTECTION CODES ---
        function escapeHTML(str) {
            if(!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function customAlert(msg) {
            const overlay = document.createElement('div'); overlay.className = 'jjs-prompt-overlay';
            const box = document.createElement('div'); box.className = 'jjs-prompt-box';
            box.innerHTML = `
                <div class="prompt-title uppercase-force"><i class="fa-solid fa-bell"></i> Broadcast Notification Log Notice</div>
                <div style="font-size:0.8rem; opacity:0.85; line-height:1.4; word-break:break-word;">${escapeHTML(msg)}</div>
                <div class="prompt-buttons"><button class="btn-jjs-action" style="padding:4px 12px; font-size:0.75rem;">Acknowledge Pipeline Trace</button></div>
            `;
            box.querySelector('button').onclick = () => overlay.remove();
            overlay.appendChild(box); document.body.appendChild(overlay);
        }

        function customConfirm(msg, callback) {
            const overlay = document.createElement('div'); overlay.className = 'jjs-prompt-overlay';
            const box = document.createElement('div'); box.className = 'jjs-prompt-box';
            box.innerHTML = `
                <div class="prompt-title uppercase-force"><i class="fa-solid fa-circle-question"></i> System Authorization Acknowledge Challenge</div>
                <div style="font-size:0.8rem; opacity:0.85; line-height:1.4; word-break:break-word;">${escapeHTML(msg)}</div>
                <div class="prompt-buttons">
                    <button class="btn-jjs-action cancel-btn" style="padding:4px 12px; font-size:0.75rem; background:var(--node-card);">Abort Trace</button>
                    <button class="btn-jjs-action confirm-btn" style="padding:4px 12px; font-size:0.75rem;">Authorize Operations Execution</button>
                </div>
            `;
            box.querySelector('.cancel-btn').onclick = () => overlay.remove();
            box.querySelector('.confirm-btn').onclick = () => { overlay.remove(); callback(); };
            overlay.appendChild(box); document.body.appendChild(overlay);
        }
    </script>
</body>
