<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJS Studio - V1.0.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="./zstd-bundle.js"></script>

    <style>
        * {
            text-transform: none !important;
        }
        .sidebar-header h2,
        .btn-jjs-action,
        .container-heading,
        .workspace-tab,
        .menu-label,
        .node-head strong {
            text-transform: uppercase !important;
        }
        :root {
            --bg: #121317;
            --panel: #1a1c23;
            --node-card: #222530;
            --accent: #ffcc33;
            --text: #e2e8f0;
            --border: #2d313f;
            --thickness: 3px;
            --font-main: 'Finger Paint', cursive;
            --font-code: 'Finger Paint', cursive;
        }

        body.theme-retro   { --bg: #3c3f41; --panel: #2b2b2b; --node-card: #313335; --accent: #ff5722; --text: #f5f5f5; --border: #000000; }
        body.theme-matrix  { --bg: #030704; --panel: #0a0f0d; --node-card: #121a16; --accent: #00ff66; --text: #33ff77; --border: #00ff66; }
        body.theme-nova    { --bg: #0f051d; --panel: #18092b; --node-card: #240e42; --accent: #cc33ff; --text: #f3e8ff; --border: #4a1d8a; }
        body.theme-toon    { --bg: #ffffff; --panel: #ffffff; --node-card: #ffffff; --accent: #000000; --text: #000000; --border: #000000; --thickness: 5px; }
        body.theme-shadow  { --bg:#1c1e22; --accent:#00f0ff; --panel:#111215; --text:#c0c5cd; --node-card:#242930; --border:#00f0ff; --thickness:3px; }
        body.theme-crimson { --bg:#141414; --accent:#ff2a4b; --panel:#0b0b0b; --text:#f5f5f5; --node-card:#1f1f1f; --border:#ff2a4b; --thickness:4px; }

        * {
            box-sizing: border-box;
            font-family: var(--font-main);
            border-radius: 0 !important;
            outline: none;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transition: background 0.25s, color 0.25s;
        }

        .sidebar {
            width: 380px;
            min-width: 380px;
            background: var(--panel);
            border-right: var(--thickness) solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            height: 100%;
            overflow-y: auto;
            transition: background 0.2s, border-color 0.2s;
            box-shadow: 5px 0 0 rgba(0,0,0,0.2);
        }

        .sidebar-header {
            padding: 25px;
            border-bottom: var(--thickness) solid var(--border);
            text-align: center;
        }

        .engine-status {
            font-size: 0.7rem;
            padding: 6px 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            width: fit-content;
            margin: 10px auto 0 auto;
        }

        .theme-container {
            margin: 15px;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .theme-control-row { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; }
        .theme-container label { font-size: 0.7rem; color: var(--accent);  }
        .theme-select { background: var(--panel); color: var(--text); border: 2px solid var(--border); padding: 6px; font-size: 0.8rem; cursor: pointer; flex-grow: 1; }
        
        .jjs-action-container { padding: 0 15px 20px 15px; display: flex; gap: 10px; border-bottom: var(--thickness) solid var(--border); }

        .btn-jjs-action { flex: 1; padding: 12px; border: var(--thickness) solid var(--border); background: rgba(0,0,0,0.2); color: var(--text); font-weight: bold; cursor: pointer;  font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, color 0.15s; }
        .btn-jjs-action i { font-size: 0.9rem; color: var(--accent); }
        .btn-jjs-action:hover { background: var(--accent); color: #000; }
        .btn-jjs-action:hover i { color: #000; }

        .container-heading { padding: 15px 20px 5px 20px; font-size: 0.7rem; color: var(--accent);  letter-spacing: 1px; }
        .container-list { padding: 10px 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex-grow: 1; }

        .item { padding: 15px; background: var(--node-card); cursor: pointer; border: var(--thickness) solid var(--border); transition: transform 0.1s, background 0.2s; }
        .item:hover { background: rgba(255,255,255,0.05); }
        .item.active { background: var(--accent); color: #000 !important; border-color: var(--border); }
        .item.active .type-tag, .item.active .move-name { color: #000 !important; }
        
        .item .type-tag { font-size: 0.65rem; color: var(--accent);  display: block; margin-bottom: 2px;}
        .item .move-name { display: block; font-size: 1.1rem; color: var(--text); }

        .main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 40px; height: 100%; display: block; }

        .editor-header { display: flex; flex-direction: column; gap: 15px; border-left: var(--thickness) solid var(--accent); padding-left: 20px; margin-bottom: 25px; }
        
        .btn-delete-container {
            background: #ff4d4d; color: #fff; border: var(--thickness) solid var(--border); padding: 10px 15px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.75rem; 
             transition: transform 0.1s, filter 0.1s;
        }
        .btn-delete-container:hover { transform: translate(-2px, -2px); filter: brightness(1.1); }

        .container-fields-row { display: flex; gap: 15px; }

        .tooltip-field { background: rgba(0,0,0,0.2); border: 1px solid var(--border); padding: 12px; flex: 1; }
        .tooltip-field label { display: block; font-size: 0.65rem; color: var(--accent);  margin-bottom: 5px; }
        .tooltip-field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem; border-bottom: 2px solid #333; font-family: var(--font-code);  }

        .branch-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
        .branch-tab { 
            font-family: var(--font-code); 
            background: var(--panel); 
            border: var(--thickness) solid var(--border); 
            padding: 8px 16px; 
            color: var(--text); 
            font-size: 0.8rem; 
             
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: background 0.1s; 
        }
        .branch-tab:hover { background: rgba(255,255,255,0.1); }
        .branch-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
        
        .branch-tab .edit-icon { opacity: 0.6; font-size: 0.7rem; padding: 4px; transition: opacity 0.1s; }
        .branch-tab .edit-icon:hover { opacity: 1; }
        .branch-tab.active .edit-icon { color: #000; }
        
        .branch-tab .delete-icon { opacity: 0.6; font-size: 0.7rem; padding: 4px; transition: opacity 0.1s; color: #ff4d4d; }
        .branch-tab .delete-icon:hover { opacity: 1; color: #ff1a1a; }
        .branch-tab.active .delete-icon { color: #cc0000; }
        
        .branch-add-btn { background: transparent; border: 2px solid #00ff66; color: #00ff66; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .branch-add-btn:hover { background: #00ff66; color: #000; }

        .workspace-tabs { display: flex; gap: 5px; border-bottom: 2px solid var(--border); margin-bottom: 30px; }
        .workspace-tab { flex: 1; background: transparent; border: none; padding: 12px; color: var(--text); opacity: 0.5; font-size: 0.85rem;  font-weight: bold; cursor: pointer; transition: opacity 0.2s, background 0.2s; border-bottom: 3px solid transparent; }
        .workspace-tab:hover { opacity: 0.8; background: rgba(255,255,255,0.05); }
        .workspace-tab.active { opacity: 1; color: var(--accent); border-bottom: 3px solid var(--accent); background: rgba(0,0,0,0.2); }

        .node-card { background: var(--panel); border: var(--thickness) solid var(--border); margin-bottom: 20px; overflow: hidden; box-shadow: 6px 6px 0px rgba(0,0,0,1); transition: background 0.2s, border-color 0.2s; }
        .node-head { background: rgba(0,0,0,0.3); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: var(--thickness) solid var(--border); user-select: none; cursor: pointer; }
        .node-head:hover { background: rgba(255,255,255,0.03); }

        .node-title-group { display: flex; align-items: center; gap: 12px; }
        .node-title-group strong { color: var(--accent); font-size: 1rem;  }
        .node-summary-tag { color: #8892b0; font-size: 0.8rem; font-family: var(--font-code); }

        .btn-delete-node { background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.1rem; padding: 5px; transition: color 0.1s; }
        .btn-delete-node:hover { color: #ff1a1a; }

        .node-grid { padding: 25px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; background: rgba(0,0,0,0.1); }
        .field { background: rgba(0,0,0,0.2); border: 1px solid var(--border); padding: 12px; }
        .field label { display: block; font-size: 0.65rem; color: #8892b0;  margin-bottom: 6px; }
        .field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 0.95rem; border-bottom: 1px solid var(--border); font-family: var(--font-code);  }
        .field input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; border-bottom: none;  }

        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 1.3rem; color: #4f566b;  text-align: center; line-height: 1.8; }

        .context-menu { position: fixed; display: none; background: #090a0f; border: var(--thickness) solid var(--border); z-index: 10000; padding: 5px 0; min-width: 220px; max-height: 450px; overflow-y: auto; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); }
        .context-menu .menu-label { padding: 6px 15px; font-size: 0.65rem; color: var(--accent);  letter-spacing: 0.5px; background: rgba(255,255,255,0.02); }
        .context-menu .menu-item { padding: 10px 15px; font-size: 0.75rem; color: #e2e8f0; cursor: pointer;  display: flex; justify-content: space-between; align-items: center; }
        .context-menu .menu-item:hover { background: var(--accent); color: #000; }
        .context-menu .menu-separator { height: 1px; background: var(--border); margin: 5px 0; }

        .jjs-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .jjs-modal-box { background: var(--panel); border: var(--thickness) solid var(--border); width: 550px; max-width: 90%; }
        .jjs-modal-header { background: rgba(0,0,0,0.3); padding: 20px; border-bottom: var(--thickness) solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .jjs-modal-title { color: var(--accent);  font-size: 1.1rem; margin: 0; }
        .jjs-modal-close { background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.2rem; }
        .jjs-modal-close:hover { color: #ff1a1a; }
        .jjs-modal-body { padding: 20px; }
        
        .jjs-modal-textarea { width: 100%; height: 220px; background: #090a0f; color: #00ff66; border: 1px solid var(--border); padding: 15px; font-size: 0.85rem; resize: none; font-family: var(--font-code); }
        .jjs-modal-input { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: #fff; font-size: 1rem; font-family: var(--font-code);  }
        
        .jjs-modal-footer { padding: 0 20px 20px 20px; display: flex; justify-content: flex-end; gap: 12px; }
        .btn-modal-confirm { background: var(--accent); color: #000; border: 1px solid var(--border); padding: 10px 20px; font-weight: bold; cursor: pointer;  !important; }
        .btn-modal-confirm:hover { filter: brightness(1.2); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0; color: var(--accent);  font-size: 1.5rem; letter-spacing: 1px;">JJS Studio</h2>
        <div id="engine-status-box" class="engine-status">Loading...</div>
    </div>

    <div class="theme-container">
        <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
            <label>Workspace Theme</label>
        </div>
        <div class="theme-control-row">
            <select class="theme-select" id="global-theme-picker" onchange="previewTheme(this.value)">
                <optgroup label="Standard Themes">
                    <option value="default" selected>Default Dark</option>
                    <option value="retro">Retro</option>
                    <option value="matrix">Matrix</option>
                    <option value="nova">Nova</option>
                    <option value="toon">Toon</option>
                    <option value="shadow">Shadow</option>
                    <option value="crimson">Crimson</option>
                </optgroup>
            </select>
        </div>
    </div>

    <div class="jjs-action-container">
        <button class="btn-jjs-action" onclick="openIOModal('import')"><i class="fa-solid fa-file-import"></i> Import</button>
        <button class="btn-jjs-action" onclick="openIOModal('export')"><i class="fa-solid fa-file-export"></i> Export</button>
    </div>

    <div class="container-heading">Containers</div>
    <div class="container-list" id="sidebar-render-target"></div>
</div>

<div class="main" id="workspace-canvas-timeline"></div>

<div id="shift-a-context-menu" class="context-menu">
    <div class="menu-label">Create Container</div>
    <div class="menu-item" onclick="instantiateContainer('Skill')">Skill <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" onclick="instantiateContainer('Melee')">Melee <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" onclick="instantiateContainer('Special')">Special <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" onclick="instantiateContainer('Awakening')">Awakening <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-item" onclick="instantiateContainer('Chase')">Chase <i class="fa-solid fa-folder-plus"></i></div>
    <div class="menu-separator"></div>
    <div class="menu-label" id="context-menu-nodes-label">Add Node</div>
    <div id="context-menu-nodes-target"></div>
</div>

<div class="jjs-modal-overlay" id="jjs-io-modal" onclick="closeIOModal(event)">
    <div class="jjs-modal-box" onclick="event.stopPropagation()">
        <div class="jjs-modal-header">
            <h3 class="jjs-modal-title" id="io-modal-title-text"><i class="fa-solid fa-terminal"></i> Data Center</h3>
            <button class="jjs-modal-close" onclick="closeIOModal(null)"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="jjs-modal-body" id="io-modal-body-container">
            <textarea class="jjs-modal-textarea" id="io-terminal-textarea"></textarea>
        </div>
        <div class="jjs-modal-footer">
            <button class="btn-modal-confirm" id="io-action-button" onclick="executeIOAction()">Process</button>
        </div>
    </div>
</div>

<div class="jjs-modal-overlay" id="jjs-branch-modal" onclick="closeBranchModal(event)">
    <div class="jjs-modal-box" style="width: 400px;" onclick="event.stopPropagation()">
        <div class="jjs-modal-header">
            <h3 class="jjs-modal-title" id="branch-modal-title-text"><i class="fa-solid fa-code-branch"></i> Branch Config</h3>
            <button class="jjs-modal-close" onclick="closeBranchModal(null)"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="jjs-modal-body">
            <label style="display:block; font-size:0.7rem; color:var(--accent); text-transform:none; margin-bottom:8px;">Branch Name (Case Sensitive)</label>
            <input type="text" class="jjs-modal-input" id="branch-name-input" placeholder="e.g. AirVariant">
        </div>
        <div class="jjs-modal-footer">
            <button class="btn-modal-confirm" onclick="executeBranchAction()">Confirm</button>
        </div>
    </div>
</div>

<script>
    const TRANSLATIONS = {
        "ULTGIB": "ADD AWAKENING", "HPGIB": "ADD HEALTH", "EVGIB": "ADD EVASION",
        "HITCNCL": "HIT CANCEL", "ATK": "ATTACK", "ANIM": "ANIMATION",
        "VELO": "VELOCITY", "PROJ": "PROJECTILE", "SFX": "SOUND",

    const NODE_TEMPLATES = {

        LOOP: ["LOOP BACK", "HOLD", "LOOP AMOUNT"],
        SETCD: ["KEY", "COOLDOWN"]
    };

    const CONDITION_TEMPLATES = {
        AIR: ["FLIP"], JUMP: ["FLIP"], AIM: ["FLIP"], ULT: ["FLIP"],
        BAR: ["FLIP", "AMOUNT"], DUR: ["DURABILITY"], HP: ["FLIP", "AMOUNT"],
        DOMAIN: ["FLIP"], HOLD: ["FLIP"]
    };

    const DEFAULTS_LIB = {
        TIME: 1.0, SPEED: 1.0, START: 0.0, "ENABLE VARIANTS": true, "HOLD FOR": 0.0,
        MOVE: "Divergent Fist", SPEC: "Limitless", "FADE IN": 0.1, PREVIEW: [0, 3.59],
        "FADE OUT": 0.0, "LAST HIT": -1.0, END: 500.0, GLOBAL: false, VOLUME: 0.5,
        "PROJECTILE TAG": "nil", ID: 12222253, CANCEL: false, "TRUE RAGDOLL": false,

        "ATTACK TYPE2": "Melee", STUN: 1.0, DEBREE: 0.0, "BRANCH TARGET": "nil",
        "HIT RAGDOLL": false, BRANCH: "nil", DAMAGE: 1.0, "CANCEL ENEMY": true,
        "360 BLOCK": false, "HIT USER": false, "CLEAR KNOCKBACK": false, RANDOM: "",

        "BODY PART": "HumanoidRootPart", "BODY PART2": "HumanoidRootPart",

    const TYPE_OVERRIDES = {
        ULTGIB: { AMOUNT: 5.0 }, HPGIB: { AMOUNT: 5.0 }, EVGIB: { AMOUNT: 5.0 },
        HITBOX: { PREVIEW: [0, 15] },
        BAR: { AMOUNT: 5.0 }, HP: { AMOUNT: 10.0 }
    };

    let currentMoves = [];
    let activeIndex = -1;
    let zstd = null;
    let ioModalMode = '';
    let mouseX = 0, mouseY = 0;
    
    let activeBranch = 'Default';
    let activeTab = 'Timeline';

    let branchModalMode = '';
    let editingBranchName = '';

    async function initEngine() {
        const engine = window.ZstdWeb || window.zstd || window.Zstd;
        if (engine?.init) {
            await engine.init();
            zstd = engine;
            document.getElementById('engine-status-box').innerHTML = "ZSTD Engine: <span style='color:#00ffcc; font-weight:bold;'>Active</span>";
        } else {
            document.getElementById('engine-status-box').innerHTML = "ZSTD Engine: <span style='color:#ff9900; font-weight:bold;'>Standby</span>";
        }
        
        const cachedTheme = localStorage.getItem('jjs-theme-pref') || 'default';
        const picker = document.getElementById('global-theme-picker');
        if (picker) picker.value = cachedTheme;
        previewTheme(cachedTheme);

        buildContextMenuNodes();
        renderWorkspaceEmpty();
    }

    function previewTheme(styleName) {
        document.body.className = '';
        if (styleName !== 'default') {
            document.body.classList.add('theme-' + styleName);
        }
        localStorage.setItem('jjs-theme-pref', styleName);
    }

    function buildContextMenuNodes() {
        const target = document.getElementById('context-menu-nodes-target');
        const label = document.getElementById('context-menu-nodes-label');
        target.innerHTML = '';
        
        let templates = (activeTab === 'Conditions') ? CONDITION_TEMPLATES : NODE_TEMPLATES;
        label.innerText = (activeTab === 'Conditions') ? 'Add Condition' : 'Add Node';

        Object.keys(templates).forEach(type => {
            const disp = TRANSLATIONS[type] || type;
            const row = document.createElement('div');
            row.className = 'menu-item';
            row.innerHTML = `<span>${disp}</span> <span style="font-size:0.6rem; opacity:0.5; font-family:var(--font-code);">${type}</span>`;
            row.onclick = () => instantiateNode(type);
            target.appendChild(row);
        });
    }

    window.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.altKey && e.shiftKey && e.key.toLowerCase() === 't') {
            e.preventDefault();
            executeLoadMasterCode();
        }
    });

    document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    document.addEventListener('click', e => {
        if (!e.target.closest('#shift-a-context-menu')) {
            document.getElementById('shift-a-context-menu').style.display = 'none';
        }
    });

    window.addEventListener('keydown', function(e) {
        if (e.shiftKey && e.key.toLowerCase() === 'a') {
            const targetTag = e.target.tagName.toLowerCase();
            if (targetTag === 'input' || targetTag === 'textarea') return;
            e.preventDefault();
            const menu = document.getElementById('shift-a-context-menu');
            menu.style.display = 'block';
            menu.style.left = Math.min(mouseX, window.innerWidth - menu.offsetWidth - 10) + 'px';
            menu.style.top = Math.min(mouseY, window.innerHeight - menu.offsetHeight - 10) + 'px';
        }
    });

    function executeLoadMasterCode() {
        if (currentMoves.length > 0) {
            if (!confirm("Are you sure you want to load the master template? This will replace everything you're currently working on.")) return;
        }

        const masterNodeLines = [];
        Object.keys(NODE_TEMPLATES).forEach(nodeType => {
            const uiNode = { "K_NAME": nodeType };
            NODE_TEMPLATES[nodeType].forEach(fieldKey => {
                let val = (TYPE_OVERRIDES[nodeType] && TYPE_OVERRIDES[nodeType][fieldKey] !== undefined)
                    ? TYPE_OVERRIDES[nodeType][fieldKey]
                    : DEFAULTS_LIB[fieldKey];
                if (val !== undefined) uiNode[fieldKey] = JSON.parse(JSON.stringify(val));
            });
            masterNodeLines.push(uiNode);
        });

        const masterReqLines = [];
        Object.keys(CONDITION_TEMPLATES).forEach(nodeType => {
            const uiNode = { "K_NAME": nodeType };
            CONDITION_TEMPLATES[nodeType].forEach(fieldKey => {
                let val = (TYPE_OVERRIDES[nodeType] && TYPE_OVERRIDES[nodeType][fieldKey] !== undefined)
                    ? TYPE_OVERRIDES[nodeType][fieldKey]
                    : DEFAULTS_LIB[fieldKey];
                if (val !== undefined) uiNode[fieldKey] = JSON.parse(JSON.stringify(val));
            });
            masterReqLines.push(uiNode);
        });

        const standardContainers = ['Skill', 'Melee', 'Special', 'Awakening', 'Chase'];
        currentMoves = standardContainers.map((type, idx) => {
            return {
                "ADD": false,
                "NAME": type,
                "K_NAME": type,
                "TOOL TIP": "",
                "COOLDOWN": idx === 0 ? 0 : 1.0,
                "KEY": 1,
                "DATA": JSON.stringify({ 
                    "Line": idx === 0 ? masterNodeLines : [], 
                    "Branch": {}, 
                    "Prop": [], 
                    "Req": idx === 0 ? masterReqLines : [] 
                })
            };
        });

        activeIndex = 0;
        activeBranch = 'Default';
        activeTab = 'Timeline';
        renderSidebar();
        loadMove(0);
    }

    function getInnerData(moveObj) {
        if (!moveObj || !moveObj.DATA) return { Line: [], Branch: {}, Prop: [], Req: [] };
        try {
            let parsed = (typeof moveObj.DATA === 'string') ? JSON.parse(moveObj.DATA) : moveObj.DATA;
            if (!parsed.Branch) parsed.Branch = {};
            if (!parsed.Line) parsed.Line = [];
            if (!parsed.Prop) parsed.Prop = [];
            if (!parsed.Req) parsed.Req = [];
            return parsed;
        } catch(e) {
            return { Line: [], Branch: {}, Prop: [], Req: [] };
        }
    }

    function saveInnerData(moveObj, innerData) {
        try {
            moveObj.DATA = JSON.stringify(innerData);
        } catch(e) {
            console.error("Error saving data");
        }
    }

    function instantiateContainer(type) {
        document.getElementById('shift-a-context-menu').style.display = 'none';
        const newContainer = {
            "ADD": false,
            "NAME": type,
            "K_NAME": type,
            "TOOL TIP": "",
            "COOLDOWN": 1.0,
            "KEY": 1,
            "DATA": JSON.stringify({ "Line": [], "Branch": {}, "Prop": [], "Req": [] })
        };
        currentMoves.push(newContainer);
        activeIndex = currentMoves.length - 1;
        activeBranch = 'Default';
        activeTab = 'Timeline';
        renderSidebar();
        loadMove(activeIndex);
    }

    function instantiateNode(nodeType) {
        document.getElementById('shift-a-context-menu').style.display = 'none';
        if (activeIndex === -1 || currentMoves.length === 0) return alert("Please select or create a container first.");

        const activeMove = currentMoves[activeIndex];
        const innerData = getInnerData(activeMove);
        let targetList = (activeTab === 'Conditions') ? innerData.Req : ((activeBranch === 'Default') ? innerData.Line : innerData.Branch[activeBranch].Line);

        const freshNode = { "K_NAME": nodeType };
        let templates = (activeTab === 'Conditions') ? CONDITION_TEMPLATES : NODE_TEMPLATES;

        templates[nodeType].forEach(field => {
            let fallbackVal = (TYPE_OVERRIDES[nodeType] && TYPE_OVERRIDES[nodeType][field] !== undefined)
                ? TYPE_OVERRIDES[nodeType][field]
                : DEFAULTS_LIB[field];
            if (fallbackVal !== undefined) {
                freshNode[field] = JSON.parse(JSON.stringify(fallbackVal));
            }
        });

        targetList.push(freshNode);
        saveInnerData(activeMove, innerData);
        loadMove(activeIndex);
    }

    function deleteActiveContainer(idx) {
        if (!confirm("Are you sure you want to delete this container and everything inside it?")) return;
        currentMoves.splice(idx, 1);
        if (currentMoves.length === 0) {
            activeIndex = -1;
            renderSidebar();
            renderWorkspaceEmpty();
        } else {
            activeIndex = Math.max(0, idx - 1);
            activeBranch = 'Default';
            renderSidebar();
            loadMove(activeIndex);
        }
    }

    function removeNode(nodeIdx) {
        if (!confirm("Delete this item?")) return;
        const activeMove = currentMoves[activeIndex];
        const innerData = getInnerData(activeMove);
        let targetList = (activeTab === 'Conditions') ? innerData.Req : ((activeBranch === 'Default') ? innerData.Line : innerData.Branch[activeBranch].Line);
        
        targetList.splice(nodeIdx, 1);
        saveInnerData(activeMove, innerData);
        loadMove(activeIndex);
    }

    function toggleNodeBody(nodeIdx) {
        const targetGrid = document.getElementById(`node-grid-${nodeIdx}`);
        if (targetGrid) {
            targetGrid.style.display = (targetGrid.style.display === 'none') ? 'grid' : 'none';
        }
    }

    function generateSummaryHeaderStr(node) {
        if (node.K_NAME === 'WAIT') return `[${node.TIME ?? 0}s]`;
        if (node.K_NAME === 'ANIM') return `[${node.ANIM_USE ?? 'Unset'}]`;
        if (node.K_NAME === 'SFX') return `[ID: ${node.ID ?? 'Unset'}]`;
        if (node.K_NAME === 'HITBOX') return `[Size: ${node.SIZE ?? 'Default'}]`;
        if (node.K_NAME === 'VISUAL') return `[Type: ${node.EFFECT ?? 'Asset'}]`;
        if (node.K_NAME === 'VELO') return `[Force: ${node.FORCE ?? 'Default'}]`;
        if (node.K_NAME === 'PROJECTILE') return `[Damage: ${node.DAMAGE ?? 0}]`;
        if (node.K_NAME === 'HITCNCL') return `[Endlag: ${node.ENDLAG ?? 1.0}]`;
        if (node.K_NAME === 'TAG') return `[${node.TAG ?? 'Unset'}]`;

        if (node.K_NAME === 'BAR') return `[Meter: ${node.AMOUNT ?? 5}]`;
        if (node.K_NAME === 'HP') return `[Health: ${node.AMOUNT ?? 10}]`;
        if (node.K_NAME === 'DUR') return `[Durability: ${node.DURABILITY ?? 1}]`;

        // Updated FLIP logic here:
        if (node.FLIP !== undefined) return node.FLIP ? '[True]' : '[False]';

        return '';
    }

    function alterContainerCoreName(idx, val) {
        currentMoves[idx].NAME = val;
        const buttonTextNode = document.querySelector(`#btn-${idx} .move-name`);
        if (buttonTextNode) buttonTextNode.innerText = val;
    }

    function alterNodeValue(nodeIdx, propertyKey, value) {
        const activeMove = currentMoves[activeIndex];
        const innerData = getInnerData(activeMove);
        let targetList = (activeTab === 'Conditions') ? innerData.Req : ((activeBranch === 'Default') ? innerData.Line : innerData.Branch[activeBranch].Line);
        
        targetList[nodeIdx][propertyKey] = value;
        saveInnerData(activeMove, innerData);

        const textSummarySpan = document.getElementById(`summary-span-${nodeIdx}`);
        if (textSummarySpan) {
            textSummarySpan.innerText = generateSummaryHeaderStr(targetList[nodeIdx]);
        }
    }

    function switchBranch(branchName) {
        activeBranch = branchName;
        loadMove(activeIndex);
    }

    function deleteBranch(branchName) {
        if (!confirm(`Are you sure you want to delete the branch "${branchName}" and all its nodes?`)) return;

        const activeMove = currentMoves[activeIndex];
        const innerData = getInnerData(activeMove);

        delete innerData.Branch[branchName];
        
        if (activeBranch === branchName) {
            activeBranch = 'Default';
        }

        saveInnerData(activeMove, innerData);
        loadMove(activeIndex);
    }

    function switchTab(tabName) {
        activeTab = tabName;
        buildContextMenuNodes(); 
        loadMove(activeIndex);
    }

    function openBranchModal(mode, oldName = '') {
        branchModalMode = mode;
        editingBranchName = oldName;
        const overlay = document.getElementById('jjs-branch-modal');
        const input = document.getElementById('branch-name-input');
        const title = document.getElementById('branch-modal-title-text');
        
        input.value = (mode === 'edit') ? oldName : '';
        title.innerHTML = (mode === 'edit') ? `<i class="fa-solid fa-pen"></i> Rename Branch` : `<i class="fa-solid fa-code-branch"></i> New Branch`;
        
        overlay.style.display = 'flex';
        input.focus();
    }

    function closeBranchModal(e) {
        if (!e || e.target === document.getElementById('jjs-branch-modal')) {
            document.getElementById('jjs-branch-modal').style.display = 'none';
        }
    }

    function executeBranchAction() {
        const newName = document.getElementById('branch-name-input').value.trim();
        if (!newName || newName === 'Default') {
            alert("Invalid branch name. It can't be empty or named 'Default'.");
            return;
        }

        const activeMove = currentMoves[activeIndex];
        const innerData = getInnerData(activeMove);

        if (branchModalMode === 'create') {
            if (innerData.Branch[newName]) {
                activeBranch = newName;
            } else {
                innerData.Branch[newName] = { Req: [], Line: [] };
                activeBranch = newName;
                saveInnerData(activeMove, innerData);
            }
        } else if (branchModalMode === 'edit') {
            if (innerData.Branch[newName] && newName !== editingBranchName) {
                alert("A branch with this name already exists.");
                return;
            }
            innerData.Branch[newName] = innerData.Branch[editingBranchName];
            delete innerData.Branch[editingBranchName];
            if (activeBranch === editingBranchName) {
                activeBranch = newName;
            }
            saveInnerData(activeMove, innerData);
        }
        
        closeBranchModal(null);
        loadMove(activeIndex);
    }

    function renderSidebar() {
        const listContainer = document.getElementById('sidebar-render-target');
        listContainer.innerHTML = '';

        if (currentMoves.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; padding-top:40px; font-size:0.75rem; opacity:0.4;">No containers loaded.</div>`;
            return;
        }

        currentMoves.forEach((move, i) => {
            const btn = document.createElement('div');
            btn.className = `item ${i === activeIndex ? 'active' : ''}`;
            btn.id = `btn-${i}`;
            btn.onclick = () => {
                activeBranch = 'Default';
                activeTab = 'Timeline';
                buildContextMenuNodes(); 
                loadMove(i);
            };
            btn.innerHTML = `
                <span class="type-tag">${move.K_NAME || 'CONTAINER'}</span>
                <span class="move-name">${(move.NAME || 'UNNAMED')}</span>
            `;
            listContainer.appendChild(btn);
        });
    }

    function renderWorkspaceEmpty() {
        document.getElementById('workspace-canvas-timeline').innerHTML = `
            <div class="empty-state">
                Press Shift + A to add nodes or containers.
            </div>
        `;
    }

    function loadMove(idx) {
        if (currentMoves.length === 0) { renderWorkspaceEmpty(); return; }
        activeIndex = idx;

        document.querySelectorAll('.container-list .item').forEach(el => el.classList.remove('active'));
        const targetSideButton = document.getElementById(`btn-${idx}`);
        if (targetSideButton) targetSideButton.classList.add('active');

        const move = currentMoves[idx];
        const innerData = getInnerData(move);
        const branchNames = Object.keys(innerData.Branch).sort();
        const canvas = document.getElementById('workspace-canvas-timeline');

        let html = `
            <div class="editor-header">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h1 style="margin:0; font-size:2.2rem; text-transform:none; letter-spacing:1px; color:var(--accent);">${move.NAME || 'UNNAMED'}</h1>
                    <button class="btn-delete-container" onclick="deleteActiveContainer(${idx})"><i class="fa-solid fa-trash-can"></i> Delete Container</button>
                </div>
                <div class="container-fields-row">
                    <div class="tooltip-field">
                        <label>Name</label>
                        <input type="text" value="${move.NAME || ''}" oninput="alterContainerCoreName(${idx}, this.value)">
                    </div>
                </div>
            </div>
        `;

        if (activeTab === 'Timeline') {
            html += `<div class="branch-bar">`;
            html += `<button class="branch-tab ${activeBranch === 'Default' ? 'active' : ''}" onclick="switchBranch('Default')">Default</button>`;
            branchNames.forEach(b => {
                html += `<button class="branch-tab ${activeBranch === b ? 'active' : ''}" onclick="switchBranch('${b}')">
                            ${b} 
                            <span style="display:flex; gap:2px; margin-left:6px;">
                                <i class="fa-solid fa-pen edit-icon" title="Rename Branch" onclick="openBranchModal('edit', '${b}'); event.stopPropagation();"></i>
                                <i class="fa-solid fa-trash delete-icon" title="Delete Branch" onclick="deleteBranch('${b}'); event.stopPropagation();"></i>
                            </span>
                         </button>`;
            });
            html += `<button class="branch-add-btn" onclick="openBranchModal('create')"><i class="fa-solid fa-plus"></i></button>`;
            html += `</div>`;
        }

        html += `<div class="workspace-tabs">
            <button class="workspace-tab ${activeTab === 'Timeline' ? 'active' : ''}" onclick="switchTab('Timeline')">Timeline</button>
            <button class="workspace-tab ${activeTab === 'Conditions' ? 'active' : ''}" onclick="switchTab('Conditions')">Conditions</button>
            <button class="workspace-tab ${activeTab === 'Properties' ? 'active' : ''}" onclick="switchTab('Properties')">Properties</button>
        </div>`;

        if (activeTab === 'Timeline') {
            const currentNodesList = (activeBranch === 'Default') ? innerData.Line : innerData.Branch[activeBranch].Line;
            
            if (currentNodesList.length === 0) {
                html += `<div style="text-align:center; opacity:0.4; font-size:0.8rem; margin-top:20px; text-transform:none;">No nodes in this branch yet. Press Shift + A to add one.</div>`;
            } else {
                currentNodesList.forEach((node, nodeIdx) => {
                    const translationText = TRANSLATIONS[node.K_NAME] || node.K_NAME;
                    html += `
                        <div class="node-card" id="node-block-${nodeIdx}">
                            <div class="node-head" onclick="toggleNodeBody(${nodeIdx})">
                                <div class="node-title-group">
                                    <strong>${translationText}</strong>
                                    <span class="node-summary-tag" id="summary-span-${nodeIdx}">${generateSummaryHeaderStr(node)}</span>
                                </div>
                                <div style="display:flex; align-items:center; gap:20px;">
                                    <span style="font-family:var(--font-code); font-weight:bold; color:var(--accent); font-size:0.85rem;">#${nodeIdx + 1}</span>
                                    <button class="btn-delete-node" onclick="removeNode(${nodeIdx}); event.stopPropagation();"><i class="fa-solid fa-square-minus"></i></button>
                                </div>
                            </div>
                            <div class="node-grid" id="node-grid-${nodeIdx}" style="display:none;">
                                ${buildPropertyFieldsMarkup(node, nodeIdx, 'Timeline')}
                            </div>
                        </div>
                    `;
                });
            }
        } else if (activeTab === 'Conditions') {
            const currentReqList = innerData.Req || [];
            
            if (currentReqList.length === 0) {
                html += `<div style="text-align:center; opacity:0.4; font-size:0.8rem; margin-top:20px; text-transform:none;">No conditions applied to this container. Press Shift + A to add one.</div>`;
            } else {
                currentReqList.forEach((node, nodeIdx) => {
                    const translationText = TRANSLATIONS[node.K_NAME] || node.K_NAME;
                    html += `
                        <div class="node-card" id="node-block-${nodeIdx}">
                            <div class="node-head" onclick="toggleNodeBody(${nodeIdx})">
                                <div class="node-title-group">
                                    <strong>${translationText}</strong>
                                    <span class="node-summary-tag" id="summary-span-${nodeIdx}">${generateSummaryHeaderStr(node)}</span>
                                </div>
                                <div style="display:flex; align-items:center; gap:20px;">
                                    <span style="font-family:var(--font-code); font-weight:bold; color:var(--accent); font-size:0.85rem;">#${nodeIdx + 1}</span>
                                    <button class="btn-delete-node" onclick="removeNode(${nodeIdx}); event.stopPropagation();"><i class="fa-solid fa-square-minus"></i></button>
                                </div>
                            </div>
                            <div class="node-grid" id="node-grid-${nodeIdx}" style="display:none;">
                                ${buildPropertyFieldsMarkup(node, nodeIdx, 'Conditions')}
                            </div>
                        </div>
                    `;
                });
            }
        } else {
            html += `<div class="empty-state" style="margin-top:20px;">[ ${activeTab} tab is under construction ]</div>`;
        }

        canvas.innerHTML = html;
    }

    function buildPropertyFieldsMarkup(node, nodeIdx, context = 'Timeline') {
        let fieldsHtml = '';
        const schemaFields = (context === 'Conditions' ? CONDITION_TEMPLATES[node.K_NAME] : NODE_TEMPLATES[node.K_NAME]) || Object.keys(node);

        schemaFields.forEach(fieldKey => {
            if (fieldKey === 'K_NAME') return;
            const currentVal = node[fieldKey] !== undefined ? node[fieldKey] : DEFAULTS_LIB[fieldKey];
            
            let targetInputMarkup = '';
            if (typeof currentVal === 'boolean' || currentVal === 'true' || currentVal === 'false') {
                const checkedAttr = (currentVal === true || currentVal === 'true') ? 'checked' : '';
                targetInputMarkup = `<input type="checkbox" ${checkedAttr} onchange="alterNodeValue(${nodeIdx}, '${fieldKey}', this.checked)">`;
            } else if (Array.isArray(currentVal)) {
                targetInputMarkup = `<input type="text" value="${currentVal.join(', ')}" oninput="alterNodeValue(${nodeIdx}, '${fieldKey}', this.value.split(',').map(n => parseFloat(n.trim()) || n.trim()))">`;
            } else if (typeof currentVal === 'number' || (!isNaN(currentVal) && currentVal !== '')) {
                targetInputMarkup = `<input type="number" step="0.01" value="${currentVal}" oninput="alterNodeValue(${nodeIdx}, '${fieldKey}', parseFloat(this.value) || 0)">`;
            } else {
                targetInputMarkup = `<input type="text" value="${currentVal ?? ''}" oninput="alterNodeValue(${nodeIdx}, '${fieldKey}', this.value)">`;
            }

            fieldsHtml += `
                <div class="field">
                    <label>${fieldKey}</label>
                    ${targetInputMarkup}
                </div>
            `;
        });

        return fieldsHtml;
    }

    function openIOModal(mode) {
        ioModalMode = mode;
        const overlay = document.getElementById('jjs-io-modal');
        const title = document.getElementById('io-modal-title-text');
        const tx = document.getElementById('io-terminal-textarea');
        const btn = document.getElementById('io-action-button');

        tx.value = '';
        overlay.style.display = 'flex';

        if (mode === 'import') {
            title.innerHTML = "<i class='fa-solid fa-file-import'></i> Import Data";
            tx.placeholder = "Paste your moveset data here...";
            tx.readOnly = false;
            btn.innerText = "Import";
        } else if (mode === 'export') {
            title.innerHTML = "<i class='fa-solid fa-file-export'></i> Export Data";
            tx.readOnly = true;
            btn.innerText = "Copy to Clipboard";

            if (currentMoves.length === 0) {
                tx.value = "[]";
                return;
            }

            try {
                if (!zstd) {
                    tx.value = JSON.stringify(currentMoves, null, 2);
                } else {
                    const encodedBinary = zstd.compress(new TextEncoder().encode(JSON.stringify(currentMoves)), 3);
                    let base64BinaryStr = "";
                    for (let i = 0; i < encodedBinary.length; i++) {
                        base64BinaryStr += String.fromCharCode(encodedBinary[i]);
                    }
                    tx.value = btoa(base64BinaryStr);
                }
            } catch (err) {
                tx.value = JSON.stringify(currentMoves, null, 2);
            }
        }
    }

    function closeIOModal(e) {
        if (!e || e.target === document.getElementById('jjs-io-modal')) {
            document.getElementById('jjs-io-modal').style.display = 'none';
        }
    }

    function executeIOAction() {
        const tx = document.getElementById('io-terminal-textarea');
        if (ioModalMode === 'export') {
            tx.select();
            document.execCommand('copy');
            alert("Data copied to clipboard!");
            closeIOModal(null);
        } else if (ioModalMode === 'import') {
            const rawVal = tx.value.trim();
            if (!rawVal) return;
            try {
                if (rawVal.startsWith('[') || rawVal.startsWith('{')) {
                    currentMoves = JSON.parse(rawVal);
                } else {
                    if (!zstd) { alert("ZSTD Engine is still loading. Please wait a moment."); return; }
                    const rawBuffer = Uint8Array.from(atob(rawVal), c => c.charCodeAt(0));
                    currentMoves = JSON.parse(new TextDecoder().decode(zstd.decompress(rawBuffer)));
                }

                if (!Array.isArray(currentMoves)) currentMoves = [currentMoves];
                activeIndex = currentMoves.length > 0 ? 0 : -1;
                activeBranch = 'Default';
                activeTab = 'Timeline';
                renderSidebar();
                loadMove(activeIndex);
                closeIOModal(null);
            } catch(e) {
                alert("Import failed. Please make sure the code is correct.");
            }
        }
    }

    window.addEventListener('DOMContentLoaded', initEngine);
</script>
</body>
</html>
